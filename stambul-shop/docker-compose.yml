services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    volumes: [shop_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly no
    volumes: [shop_redis:/data]
    restart: unless-stopped

  # Схема и справочники. Запускается вручную: docker compose run --rm migrate
  migrate:
    build: ./backend
    command: python -m app.db.create
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@db:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]

  api:
    build: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@db:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
      MEDIA_CACHE_DIR: /data/media_cache
    volumes: [shop_media:/data/media_cache]
    # наружу не торчим: наверх ходит только nginx
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  bot:
    build: ./backend
    command: python -m app.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@db:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq app.workers.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@db:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  miniapp:
    build:
      context: ./miniapp
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-}
    ports: ["127.0.0.1:${MINIAPP_PORT:-8100}:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  shop_pg:
  shop_redis:
  shop_media:
