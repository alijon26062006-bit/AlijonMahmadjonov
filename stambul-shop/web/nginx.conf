server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 12m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml text/plain;

    # DNS Docker'а. Имя api резолвится в момент запроса, а не при старте —
    # иначе nginx падает, если бэкенд ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API проксируется на бэкенд — сайт и API на одном адресе,
    # поэтому наружу нужен один домен и нет забот с CORS.
    location /api/ {
        set $backend "api:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $backend "api:8000";
        proxy_pass http://$backend;
    }

    # Карту сайта и robots.txt собирает бэкенд: список товаров меняется,
    # а файл в образе застыл бы на момент сборки.
    location = /sitemap.xml {
        set $backend "api:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        set $backend "api:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # Страница товара. Человеку отдаём приложение, роботу — разметку с
    # заголовком, ценой и картинкой: одностраничное приложение робот не
    # выполнит и увидит пустую страницу, а мессенджер не покажет превью.
    location ~ ^/p/ {
        set $backend "api:8000";
        if ($http_user_agent ~* "(bot|crawler|spider|facebookexternalhit|WhatsApp|TelegramBot|Twitterbot|Slackbot|vkShare|Discordbot|LinkedInBot|Applebot|Google|Yandex|Bing)") {
            proxy_pass http://$backend;
        }
        try_files $uri /index.html;
    }

    # SPA-роутинг
    location / {
        try_files $uri /index.html;
    }

    # index.html — всегда свежий, иначе после обновления магазина у людей
    # неделю висит старая версия
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Хешированные ассеты — навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
