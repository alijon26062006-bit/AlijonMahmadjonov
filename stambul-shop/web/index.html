<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />

    <title>Stambul Shop — одежда, обувь и всё для дома</title>
    <meta name="description"
          content="Одежда, обувь, аксессуары, детские вещи, посуда и техника. Доставка по Казахстану, оплата через Kaspi." />

    <!-- Превью при отправке ссылки: в мессенджере видно карточку, а не
         голый адрес. Для страницы товара эти теги подменяет сервер. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stambul Shop" />
    <meta property="og:title" content="Stambul Shop" />
    <meta property="og:description"
          content="Одежда, обувь и всё для дома. Доставка по Казахстану." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Фон рисуется до загрузки приложения, чтобы не мигало белым в тёмной теме */
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #0b0b0b; }
      }
      html[data-theme='dark'] { background: #0b0b0b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
