server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 12m;

    # DNS Docker'а. Имя api резолвится в момент запроса, а не при старте —
    # иначе nginx падает, если бэкенд ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API проксируется на бэкенд — сайт и API на одном адресе,
    # поэтому наружу нужен один домен и нет забот с CORS.
    location /api/ {
        set $backend "api:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $backend "api:8000";
        proxy_pass http://$backend;
    }

    # SPA-роутинг
    location / {
        try_files $uri /index.html;
    }

    # index.html — всегда свежий (Telegram агрессивно кэширует Mini App)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Хешированные ассеты — навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
