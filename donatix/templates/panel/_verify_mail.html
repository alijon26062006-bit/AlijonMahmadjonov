{% if verify_mail %}
<form class="flash warn verify-mail" method="post" action="/panel/verify-email">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <span>📧 Подтвердите почту <b>{{ user.email }}</b> — откройте письмо от нас и нажмите «Подтвердить почту».
    Письма нет? Проверьте «Спам».</span>
  <button class="btn sm">Отправить ещё раз</button>
</form>
<style>.verify-mail{align-items:center;flex-wrap:wrap}.verify-mail span{flex:1;min-width:200px}</style>
{% endif %}
