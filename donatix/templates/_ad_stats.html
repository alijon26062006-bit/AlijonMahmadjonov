{#- Цифры баннера: просмотры на сайте, показы в ботах, нажатия, доля нажавших. Каждый человек — раз в день, роботы не считаются. -#}
<div class="ads-nums">
  <div><span>На сайте</span><b>{{ b.views }}</b></div>
  <div><span>В ботах</span><b>{{ b.bot_views }}</b></div>
  <div><span>Нажатия</span><b>{{ b.clicks }}</b></div>
  <div><span>Нажали</span><b>{{ ad_ctr((b.views or 0) + (b.bot_views or 0), b.clicks) }}</b></div>
</div>
