        for (let s = -1; s <= 1; s++) { const st = new THREE.Mesh(new THREE.BoxGeometry(.55, .92, .52), stripe); st.position.set(s * 1.05, .55, 0); g.add(st); }
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), new THREE.MeshBasicMaterial({color: 0xffd23d})); lamp.position.set(0, 1.15, 0); g.add(lamp);
      } else for (const cx of [-1, 0, 1]) { const c = new THREE.Mesh(new THREE.ConeGeometry(.34, 1.0, 12), cone); c.position.set(cx * .95, .5, 0); g.add(c);
        const band = new THREE.Mesh(new THREE.CylinderGeometry(.2, .25, .16, 12), white); band.position.set(cx * .95, .55, 0); g.add(band); }
      obsGroup.add(g); OBS.push({z, x: LANES[ln], g, hit: false});
    }
    z += 62 + rnd(seed, 300 + k) * 46; k++;
  }
}

/* ── состояние ── */
let P = null, me = null, flames = null, garageCar = null, mode = 'load', spin = 0;
let room = null, others = {}, bots = [], tOff = 0, startAt = 0, state = null, lastTick = 0, ticking = false;
const steer = {l: false, r: false, target: null};
const rivals = new THREE.Group(); world.add(rivals);
const nowS = () => (Date.now() + tOff) / 1000;
const show = (id, on) => $(id).classList.toggle('hide', !on);

function garage() {
  mode = 'garage'; world.visible = false; stage.visible = true; scene.fog.near = 40; rivals.clear(); others = {}; bots = [];
  if (me) { scene.remove(me); me = null; }
  if (!garageCar) { garageCar = makeCar(P.color); stage.add(garageCar); } else setColor(garageCar, P.color);
  show('garage', true); show('hud', false); show('res', false); show('msg', false);
  $('g-coins').textContent = '🪙 ' + P.coins; $('g-wins').textContent = '🏆 ' + P.wins;
  $('g-sub').textContent = t('sub', P.prizes[1]); $('g-day').textContent = t('day', P.day_left);
  $('g-on').textContent = '● ' + Math.max(1, P.online) + ' ' + t('online');
  $('colors').innerHTML = P.colors.map(c => `<div class="sw ${c.code === P.color ? 'on' : ''}" data-c="${c.code}"><i style="background:${c.hex || '#7a2bd6'}"></i>${P.owned.includes(c.code) ? '✓' : c.price + ' 🪙'}</div>`).join('');
}
$('colors').addEventListener('click', async e => {
  const el = e.target.closest('.sw'); if (!el) return; const c = P.colors.find(x => x.code === el.dataset.c);
  if (!P.owned.includes(c.code)) { if (P.coins < c.price) { toast(t('few') + ': ' + c.price + ' 🪙'); setColor(garageCar, c.code); setTimeout(() => setColor(garageCar, P.color), 1400); return; }
    if (!confirm((RU ? c.ru : c.tj) + ' — ' + c.price + ' 🪙. ' + t('buy'))) return; }
  try { const r = await api('shop', {color: c.code}); Object.assign(P, r); haptic('light'); garage(); } catch (err) { toast(err.message); }
});
function toast(text) { const h = $('hit'); h.textContent = text; h.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => { h.style.opacity = 0; }, 1400); }
$('b-top').onclick = () => { alert('🏆 ' + t('top') + '\n\n' + (P.top.length ? P.top.map((r, i) => `${i + 1}. ${r.name || '—'} — ${r.wins} 🏆 (${r.races})`).join('\n') : '—')); };
$('back').onclick = e => { if (mode === 'race' || mode === 'wait') e.preventDefault(); };

async function start() {
  if (mode !== 'garage' && mode !== 'result') return;
  $('b-start').disabled = true;
  try { room = await api('join'); } catch (err) { $('b-start').disabled = false; toast(err.message); return; }
  $('b-start').disabled = false;
  tOff = room.now * 1000 - Date.now(); startAt = room.now + room.start_in;
  mode = 'wait'; show('garage', false); show('res', false); show('hud', true); show('msg', true); stage.visible = false; world.visible = true;
  buildObstacles(room.seed); rivals.clear(); others = {}; bots = [];
  if (me) scene.remove(me); me = makeCar(P.color); flames = makeFlames(); me.add(flames); scene.add(me);
  state = {z: 0, x: 0, v: 0, nitro: 3, nitroT: 0, slowT: 0, shake: 0, done: false, botsReady: false};
  $('nn').textContent = 3; $('nitro').classList.remove('off'); syncPlayers(room.players);
}
function syncPlayers(list) {
  const seen = {};
  for (const p of list) { if (p.user_id === P.me) continue; seen[p.user_id] = 1;
    let o = others[p.user_id]; if (!o) { o = others[p.user_id] = {car: makeCar(p.color), name: p.name, x: p.x}; rivals.add(o.car); }
    o.z = p.z; o.v = p.fin_ms ? 0 : p.v; o.tx = p.x; o.at = performance.now(); o.fin = p.fin_ms; }
  for (const id in others) if (!seen[id] && !state.botsReady) { rivals.remove(others[id].car); delete others[id]; }
}
function makeBots() {       // свободные места — боты; у всех игроков они одинаковые (из зерна комнаты)
  const n = Math.max(0, CFG.max_cars - 1 - Object.keys(others).length), codes = P.colors.map(c => c.code);
  for (let i = 0; i < n; i++) { const b = {i, v: botV(room.seed, i), car: makeCar(codes[1 + Math.floor(rnd(room.seed, 40 + i) * (codes.length - 1))]), lane: LANES[(i + Math.floor(rnd(room.seed, 60 + i) * 3)) % 3]};
    rivals.add(b.car); bots.push(b); }
  state.botsReady = true;
}
async function doTick() {
  if (ticking || !room) return; ticking = true;
  try { const r = await api('tick', {room: room.room, z: state.z, x: state.x, v: state.v}); syncPlayers(r.players); } catch (e) {}
  ticking = false;
}
function crash(kind) { state.v *= kind === 'obs' ? .32 : .7; state.shake = .45; haptic(kind === 'obs' ? 'heavy' : 'medium'); const h = $('hit'); h.textContent = t(kind === 'obs' ? 'crash' : 'bump'); h.style.opacity = 1; clearTimeout(crash.t); crash.t = setTimeout(() => { h.style.opacity = 0; }, 900); }

function stepRace(dt, tt) {
  const s = state, list = [];
  if (!s.botsReady && tt > -1.2) makeBots();
  for (const b of bots) { b.z = botZ(b.v, tt); b.x = b.lane + Math.sin(tt * .45 + b.i * 2.3) * 1.1; list.push(b); }
  for (const id in others) { const o = others[id]; o.pz = o.fin ? CFG.track + 20 : Math.min(CFG.track + 20, o.z + o.v * (performance.now() - o.at) / 1000); o.x += (o.tx - o.x) * Math.min(1, dt * 8); list.push({z: o.pz, x: o.x, v: o.v, car: o.car}); }
  if (tt >= 0 && !s.done) {
    const dir = (steer.r ? 1 : 0) - (steer.l ? 1 : 0);
    if (dir) { s.x += dir * 10 * dt; steer.target = null; } else if (steer.target !== null) s.x += Math.max(-10 * dt, Math.min(10 * dt, steer.target - s.x));
    s.x = Math.max(-5.3, Math.min(5.3, s.x));
    if (s.nitroT > 0) s.nitroT -= dt;
    const vmax = s.nitroT > 0 ? CFG.vnitro : CFG.vmax;
    s.v += (s.v < vmax ? (s.nitroT > 0 ? 34 : 15) : -22) * dt; if (Math.abs(s.v - vmax) < .6) s.v = vmax;
    const z0 = s.z; s.z += s.v * dt;
    for (const o of OBS) if (!o.hit && o.z > z0 - 1 && o.z - s.z < 2.3 && o.z - s.z > -2 && Math.abs(o.x - s.x) < 2.25) { o.hit = true; crash('obs'); o.g.rotation.z = .5; o.g.position.y = .4; }
    for (const c of list) { const dz = c.z - s.z; if (dz > 0 && dz < 4.5 && Math.abs(c.x - s.x) < 1.95 && s.v > (c.v || 0)) { s.z = c.z - 4.5; if (s.slowT <= 0) { crash('car'); s.slowT = .6; } s.v = Math.min(s.v, (c.v || 30) * .82); } }
    if (s.slowT > 0) s.slowT -= dt;
    if (s.z >= CFG.track) { s.z = CFG.track; s.done = true; finish(Math.round(tt * 1000)); }
  } else if (s.done) { s.v = Math.max(0, s.v - 30 * dt); s.z += s.v * dt; }
  // картинка
  layoutWorld(s.z); const dir = (steer.r ? 1 : 0) - (steer.l ? 1 : 0);
  me.position.set(s.x, 0, 0); me.rotation.y += (-dir * .2 - me.rotation.y) * Math.min(1, dt * 9); me.rotation.z = -me.rotation.y * .35;
  animFlames(flames, s.nitroT > 0 ? 1 : 0, tt);
  for (const c of list) { c.car.position.set(c.x, 0, -(c.z - s.z)); c.car.visible = Math.abs(c.z - s.z) < 170; }
  for (const o of OBS) { o.g.position.x = o.x; o.g.position.z = -(o.z - s.z); o.g.visible = o.z - s.z < 170 && o.z - s.z > -12; }
  if (s.shake > 0) s.shake -= dt;
  const sh = s.shake > 0 ? s.shake * .5 : 0, boost = s.nitroT > 0 ? 1 : 0;
  cam.fov += ((60 + boost * 12 + s.v * .08) - cam.fov) * Math.min(1, dt * 4); cam.updateProjectionMatrix();
  cam.position.set(s.x * .55 + (Math.random() - .5) * sh, 4.2 + (Math.random() - .5) * sh, 10.2 + boost * .8); cam.lookAt(s.x * .7, 1.0, -9);
  // интерфейс
  const place = 1 + list.filter(c => c.z > s.z).length; $('pos').innerHTML = place + ' <i>/ ' + (list.length + 1) + '</i>';
  const sec = Math.max(0, tt); $('time').textContent = Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  $('spd').textContent = Math.round(s.v * 3.4) + ' ' + t('km');
  $('bar-in').innerHTML = list.map(c => `<i style="left:${Math.min(100, c.z / CFG.track * 100)}%;background:#8a86b8"></i>`).join('') + `<i style="left:${s.z / CFG.track * 100}%;background:#3ddc84;z-index:2"></i>`;
  const m = $('msg');
  if (tt < 0) { show('msg', true); m.innerHTML = Math.ceil(-tt) + `<small>${t('wait')} · ${Object.keys(others).length + 1}/${CFG.max_cars}</small>`; }
  else if (tt < 1) { show('msg', true); m.innerHTML = t('go'); if (mode === 'wait') { mode = 'race'; haptic('rigid'); } }
  else show('msg', false);
}
async function finish(ms) {
  haptic('rigid'); let r;
  try { r = await api('finish', {room: room.room, ms}); } catch (err) { r = {place: 0, won: 0, coins: P.coins, wins: P.wins, day_left: P.day_left, error: err.message}; }
  P.coins = r.coins; P.wins = r.wins; P.day_left = r.day_left; mode = 'result';
  $('res-place').textContent = r.place ? ['🥇', '🥈', '🥉'][r.place - 1] || ('#' + r.place) : '🏁';
  $('res-sub').textContent = r.error ? r.error : `${r.place} ${t('place')} · ${(ms / 1000).toFixed(1)} с`;
  $('res-won').textContent = r.won ? t('won', r.won) : (r.place && r.place <= 3 ? t('nowon') : '');
  show('res', true); show('hud', false);
}
$('res-again').onclick = start; $('b-start').onclick = start;
$('res-garage').onclick = async () => { try { Object.assign(P, await api('profile')); } catch (e) {} garage(); };
$('nitro').onclick = () => { const s = state; if (mode !== 'race' || !s || s.done || s.nitro <= 0 || s.nitroT > 0) return; s.nitro--; s.nitroT = 2.4; $('nn').textContent = s.nitro; if (!s.nitro) $('nitro').classList.add('off'); haptic('heavy'); };
for (const [id, k] of [['left', 'l'], ['right', 'r']]) { const b = $(id); const on = e => { e.preventDefault(); steer[k] = true; }, off = e => { e.preventDefault(); steer[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off); }
R.domElement.addEventListener('pointermove', e => { if (mode === 'race' && e.buttons) steer.target = (e.clientX / innerWidth - .5) * 11.5; });
R.domElement.addEventListener('pointerdown', e => { if (mode === 'race') steer.target = (e.clientX / innerWidth - .5) * 11.5; });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') steer.l = true; if (e.key === 'ArrowRight') steer.r = true; if (e.key === ' ') $('nitro').onclick(); });
addEventListener('keyup', e => { if (e.key === 'ArrowLeft') steer.l = false; if (e.key === 'ArrowRight') steer.r = false; });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'garage') { spin += dt * .6; garageCar.rotation.y = spin; cam.fov = 60; cam.updateProjectionMatrix(); cam.position.set(0, 2.5, 8.6); cam.lookAt(0, .9, 0); }
  else if (mode === 'wait' || mode === 'race' || mode === 'result') { stepRace(dt, nowS() - startAt); if (now - lastTick > 250 && mode !== 'result') { lastTick = now; doTick(); } }
  R.render(scene, cam); requestAnimationFrame(frame);
}

(async () => {
  if (!INIT) { $('load-t').textContent = t('need'); return; }
  try { [P] = await Promise.all([api('profile'), loadCar()]); } catch (err) { $('load-t').textContent = err.message === 'net' ? 'Нет связи' : err.message; return; }
  CFG = P; for (const c of P.colors) HEX[c.code] = c.hex;
  show('load', false); garage(); requestAnimationFrame(frame);
  setInterval(async () => { if (mode === 'garage') try { const r = await api('profile'); P.online = r.online; P.top = r.top; $('g-on').textContent = '● ' + Math.max(1, P.online) + ' ' + t('online'); } catch (e) {} }, 8000);
})();
window.__dx = {get mode() { return mode; }, get state() { return state; }, start, steer};
</script>
</body></html>
