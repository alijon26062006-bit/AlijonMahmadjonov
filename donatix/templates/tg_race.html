    $('sh-b').innerHTML = tgl('sound', '🔊', 'sound') + tgl('vibro', '📳', 'vibro') +
      `<div class="row"><div><b>🎮 ${t('wheel')}</b><small>${t('wheelS')}</small></div><div class="seg"><button data-w="btn" class="${SET.steer === 'btn' ? 'on' : ''}">${t('btns')}</button><button data-w="tilt" class="${SET.steer === 'tilt' ? 'on' : ''}">${t('tilt')}</button></div></div>` +
      (SET.steer === 'tilt' ? tgl('inv', '🔁', 'inv', 'invS') : '') + tgl('auto', '🦶', 'auto', 'autoS'); }
  if (kind === 'top') { $('sh-t').textContent = '🏆 ' + t('top');
    $('sh-b').innerHTML = P.top.length ? P.top.map((r, i) => `<div class="row"><div><b>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${(r.name || '—').replace(/[<>&]/g, '')}</b><small>${r.races} 🏁</small></div><b>${r.wins} 🏆</b></div>`).join('') : `<div class="note">${t('empty')}</div>`; }
}
$('sh-x').onclick = () => sheet(''); $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') sheet(''); });
$('b-tune').onclick = () => sheet('tune'); $('b-set').onclick = () => sheet('set'); $('b-top').onclick = () => sheet('top');
$('sh-b').addEventListener('click', async e => {
  const u = e.target.closest('[data-u]'), s = e.target.closest('[data-s]'), w = e.target.closest('[data-w]');
  if (u) { try { Object.assign(P, await api('upgrade', {key: u.dataset.u})); haptic('medium', 30); beep(660, .09); beep(990, .14, 'sine', .5, .09); $('g-coins').textContent = '🪙 ' + P.coins; sheet('tune'); } catch (err) { toast(err.message, 2000); } }
  if (s) { const k = s.dataset.s; SET[k] = !SET[k]; saveSet(); if (k === 'sound' && AU.master) AU.master.gain.value = SET.sound ? 1 : 0; haptic('light', 20); beep(700, .08); sheet('set'); }
  if (w) { if (w.dataset.w === 'tilt') { if (!await tiltOn(true)) return; } SET.steer = w.dataset.w; saveSet(); sheet('set'); }
});

/* ── руль наклоном: датчик ускорения телефона (боковая составляющая силы тяжести) ── */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let tiltSeen = false, tiltBound = false;
function onMotion(e) { const a = e.accelerationIncludingGravity; if (!a || a.x === null) return; tiltSeen = true; setTilt((IOS ? -a.x : a.x)); }
function setTilt(ax) { let v = Math.max(-1, Math.min(1, -ax / 3.6)); if (Math.abs(v) < .07) v = 0; if (SET.inv) v = -v; steer.tilt += (v - steer.tilt) * .35; }
async function tiltOn(check) {
  try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' && await DeviceMotionEvent.requestPermission() !== 'granted') { toast(t('nosens'), 2200); return false; } } catch (e) {}
  if (!tiltBound) { addEventListener('devicemotion', onMotion); tiltBound = true; }
  if (check && !tiltSeen) {
    await new Promise(r => setTimeout(r, 900));
    if (!tiltSeen && tg && tg.Accelerometer) try { tg.Accelerometer.start({refresh_rate: 20}); tg.onEvent('accelerometerChanged', () => { tiltSeen = true; setTilt(tg.Accelerometer.x); }); await new Promise(r => setTimeout(r, 900)); } catch (e) {}
    if (!tiltSeen) { toast(t('nosens'), 2200); return false; }
  }
  return true;
}

async function start(solo) {
  if (mode !== 'garage' && mode !== 'result') return;
  solo = typeof solo === 'boolean' ? solo : lastSolo; lastSolo = solo; audioInit(); if (SET.steer === 'tilt') tiltOn(false);
  try { room = await api('join', {solo}); } catch (err) { toast(err.message); return; }
  tOff = room.now * 1000 - Date.now(); startAt = room.now + room.start_in; lastCount = 9;
  mode = 'wait'; sheet(''); show('garage', false); show('res', false); show('hud', true); show('msg', true); stage.visible = false; world.visible = true;
  $('ctl').classList.toggle('tilt', SET.steer === 'tilt'); $('ctl').classList.toggle('auto', SET.auto);
  buildTrack(room.seed); rivals.clear(); others = {}; bots = []; for (const p of smoke) { p.life = 0; p.s.visible = false; }
  if (me) scene.remove(me); me = makeCar(P.color); flames = makeFlames(); me.userData.body.add(flames); scene.add(me);
  state = {z: 0, x: 0, v: 0, nitro: 2, nitroT: 0, slowT: 0, shake: 0, done: false, botsReady: false, drift: false, driftT: 0, yaw: 0, wallT: 0, solo, ...car()};
  steer.gas = steer.brake = steer.l = steer.r = false; nitroUI(); syncPlayers(room.players);
}
function nitroUI(pop) { const s = state; $('nn').textContent = s.nitro; $('nitro').classList.toggle('off', !s.nitro); if (pop) { $('nitro').classList.remove('pop'); void $('nitro').offsetWidth; $('nitro').classList.add('pop'); } }
function addNitro(text) { const s = state; if (s.nitro < NITRO_MAX) s.nitro++; nitroUI(true); toast(text, 900); haptic('light', 25); beep(880, .08, 'triangle'); beep(1320, .14, 'triangle', .5, .07); }
function syncPlayers(list) {
  const seen = {};
  for (const p of list) { if (p.user_id === P.me) continue; seen[p.user_id] = 1;
    let o = others[p.user_id]; if (!o) { o = others[p.user_id] = {car: makeCar(p.color), name: p.name, x: p.x}; rivals.add(o.car); }
    o.z = p.z; o.v = p.fin_ms ? 0 : p.v; o.tx = p.x; o.at = performance.now(); o.fin = p.fin_ms; }
  for (const id in others) if (!seen[id] && !state.botsReady) { rivals.remove(others[id].car); delete others[id]; }
}
function makeBots() {       // свободные места — боты; у всех игроков они одинаковые (из зерна комнаты)
  const n = Math.max(0, CFG.max_cars - 1 - Object.keys(others).length), codes = P.colors.map(c => c.code);
  for (let i = 0; i < n; i++) { const b = {i, v: botV(room.seed, i), car: makeCar(codes[1 + Math.floor(rnd(room.seed, 40 + i) * (codes.length - 1))]), lane: LANES[(i + Math.floor(rnd(room.seed, 60 + i) * 3)) % 3]};
    rivals.add(b.car); bots.push(b); }
  state.botsReady = true;
}
async function doTick() {
  if (ticking || !room) return; ticking = true;
  try { const r = await api('tick', {room: room.room, z: state.z, x: state.x, v: state.v}); syncPlayers(r.players); } catch (e) {}
  ticking = false;
}
function crash(kind) { const s = state; s.v *= kind === 'obs' ? .32 : .7; s.shake = .45; s.drift = false; haptic(kind === 'obs' ? 'heavy' : 'medium', kind === 'obs' ? 180 : 90); boom(kind === 'obs' ? 1 : .6); toast(t(kind === 'obs' ? 'crash' : 'bump'), 900); }

function stepRace(dt, tt) {
  const s = state, list = [];
  if (!s.botsReady && tt > -1.2) makeBots();
  for (const b of bots) { b.z = botZ(b.v, tt); b.x = b.lane + Math.sin(tt * .45 + b.i * 2.3) * 1.1; list.push(b); }
  for (const id in others) { const o = others[id]; o.pz = o.fin ? CFG.track + 20 : Math.min(CFG.track + 20, o.z + o.v * (performance.now() - o.at) / 1000); o.x += (o.tx - o.x) * Math.min(1, dt * 8); list.push({z: o.pz, x: o.x, v: o.v, car: o.car}); }
  const dir = SET.steer === 'tilt' ? steer.tilt : (steer.r ? 1 : 0) - (steer.l ? 1 : 0), gas = (steer.gas || SET.auto) && !steer.brake, kz = K(s.z);
  if (tt >= 0 && !s.done) {
    // руль; в повороте машину сносит наружу тем сильнее, чем выше скорость
    s.x += dir * (s.drift ? 12.5 : 10) * dt - kz * s.v * s.v * .1 * dt;
    if (Math.abs(s.x) > EDGE) { s.x = Math.sign(s.x) * EDGE; s.v -= s.v * 1.1 * dt; if (s.v > 22 && (s.wallT -= dt) <= 0) { s.wallT = .5; toast(t('wall'), 700); haptic('light', 40); } }
    // газ, тормоз, нитро
    if (s.nitroT > 0) s.nitroT -= dt;
    const boost = s.nitroT > 0, vmax = boost ? s.vmax * CFG.nitro_k : s.vmax;
    if (steer.brake) s.v = Math.max(0, s.v - 44 * dt);
    else if (boost) s.v += (s.v < vmax ? 36 : 0) * dt;
    else if (gas) s.v += (s.v < vmax ? s.acc : -22) * dt;
    else s.v = Math.max(0, s.v - 9 * dt);
    if (!steer.brake && (gas || boost) && Math.abs(s.v - vmax) < .6) s.v = vmax;
    // дрифт: на скорости рулим в сторону поворота (или руль + тормоз) — машину ставит боком, за занос даётся нитро
    const into = Math.abs(kz) > .0022 && Math.sign(dir) === Math.sign(kz);
    s.drift = s.v > 33 && Math.abs(dir) > .35 && (into || steer.brake);
    if (s.drift) { s.driftT += dt; if (s.driftT > 1.3) { s.driftT = 0; addNitro(t('drift')); } if ((smokeT -= dt) <= 0) { smokeT = .035; puff(s.x - .8); puff(s.x + .8); } if (Math.random() < dt * 9) haptic('soft'); }
    else s.driftT = Math.max(0, s.driftT - dt * .5);
    const z0 = s.z; s.z += s.v * dt;
    for (const o of OBS) if (!o.hit && o.z > z0 - 1 && o.z - s.z < 2.3 && o.z - s.z > -2 && Math.abs(o.x - s.x) < 2.25) { o.hit = true; crash('obs'); o.g.rotation.z = .5; o.g.position.y = .4; }
    for (const c of CANS) if (!c.got && Math.abs(c.z - s.z) < 2.6 && Math.abs(c.x - s.x) < 2.1) { c.got = true; c.g.visible = false; addNitro(t('can')); }
    for (const c of list) { const dz = c.z - s.z; if (dz > 0 && dz < 4.5 && Math.abs(c.x - s.x) < 1.95 && s.v > (c.v || 0)) { s.z = c.z - 4.5; if (s.slowT <= 0) { crash('car'); s.slowT = .6; } s.v = Math.min(s.v, (c.v || 30) * .82); } }
    if (s.slowT > 0) s.slowT -= dt;
    if (s.z >= CFG.track) { s.z = CFG.track; s.done = true; finish(Math.round(tt * 1000)); }
  } else if (s.done) { s.v = Math.max(0, s.v - 30 * dt); s.z += s.v * dt; s.drift = false; }
  // картинка
  layoutWorld(s.z);
  const yawT = -dir * (s.drift ? .62 : .2); s.yaw += (yawT - s.yaw) * Math.min(1, dt * (s.drift ? 6 : 9));
  me.position.set(s.x, 0, 0); me.userData.body.rotation.y = s.yaw; me.userData.body.rotation.z = -s.yaw * .3;
  animFlames(flames, s.nitroT > 0 ? 1 : 0, tt); animSmoke(dt, s.v);
  for (const c of list) { const d = c.z - s.z; place3(c.car, c.x, d); c.car.visible = Math.abs(d) < 170; }
  for (const o of OBS) { const d = o.z - s.z; o.g.visible = d < 170 && d > -12; if (o.g.visible) { const rz = o.g.rotation.z; place3(o.g, o.x, d); o.g.rotation.z = rz; } }
  for (const c of CANS) { const d = c.z - s.z; c.g.visible = !c.got && d < 170 && d > -8; if (c.g.visible) { place3(c.g, c.x, d); c.g.position.y = 1.05 + Math.sin(tt * 4 + c.z) * .15; c.spin.rotation.y = tt * 3; } }
  { const d = CFG.track - s.z; gate.visible = d < 170 && d > -30; if (gate.visible) place3(gate, 0, d); }
  if (s.shake > 0) s.shake -= dt;
  const sh = s.shake > 0 ? s.shake * .5 : 0, boost = s.nitroT > 0 ? 1 : 0, look = off(26);
  cam.fov += ((60 + boost * 12 + s.v * .08) - cam.fov) * Math.min(1, dt * 4); cam.updateProjectionMatrix();
  cam.position.set(s.x * .55 - look * .12 + (Math.random() - .5) * sh, 4.2 + (Math.random() - .5) * sh, 10.2 + boost * .8); cam.lookAt(s.x * .7 + look * .55, 1.0, -9);
  cam.rotateZ(Math.max(-.11, Math.min(.11, -kz * s.v * .22)) - s.yaw * .04);
  audioFrame(s.v, gas && tt >= 0 && !s.done, boost, s.drift, mode !== 'result');
  // интерфейс
  const place = 1 + list.filter(c => c.z > s.z).length; $('pos').innerHTML = place + ' <i>/ ' + (list.length + 1) + '</i>';
  const sec = Math.max(0, tt); $('time').textContent = Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  $('spd').textContent = Math.round(s.v * 3.4) + ' ' + t('km');
  $('bar-in').innerHTML = list.map(c => `<i style="left:${Math.min(100, c.z / CFG.track * 100)}%;background:#8a86b8"></i>`).join('') + `<i style="left:${s.z / CFG.track * 100}%;background:#3ddc84;z-index:2"></i>`;
  const ka = K(s.z + 70 + s.v), tr = $('turn'); tr.textContent = ka > 0 ? '↱' : '↰'; tr.classList.toggle('on', Math.abs(ka) > .003 && Math.abs(kz) < .003 && !s.done && tt > 0);
  const m = $('msg'), cnt = Math.ceil(-tt);
  if (tt < 0) { show('msg', true); m.innerHTML = cnt + `<small>${s.solo ? t('waitB') : t('wait') + ' · ' + (Object.keys(others).length + 1) + '/' + CFG.max_cars}</small>`; if (cnt !== lastCount) { lastCount = cnt; if (cnt <= 3) { beep(440, .16, 'square', .35); haptic('light', 20); } } }
  else if (tt < 1) { show('msg', true); m.innerHTML = t('go'); if (mode === 'wait') { mode = 'race'; haptic('rigid', 120); beep(880, .5, 'square', .4); } }
  else if (tt > 1.6 && s.v < 4 && !gas && !s.done) { show('msg', true); m.innerHTML = `<small style="font-size:22px;color:#3ddc84">${t('hold')} ⬇</small>`; }
  else show('msg', false);
}
async function finish(ms) {
  haptic('rigid', 250); [660, 880, 1100, 1320].forEach((f, i) => beep(f, .2, 'triangle', .5, i * .11)); let r;
  try { r = await api('finish', {room: room.room, ms}); } catch (err) { r = {place: 0, won: 0, coins: P.coins, wins: P.wins, day_left: P.day_left, error: err.message}; }
  P.coins = r.coins; P.wins = r.wins; P.day_left = r.day_left; mode = 'result';
  $('res-place').textContent = r.place ? ['🥇', '🥈', '🥉'][r.place - 1] || ('#' + r.place) : '🏁';
  $('res-sub').textContent = r.error ? r.error : `${r.place} ${t('place')} · ${(ms / 1000).toFixed(1)} с`;
  $('res-won').textContent = r.won ? t('won', r.won) : (r.place && r.place <= 3 ? t('nowon') : '');
  show('res', true); show('hud', false);
}
$('res-again').onclick = () => start(); $('b-start').onclick = () => start(false); $('b-bots').onclick = () => start(true);
$('res-garage').onclick = async () => { try { Object.assign(P, await api('profile')); } catch (e) {} garage(); };
function fireNitro() { const s = state; if (mode !== 'race' || !s || s.done || s.nitro <= 0 || s.nitroT > 0) return; s.nitro--; s.nitroT = s.nitroS; nitroUI(); haptic('heavy', 200); boom(.5); }
$('nitro').addEventListener('pointerdown', e => { e.preventDefault(); fireNitro(); });
for (const [id, k] of [['left', 'l'], ['right', 'r'], ['gas', 'gas'], ['brake', 'brake']]) { const b = $(id);
  const on = e => { e.preventDefault(); steer[k] = true; b.classList.add('dn'); try { b.setPointerCapture(e.pointerId); } catch (x) {} if (k === 'brake') haptic('light'); }, offF = e => { e.preventDefault(); steer[k] = false; b.classList.remove('dn'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', offF); b.addEventListener('pointercancel', offF); b.addEventListener('lostpointercapture', offF); b.addEventListener('contextmenu', e => e.preventDefault()); }
const KEYS = {ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'gas', ArrowDown: 'brake'};
addEventListener('keydown', e => { if (KEYS[e.key]) steer[KEYS[e.key]] = true; if (e.key === ' ') fireNitro(); });
addEventListener('keyup', e => { if (KEYS[e.key]) steer[KEYS[e.key]] = false; });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'garage') { spin += dt * .6; garageCar.rotation.y = spin; cam.fov = 60; cam.updateProjectionMatrix(); cam.position.set(0, 2.5, 8.6); cam.lookAt(0, .9, 0); audioFrame(0, false, false, false, false); }
  else if (mode === 'wait' || mode === 'race' || mode === 'result') { stepRace(dt, nowS() - startAt); if (now - lastTick > 250 && mode !== 'result') { lastTick = now; doTick(); } }
  R.render(scene, cam); requestAnimationFrame(frame);
}

(async () => {
  if (!INIT) { $('load-t').textContent = t('need'); return; }
  try { [P] = await Promise.all([api('profile'), loadCar()]); } catch (err) { $('load-t').textContent = err.message === 'net' ? 'Нет связи' : err.message; return; }
  CFG = P; for (const c of P.colors) HEX[c.code] = c.hex;
  show('load', false); garage(); requestAnimationFrame(frame);
  setInterval(async () => { if (mode === 'garage') try { const r = await api('profile'); P.online = r.online; P.top = r.top; $('g-on').textContent = '● ' + Math.max(1, P.online) + ' ' + t('online'); } catch (e) {} }, 8000);
})();
window.__dx = {get mode() { return mode; }, get state() { return state; }, start, steer, sheet, K};
</script>
