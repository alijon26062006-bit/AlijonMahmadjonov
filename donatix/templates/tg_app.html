<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>{{ site_name }} — мағоза</title>
<link rel="icon" href="/static/logo.svg?v={{ asset_v }}" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
{% include "_fonts.html" %}
<style>
/* Мини-приложение Donatix: тёмно-фиолетовое, крупные плитки игр, плавающее меню снизу */
:root {
  --bg: #0c0a1d; --bg-2: #120f2a; --surface: #18153a; --surface-2: #221e4a; --field: #141131; --line: #2a2556; --line-strong: #3a3470;
  --text: #f3f2ff; --muted: #a39fce;
  --accent: #7c6cff; --accent-2: #5b47f5; --accent-hover: #9284ff; --accent-ink: #ffffff; --accent-soft: #2a2563; --accent-line: #4a3fb0;
  --tg: #5cb3f0; --tg-soft: #15284a; --star: #ffc53d; --star-soft: #3a2c10;
  --ok: #4ade80; --ok-soft: #12291c; --bad: #ff6b81; --bad-soft: #321525;
  --hot: linear-gradient(135deg, #ff9a3d, #ff3d6e);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3); --shadow-2: 0 18px 40px -18px rgb(0 0 0 / .8);
  --r-xl: 28px; --r-lg: 22px; --r: 16px; --r-sm: 12px;
  --font: "Onest", "Onest Fallback", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.4, .5, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f2fb; --bg-2: #ebe9f8; --surface: #ffffff; --surface-2: #f0eefc; --field: #f7f6fd; --line: #e3e0f3; --line-strong: #cfcaea;
  --text: #17142e; --muted: #6a6590;
  --accent: #5b47f5; --accent-2: #4a36e0; --accent-hover: #4a36e0; --accent-soft: #ece9ff; --accent-line: #c9c1ff;
  --tg: #2481cc; --tg-soft: #e7f2fb; --star: #e8a400; --star-soft: #fdf5e5;
  --ok: #157347; --ok-soft: #e8f6ee; --bad: #c42b2b; --bad-soft: #fdeeee;
  --shadow-1: 0 1px 2px rgb(23 20 46 / .05), 0 4px 12px -4px rgb(23 20 46 / .08); --shadow-2: 0 18px 40px -18px rgb(23 20 46 / .3);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
body { min-height: 100dvh; padding: 0 16px calc(118px + env(safe-area-inset-bottom)); overflow-x: hidden;
  background: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--text); }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
.hidden { display: none !important; }
.star-c { color: var(--star); }
.press { transition: transform .15s var(--ease); } .press:active { transform: scale(.96); }

/* ── шапка: аватар, имя, кнопки ── */
.top { display: flex; align-items: center; gap: 14px; padding: 16px 2px 14px; }
.top .who { flex: 1; min-width: 0; }
.top .who b { display: block; font-size: 22px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .who span { color: var(--muted); font-size: 14px; }
.ava { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--accent), #ff5d9e); box-shadow: 0 0 0 3px var(--surface-2); }
.ava.sm { width: 38px; height: 38px; font-size: 15px; box-shadow: none; }
.ava.big { width: 92px; height: 92px; font-size: 36px; margin: 0 auto; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--accent-hover); font-size: 13px; font-weight: 800; }

/* ── карточка баланса ── */
.balc { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 20px 18px 18px; color: #fff;
  background: linear-gradient(140deg, #7b6bff 0%, #5b47f5 55%, #4a32d8 100%); box-shadow: 0 24px 50px -26px #5b47f5; }
.balc::before, .balc::after { content: ""; position: absolute; border-radius: 50%; background: rgb(255 255 255 / .08); pointer-events: none; }
.balc::before { width: 220px; height: 220px; right: -70px; top: -90px; } .balc::after { width: 140px; height: 140px; left: -50px; bottom: -70px; }
.balc .sp { position: absolute; width: 10px; height: 10px; background: rgb(255 255 255 / .35); transform: rotate(45deg); border-radius: 2px; animation: tw 3.4s infinite ease-in-out; }
@keyframes tw { 50% { opacity: .2; transform: rotate(45deg) scale(.6); } }
.balc .hd { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.balc .hd span { font-size: 17px; font-weight: 700; opacity: .92; }
.cur { display: flex; padding: 3px; border-radius: 999px; background: rgb(255 255 255 / .16); }
.cur button { min-width: 44px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 800; color: rgb(255 255 255 / .8); }
.cur button.on { background: #fff; color: #4a32d8; }
.balc .sum { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 10px; margin: 8px 0 16px; }
.balc .sum b { font-size: 50px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
.balc .sum small { font-size: 19px; font-weight: 700; opacity: .85; }
.eye { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .16); align-self: center; }
.acts { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.act { min-height: 96px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: rgb(255 255 255 / .1); border: 1.5px solid rgb(255 255 255 / .22); font-weight: 800; font-size: 14px; color: #fff; }
.act.game { position: relative; overflow: hidden; border: 2px solid #fff; background: radial-gradient(circle at 50% 30%, #ffb347, #ff6a2b 55%, #e5482a); padding: 0; justify-content: flex-end; }
.act.game img { position: absolute; inset: 6px 4px 30px; width: calc(100% - 8px); height: calc(100% - 36px); object-fit: contain; filter: drop-shadow(0 6px 8px rgb(0 0 0 / .35)); animation: bob 2.4s infinite ease-in-out; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.act.game .lbl { position: relative; margin-bottom: 8px; padding: 3px 12px; border-radius: 999px; background: rgb(60 20 0 / .55); font-size: 14px; }
.badge-new { position: absolute; top: 6px; right: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 900; color: #0d3b1e; background: #4ade80; z-index: 2; animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgb(74 222 128 / .25); } }

/* ── живой заезд: кто ждёт соперника ── */
.live { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: var(--r-lg); text-decoration: none; color: #fff;
  background: linear-gradient(110deg, #1d7a4a, #13b26b); box-shadow: 0 14px 30px -18px #13b26b; animation: up .35s var(--ease); }
.live .dot { width: 10px; height: 10px; border-radius: 50%; background: #b6ffd5; box-shadow: 0 0 0 0 #b6ffd5; animation: ping 1.4s infinite; flex: none; }
@keyframes ping { 70% { box-shadow: 0 0 0 9px rgb(182 255 213 / 0); } }
.live .grow { flex: 1; min-width: 0; } .live b { display: block; font-size: 15px; } .live small { font-size: 12.5px; opacity: .9; }
.live .go { padding: 8px 13px; border-radius: 12px; background: #fff; color: #0f5a33; font-weight: 900; font-size: 13px; }

/* ── полосы-карточки ── */
.strip { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin-top: 12px; padding: 16px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.strip.promo { background: linear-gradient(110deg, #4b2fc9, #8a3bd6 60%, #c0459b); border: 0; color: #fff; }
.strip .ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; flex: none; font-size: 28px; background: rgb(255 255 255 / .16); }
.strip .grow { flex: 1; min-width: 0; } .strip b { display: block; font-size: 18px; font-weight: 800; } .strip small { font-size: 14px; opacity: .85; line-height: 1.35; display: block; }
.rate .ic { background: var(--star-soft); color: var(--star); }
.rate .big { font-size: 34px; font-weight: 900; line-height: 1; }
.rate .stars { color: var(--star); letter-spacing: 2px; font-size: 17px; }
.chev { color: var(--muted); font-size: 22px; flex: none; } .promo .chev { color: #fff; }

/* ── вкладки «Игры / Популярное / Карты» ── */
.seg-big { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 0 14px; padding: 5px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); }
.seg-big .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 999px;
  background: linear-gradient(135deg, #9a8cff, var(--accent)); box-shadow: 0 8px 20px -8px var(--accent); transition: transform .3s var(--spring); }
.seg-big button { position: relative; z-index: 1; min-height: 46px; font-weight: 800; font-size: 16px; color: var(--muted); transition: color .2s; }
.seg-big button.on { color: #fff; }

/* ── сетка игр ── */
.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.gt { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: up .4s var(--ease) both; }
.gt .im { position: relative; width: 100%; aspect-ratio: 1; border-radius: 24px; overflow: hidden; background: var(--surface-2); box-shadow: 0 10px 22px -14px rgb(0 0 0 / .8);
  display: grid; place-items: center; font-size: 30px; font-weight: 900; color: var(--muted); }
.gt .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gt .im .tag { position: absolute; top: 0; right: 0; padding: 3px 9px 4px 11px; border-radius: 0 0 0 14px; font-size: 11px; font-weight: 900; color: #fff; background: var(--hot); z-index: 1; }
.gt .im .corner { position: absolute; top: 0; left: 0; width: 32px; height: 32px; border-radius: 0 0 14px 0; background: #f0a83c; color: #fff; display: grid; place-items: center; font-size: 15px; z-index: 1; }
.gt b { font-size: 13px; font-weight: 900; text-transform: uppercase; line-height: 1.2; letter-spacing: .01em; }
.gt small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-top: -4px; }
.tgtile { background: linear-gradient(140deg, #4aa3ff, #2a6ee6) !important; color: #fff !important; }

/* ── экран игры ── */
.back { display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 4px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.hero { position: relative; display: flex; gap: 14px; align-items: center; margin: 12px 0 14px; padding: 14px; border-radius: var(--r-xl); overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); }
.hero .bgimg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(26px) saturate(1.4); opacity: .45; }
.hero .im { position: relative; width: 84px; height: 84px; border-radius: 22px; overflow: hidden; flex: none; background: var(--surface-2); display: grid; place-items: center; font-size: 30px; font-weight: 900; }
.hero .im img { width: 100%; height: 100%; object-fit: cover; }
.hero h1 { position: relative; margin: 0; font-size: 22px; font-weight: 900; line-height: 1.15; }
.hero p { position: relative; margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.regs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.regs::-webkit-scrollbar { display: none; }
.regs button { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.regs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.grp { font-size: 16px; font-weight: 800; margin: 16px 2px 10px; }
.packs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pk { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border-radius: 18px; background: var(--surface);
  border: 1.5px solid var(--line); box-shadow: var(--shadow-1); transition: border-color .2s, transform .15s var(--ease); animation: up .35s var(--ease) both; }
.pk:active { transform: scale(.97); }
.pk.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.pk .e { font-size: 22px; line-height: 1; } .pk b { font-size: 15px; font-weight: 800; line-height: 1.25; }
.pk .p { color: var(--accent-hover); font-weight: 900; font-size: 16px; margin-top: auto; }
.pk .ck { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
  font-size: 13px; transform: scale(0); transition: transform .25s var(--spring); }
.pk.on .ck { transform: scale(1); }
.buybar { position: sticky; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 5; margin-top: 16px; padding: 16px; border-radius: var(--r-xl);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line-strong); box-shadow: var(--shadow-2); animation: up .3s var(--ease); }

/* ── общие ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-1); }
.mt { margin-top: 12px; }
.sec-title { font-size: 20px; font-weight: 800; margin: 22px 2px 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: var(--r); font-weight: 700; font-size: 16px; transition: background .15s var(--ease), transform .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #8d7fff, var(--accent-2)); color: #fff; box-shadow: 0 12px 26px -12px var(--accent); }
.btn.soft { background: var(--surface-2); border: 1px solid var(--line); }
.btn.grow { flex: 1; }
.btn.full { width: 100%; min-height: 56px; font-size: 17px; }
.btn:disabled { opacity: .45; box-shadow: none; }
.ph { display: flex; gap: 14px; align-items: center; margin: 16px 2px 14px; }
.ph .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--tg-soft); color: var(--tg); }
.ph h1 { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.2; }
.ph p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.label { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin: 12px 2px 6px; }
.field { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: var(--r);
  background: var(--field); border: 1px solid var(--line-strong); }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input { flex: 1; background: none; border: 0; outline: 0; font-size: 17px; min-width: 0; }
.field input::placeholder, textarea::placeholder { color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.chip { min-height: 44px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-hover); font-weight: 700; }
.chip.on { background: var(--accent); color: #fff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px; border-radius: var(--r); background: var(--surface-2); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { min-height: 44px; border-radius: var(--r-sm); font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; box-shadow: var(--shadow-1); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 2px 0; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 12px; }
.total span { color: var(--muted); } .total b { font-size: 26px; font-weight: 900; }
textarea.field { min-height: 72px; padding: 12px 14px; width: 100%; resize: none; outline: 0; margin-top: 10px; display: block; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); font-size: 22px; font-weight: 800; }
.stepper b { min-width: 40px; text-align: center; font-size: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pack { padding: 14px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: center; box-shadow: var(--shadow-1); }
.pack b { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 20px; font-weight: 800; }
.pack span { display: block; margin-top: 4px; color: var(--accent-hover); font-weight: 700; font-size: 15px; }
.pack .star-c { display: inline; margin: 0; color: var(--star); font-size: 15px; }
.pack.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.gift { padding: 12px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: center; box-shadow: var(--shadow-1); }
.gift .pic { width: 72px; height: 72px; margin: 0 auto 6px; display: grid; place-items: center; font-size: 48px; position: relative; }
.gift .pic img { width: 100%; height: 100%; object-fit: contain; }
.gift .pic .anim { position: absolute; inset: 0; }
.gift .pic .anim svg, .gift .pic video { width: 100% !important; height: 100% !important; }
.gift .pic.playing > img { visibility: hidden; }
.gift .st { font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 3px; }
.gift .pr { color: var(--accent-hover); font-weight: 800; }
.gift .left { font-size: 12px; color: var(--bad); }
.plan { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
  border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; box-shadow: var(--shadow-1); }
.plan.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.plan .m { width: 52px; height: 52px; border-radius: 14px; background: var(--tg-soft); color: var(--tg); display: grid; place-items: center; flex: none; text-align: center; }
.plan .m b { font-size: 20px; font-weight: 800; line-height: 1; } .plan .m small { font-size: 11px; display: block; }
.plan .grow { flex: 1; } .plan .grow b { display: block; font-weight: 700; }
.badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-soft); }
.plan .p { text-align: right; } .plan .p b { display: block; font-size: 18px; font-weight: 800; } .plan .p small { color: var(--muted); font-size: 13px; }

/* ── профиль, история, друзья ── */
.prof { text-align: center; }
.prof h2 { font-size: 22px; font-weight: 800; margin: 12px 0 0; }
.idpill { display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.stat { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.stat b { font-size: 22px; font-weight: 800; display: block; } .stat span { color: var(--muted); font-size: 14px; }
.menu { display: grid; gap: 10px; margin-top: 12px; }
.mi { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.mi .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-hover); }
.mi .grow { flex: 1; min-width: 0; } .mi b { display: block; font-weight: 700; } .mi span { color: var(--muted); font-size: 14px; }
.mi .go { color: var(--muted); }
.hi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); animation: up .3s var(--ease) both; }
.hi .grow { flex: 1; min-width: 0; } .hi b { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; }
.hi small { color: var(--muted); font-size: 13px; } .hi .p { font-weight: 800; white-space: nowrap; }

      return `<label class="label">${t("steam_cur")}</label><div class="chips">${opts.map(c => `<button class="chip ${G.fields.currency === c ? "on" : ""}" data-act="gf" data-k="currency" data-v="${c}">${c}</button>`).join("")}</div>`; }
    if (f.options && f.options.length) return `<label class="label">${esc(f.label)}</label><div class="chips">${f.options.map(o => `<button class="chip ${G.fields[f.key] === o ? "on" : ""}" data-act="gf" data-k="${esc(f.key)}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    const num = f.type === "number" || f.key === "amount";
    return `<label class="label" for="gf-${esc(f.key)}">${esc(f.key === "amount" ? t("steam_sum") : f.label)}</label><div class="field"><input id="gf-${esc(f.key)}" data-gf="${esc(f.key)}" ${num ? 'inputmode="decimal"' : 'autocapitalize="off" autocomplete="off" spellcheck="false"'} placeholder="${esc(f.label)}" value="${val}"></div>`;
  }).join("");
  const many = i.kind !== "steam_topup" && i.max_quantity > 1;
  const qty = many ? `<label class="label">${t("qty")}</label><div class="stepper"><button data-act="qty" data-v="-1">−</button><b class="num" id="gqty">${G.qty}</b><button data-act="qty" data-v="1">+</button></div>` : "";
  return `<section class="buybar">${fields}${qty}<div class="total"><span>${t("pay")}</span><b class="num" id="gsum">${fmt(gamePrice(i))} <small style="font-size:15px">${t("som")}</small></b></div>
    <button class="btn primary full" data-act="gbuy">${t("buy")}</button></section>`;
}
async function gameBuy(btn) {
  const i = selItem(); if (!i) return;
  document.querySelectorAll("[data-gf]").forEach(el => G.fields[el.dataset.gf] = el.value.trim());
  const miss = (i.fields || []).find(f => !G.fields[f.key]);
  if (miss) { toast(t("fill", {f: miss.key === "amount" ? t("steam_sum") : miss.label}), "err"); const el = document.getElementById("gf-" + miss.key); el && el.focus(); return; }
  btn.disabled = true; haptic("medium");
  const r = await api("order", {product_id: i.product_id, qty: G.qty, fields: G.fields, idem: crypto.randomUUID()});
  btn.disabled = false;
  if (r.ok) { D.me.balance = r.balance; haptic("heavy");
    sheet(`<div style="text-align:center"><div class="ok-big">✓</div><h3>${t("order_ok")}</h3><p class="mut">${t("order_s", {r: esc(r.ref)})}</p></div>

}

const curM = () => D.pay.methods.find(m => m.code === P.method) || {};
const isCrypto = m => !!m.network;

  return `<div class="ph"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${IC.card}</div><div><h1>${t("topup_bal")}</h1><p>${t("balance")}: ${microTjs(D.me.balance)} ${t("som")}</p></div></div>

    ${m.code ? `<section class="card mt"><label class="label" for="tamt">${cr ? t("sum_usd") : t("sum_tjs")}</label>
      <div class="field"><input id="tamt" type="number" inputmode="decimal" placeholder="${esc(min)}" value="${esc(P.amount)}"></div>

function startPoll() {
  clearInterval(P.poll); if (!P.pay || P.pay.status !== "pending") return;
  const started = Date.now();
  P.poll = setInterval(async () => {
    if (TAB !== "topup" || !P.pay) { clearInterval(P.poll); return; }
    if (P.pay.left) { const l = Math.max(0, P.pay.left - Math.floor((Date.now() - started) / 1000));
      const el = document.getElementById("tleft"); if (el) el.textContent = Math.floor(l / 60) + ":" + String(l % 60).padStart(2, "0"); }
    const r = await api("topup/status", {id: P.pay.id});
    if (r.status && r.status !== "pending") { P.pay.status = r.status; if (r.balance != null) D.me.balance = r.balance;
      clearInterval(P.poll); haptic("medium"); render(); }
  }, 3000);
}
async function topupGo(btn) {
  const m = curM(), cr = isCrypto(m);
  const v = (document.getElementById("tamt") || {}).value || ""; P.amount = v;
  const fd = new FormData(); fd.append("method", m.code); fd.append(cr ? "amount" : "amount_tjs", v);
  const ag = document.getElementById("tagree"); if (ag && ag.checked) fd.append("agree", "1");
  const f = document.getElementById("trc"); if (f && f.files[0]) fd.append("receipt", f.files[0]);
  btn.disabled = true;
  const r = await fetch("/tg/api/topup", {method: "POST", headers: {"X-Tg-Init": INIT}, body: fd}).then(x => x.json()).catch(() => ({error: "Хато"}));
  btn.disabled = false;
  if (!r.ok) { toast(r.error || "Хато", "err"); return; }
  if (r.done) { toast(r.message, "ok"); go("home"); return; }
  P.pay = r.pay; P.showReceipt = false; render(); startPoll();
  if (r.pay.auto === "smartpay" && r.pay.pay_url) { tg && tg.openLink ? tg.openLink(r.pay.pay_url) : window.open(r.pay.pay_url); }
}
async function sendLateReceipt(btn) {
  const f = document.getElementById("trc2"); if (!f || !f.files[0]) { toast(t("receipt"), "err"); return; }
  const fd = new FormData(); fd.append("id", P.pay.id); fd.append("receipt", f.files[0]);
  btn.disabled = true;
  const r = await fetch("/tg/api/topup/receipt", {method: "POST", headers: {"X-Tg-Init": INIT}, body: fd}).then(x => x.json()).catch(() => ({}));
  btn.disabled = false;
  if (r.ok) { toast(r.message, "ok"); clearInterval(P.poll); P.pay = null; go("home"); } else toast(r.error || "Хато", "err");
}



function copy(text) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(t("copied"), "ok"), () => {}); haptic(); }
function countUp(el, to) {
  if (!el || HIDE) return; const from = 0, t0 = performance.now(), dur = 700;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = from + (to - from) * e;
    el.textContent = CUR === "usd" ? v.toFixed(2) : fmt(v); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

  else if (act === "order") orderSheet(v);
  else if (act === "close") closeSheet();
  else if (act === "copy") copy(v);

  else if (act === "hide") { HIDE = !HIDE; try { localStorage.setItem("dx_hide", HIDE ? "1" : "0"); } catch (x) {} haptic(); render(); }

    document.querySelectorAll("#gseg button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); $("#grid").innerHTML = gridHtml(); }
  else if (act === "game") { haptic(); openGame(a.dataset.k, a.dataset.c, a.dataset.r); }
  else if (act === "greg") { G.region = v; G.sel = null; G.data = null; render(); const r = await api("game", {kind: G.kind, category: G.category, region: v}); if (!r.error) { G.data = r; render(); } }
  else if (act === "pick") { G.sel = v; G.qty = 1; haptic(); render(); const b = document.querySelector(".buybar"); b && b.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  else if (act === "gf") { document.querySelectorAll("[data-gf]").forEach(el => G.fields[el.dataset.gf] = el.value); G.fields[a.dataset.k] = v; haptic(); render(); }
  else if (act === "qty") { const i = selItem(); G.qty = Math.max(i.min_quantity || 1, Math.min(i.max_quantity || 1, G.qty + +v)); $("#gqty").textContent = G.qty; $("#gsum").firstChild.textContent = fmt(gamePrice(i)) + " "; haptic(); }
  else if (act === "gbuy") gameBuy(a);
  else if (act === "tgseg") { S.tgSeg = v; haptic(); render(); }
  else if (act === "lang") { LANG = LANG === "ru" ? "tj" : "ru"; try { localStorage.setItem("dx_lang", LANG); } catch (x) {} texts(); render(); }
  else if (act === "theme") { THEME = THEME === "dark" ? "light" : "dark"; try { localStorage.setItem("dx_theme", THEME); } catch (x) {} applyTheme(); render(); }
  else if (act === "share") { const txt = a.dataset.txt === "race" ? (LANG === "ru" ? "🏁 Давай гонку! Заезд с живыми соперниками:" : "🏁 Биё пойга! Заезд бо рақибони зинда:") : "";
    const u = "https://t.me/share/url?url=" + encodeURIComponent(v) + (txt ? "&text=" + encodeURIComponent(txt) : ""); tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u); }
  else if (act === "support") { if (SUPPORT && SUPPORT.startsWith("@") && tg) tg.openTelegramLink("https://t.me/" + SUPPORT.slice(1)); }
  else if (act === "sadd") { S.starsQty = (S.starsQty || 0) + +v; haptic(); render(); }
  else if (act === "spack") { S.starsQty = +v; haptic(); render(); }
  else if (act === "s-to") { S.starsTo = v; render(); }
  else if (act === "p-to") { S.premTo = v; render(); }
  else if (act === "plan") { S.plan = v; haptic(); render(); }
  else if (act === "gift") giftSheet(v);
  else if (act === "pm") { P.method = v; P.amount = (document.getElementById("tamt") || {}).value || ""; haptic(); render(); }
  else if (act === "tchip") { const el = document.getElementById("tamt"); if (el) el.value = v; P.amount = v; haptic(); }
  else if (act === "tgo") topupGo(a);
  else if (act === "tnew") { P.pay = null; render(); }
  else if (act === "open") { tg && tg.openLink ? tg.openLink(v) : window.open(v); }
  else if (act === "video") { e.preventDefault(); tg && tg.openLink ? tg.openLink(location.origin + D.pay.dc_video) : window.open(D.pay.dc_video); }
  else if (act === "tpaid") { P.showReceipt = !(P.pay && P.pay.receipt_after); const st = document.getElementById("tstat"); if (st) st.lastChild.textContent = t("searching");

  else if (act === "buy-stars" || act === "buy-premium") {

      : {type: "premium", product_id: S.plan, to, username: friendEl ? friendEl.value : "", idem: crypto.randomUUID()});
    a.disabled = false; done(r);
  }
});

// ── Анимация подарков как в Telegram: Lottie (из .tgs) или видео-стикер. Пока не загрузилась — картинка.
// Играют только те, что видно на экране; ушли за край — пауза (батарея и плавность).
const LOTTIE = "{{ static_url('/static/vendor/lottie_light-5.12.2.min.js') }}";   // lottie-web 5.12.2, MIT
let lottieP = null;
const loadLottie = () => lottieP || (lottieP = new Promise((ok, no) => {
  const s = document.createElement("script"); s.src = LOTTIE; s.async = true;
  s.onload = () => ok(window.lottie); s.onerror = no; document.head.appendChild(s);
}));
const animCache = {};
const animSeen = new IntersectionObserver(es => es.forEach(e => {
  const p = e.target._player; if (!p) { if (e.isIntersecting) startAnim(e.target); return; }
  e.isIntersecting ? p.play() : p.pause();
}), {rootMargin: "80px"});
async function startAnim(el) {
  if (el._busy) return; el._busy = true;
  const url = el.dataset.anim;
  try {
    if (url.endsWith(".webm")) {
      const v = document.createElement("video");
      Object.assign(v, {src: url, autoplay: true, loop: true, muted: true, playsInline: true});
      v.className = "anim"; v.setAttribute("playsinline", "");
      v.oncanplay = () => el.classList.add("playing"); v.onerror = () => v.remove();
      el.appendChild(v); el._player = v; return;
    }
    const [lottie, data] = await Promise.all([loadLottie(),
      animCache[url] || (animCache[url] = fetch(url).then(r => { if (!r.ok) throw 0; return r.json(); }))]);
    if (!el.isConnected) return;
    const box = document.createElement("div"); box.className = "anim"; el.appendChild(box);
    el._player = lottie.loadAnimation({container: box, renderer: "svg", loop: true, autoplay: true,
      animationData: JSON.parse(JSON.stringify(data)), rendererSettings: {progressiveLoad: true}});
    el._player.addEventListener("DOMLoaded", () => el.classList.add("playing"));
  } catch (_) { el._busy = false; delete animCache[url]; }   // не вышло — остаётся картинка
}
const watchAnims = () => document.querySelectorAll(".pic[data-anim]:not([data-seen])").forEach(el => {
  el.setAttribute("data-seen", ""); animSeen.observe(el);
});
new MutationObserver(watchAnims).observe(document.body, {childList: true, subtree: true});
watchAnims();
