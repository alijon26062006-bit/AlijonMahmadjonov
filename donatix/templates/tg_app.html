<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>{{ site_name }} — Stars · Premium · Тӯҳфа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
{% include "_fonts.html" %}
<style>
/* Цвета и шрифт — как на donatix.tj (static/donatix.css); тема — как у Telegram (светлая / тёмная) */
:root {
  --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f1f2f7; --field: #f7f8fb; --line: #e7e9f0; --line-strong: #d6d9e3;
  --text: #121521; --muted: #5e6577;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-ink: #ffffff; --accent-soft: #eef0ff; --accent-line: #cdd1fb;
  --tg: #2481cc; --tg-soft: #e7f2fb; --star: #e8a400; --star-soft: #fdf5e5;
  --ok: #157347; --ok-soft: #e8f6ee; --bad: #c42b2b; --bad-soft: #fdeeee;
  --shadow-1: 0 1px 2px rgb(18 21 33 / .04), 0 2px 8px -2px rgb(18 21 33 / .06);
  --shadow-2: 0 2px 4px rgb(18 21 33 / .04), 0 12px 28px -12px rgb(18 21 33 / .16);
  --shadow-accent: 0 8px 20px -8px color-mix(in srgb, var(--accent) 55%, transparent);
  --r-lg: 20px; --r: 16px; --r-sm: 12px;
  --font: "Onest", "Onest Fallback", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e1016; --surface: #161922; --surface-2: #1d212c; --field: #12151d; --line: #262b37; --line-strong: #353b49;
  --text: #eceef3; --muted: #9ba2b1;
  --accent: #8b8cf8; --accent-hover: #a5a6fa; --accent-ink: #11122a; --accent-soft: #1e2040; --accent-line: #34376c;
  --tg: #5cb3f0; --tg-soft: #13253a; --star: #f5b942; --star-soft: #2a2110;
  --ok: #4ade80; --ok-soft: #12261b; --bad: #f87171; --bad-soft: #2b1616;
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3); --shadow-2: 0 12px 28px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
body { min-height: 100dvh; padding: 0 16px calc(104px + env(safe-area-inset-bottom)); overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--text); }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
.hidden { display: none !important; }
.star-c { color: var(--star); }

/* шапка: логотип Donatix слева, аватар справа */
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand img { width: 32px; height: 32px; }
.ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center;
  font-weight: 700; color: var(--accent-ink); background: var(--accent); }
.ava.big { width: 88px; height: 88px; font-size: 34px; margin: 0 auto; box-shadow: 0 0 0 4px var(--accent-soft); }
.greet { margin: 4px 2px 14px; font-size: 15px; color: var(--muted); }
.greet b { color: var(--text); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-1); }
.mt { margin-top: 12px; }
.sec-title { font-size: 20px; font-weight: 700; margin: 24px 2px 10px; }

/* баланс */
.bal .lbl { color: var(--muted); font-size: 14px; }
.bal .sum { font-size: 36px; font-weight: 700; line-height: 1.15; margin: 4px 0 16px; letter-spacing: -.02em; }
.bal .sum small { font-size: 16px; color: var(--muted); font-weight: 600; margin-left: 6px; }
.row { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: var(--r); font-weight: 600; font-size: 16px; transition: background .15s var(--ease), transform .1s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.soft { background: var(--surface-2); border: 1px solid var(--line); }
.btn.grow { flex: 1; }
.btn.full { width: 100%; min-height: 54px; font-size: 17px; }
.btn:disabled { opacity: .45; box-shadow: none; }

/* разделы списком: иконка Telegram-голубая */
.menu { display: grid; gap: 10px; margin-top: 12px; }
.mi { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.mi .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--tg-soft); color: var(--tg); }
.mi .ic.st { background: var(--star-soft); color: var(--star); }
.mi .ic.ac { background: var(--accent-soft); color: var(--accent); }
.mi .grow { flex: 1; min-width: 0; } .mi b { display: block; font-weight: 600; } .mi span { color: var(--muted); font-size: 14px; }
.mi .go { color: var(--muted); }
.feed { display: grid; gap: 8px; }
.fi { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.fi .ava { width: 38px; height: 38px; font-size: 15px; background: var(--accent-soft); color: var(--accent); }
.fi .grow { flex: 1; min-width: 0; } .fi b { display: block; font-weight: 600; font-size: 15px; }
.fi .what { color: var(--muted); font-size: 14px; } .fi time { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* заголовок раздела */
.ph { display: flex; gap: 14px; align-items: center; margin: 4px 2px 14px; }
.ph .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--tg-soft); color: var(--tg); }
.ph h1 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
.ph p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* формы */
.label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 2px 6px; }
.field { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: var(--r);
  background: var(--field); border: 1px solid var(--line-strong); }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input { flex: 1; background: none; border: 0; outline: 0; font-size: 17px; min-width: 0; }
.field input::placeholder, textarea::placeholder { color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.chip { min-height: 44px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px; border-radius: var(--r); background: var(--surface-2); }
.seg button { min-height: 44px; border-radius: var(--r-sm); font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 2px 0; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 12px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
.total span { color: var(--muted); }
.total b { font-size: 24px; font-weight: 700; }
textarea.field { min-height: 72px; padding: 12px 14px; width: 100%; resize: none; outline: 0; margin-top: 10px; display: block; }

/* сетки */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pack { padding: 14px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: center; box-shadow: var(--shadow-1); }
.pack b { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 20px; font-weight: 700; }
.pack span { display: block; margin-top: 4px; color: var(--accent); font-weight: 600; font-size: 15px; }
.pack .star-c { display: inline; margin: 0; color: var(--star); font-size: 15px; }
.pack.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.gift { padding: 12px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: center; box-shadow: var(--shadow-1); }
.gift .pic { width: 72px; height: 72px; margin: 0 auto 6px; display: grid; place-items: center; font-size: 48px; }
.gift .pic img { width: 100%; height: 100%; object-fit: contain; }
.gift .pic { position: relative; }
.gift .pic .anim { position: absolute; inset: 0; }
.gift .pic .anim svg, .gift .pic video { width: 100% !important; height: 100% !important; }
.gift .pic.playing > img { visibility: hidden; }
.gift .st { font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 3px; }
.gift .pr { color: var(--accent); font-weight: 700; }
.gift .left { font-size: 12px; color: var(--bad); }

/* Premium */
.plan { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
  border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; box-shadow: var(--shadow-1); }
.plan.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.plan .m { width: 52px; height: 52px; border-radius: 14px; background: var(--tg-soft); color: var(--tg); display: grid; place-items: center; flex: none; text-align: center; }
.plan .m b { font-size: 20px; font-weight: 700; line-height: 1; } .plan .m small { font-size: 11px; display: block; }
.plan .grow { flex: 1; } .plan .grow b { display: block; font-weight: 600; }
.badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: var(--ok); background: var(--ok-soft); }
.plan .p { text-align: right; } .plan .p b { display: block; font-size: 18px; font-weight: 700; } .plan .p small { color: var(--muted); font-size: 13px; }

/* профиль */
.prof { text-align: center; }
.prof h2 { font-size: 22px; font-weight: 700; margin: 12px 0 0; }
.idpill { display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 36px; padding: 0 14px; border-radius: 999px;
  background: var(--surface-2); font-weight: 600; font-size: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.stat { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.stat b { font-size: 22px; font-weight: 700; display: block; } .stat span { color: var(--muted); font-size: 14px; }

/* нижнее меню */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center;
  color: var(--muted); font-size: 12px; font-weight: 600; border-radius: var(--r-sm); }
nav.tabs button.on { color: var(--accent); }
nav.tabs button.on svg { transform: translateY(-1px); }

/* окно снизу и тосты */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .5); z-index: 30; animation: fade .2s var(--ease); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 88dvh; overflow: auto;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: var(--surface);
  box-shadow: var(--shadow-2); animation: up .24s var(--ease); }
@keyframes up { from { transform: translateY(32px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line-strong); margin: 0 auto 14px; }
.sheet h3 { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
.toast { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top)); z-index: 50; padding: 12px 14px;
  border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); font-size: 15px; }
.toast.err { border-color: var(--bad); color: var(--bad); } .toast.ok { border-color: var(--ok); }
.linkbox { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2);
  word-break: break-all; font-size: 13px; }
.linkbox .grow { flex: 1; }
.friday { margin: 0 0 12px; padding: 12px 14px; border-radius: var(--r); background: var(--ok-soft); color: var(--ok); font-size: 14px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 24px 0 0; }
.skel { height: 110px; border-radius: var(--r-lg); background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2));
  background-size: 200% 100%; animation: sk 1.2s infinite linear; margin-top: 12px; }
@keyframes sk { to { background-position: -200% 0; } }
.hist-i { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist-i:last-child { border-bottom: 0; }
.pm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pm button { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 12px; text-align: left;
  border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.pm button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pm img { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; flex: none; background: var(--surface-2); }
.pm b { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; } .pm small { color: var(--muted); font-size: 12px; }
.copyrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; margin-top: 10px;
  border-radius: var(--r-sm); background: var(--surface-2); }
.copyrow .v { font-weight: 700; font-size: 17px; word-break: break-all; } .copyrow small { display: block; color: var(--muted); font-size: 13px; }
.copybtn { flex: none; min-height: 40px; padding: 0 12px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
.status { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); font-size: 14px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.file { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; margin-top: 12px; border-radius: var(--r);
  border: 1.5px dashed var(--line-strong); color: var(--muted); font-weight: 600; cursor: pointer; }
.file input { display: none; }
.note { font-size: 14px; color: var(--muted); margin: 10px 2px 0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="{{ static_url('/static/logo.svg') }}" alt="" width="32" height="32">Donatix</div>
  <button aria-label="Профиль" data-tab="profile"><div class="ava" id="hava">D</div></button></header>
<p class="greet"><span data-t="hi"></span> <b id="hname">…</b></p>
<div id="friday" class="friday hidden"></div>
<main id="view"><div class="skel"></div><div class="skel"></div></main>
<p class="foot" data-t="indep"></p>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="t_home"></span></button>
  <button data-tab="stars"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span>Stars</span></button>
  <button data-tab="premium"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l3 18 3-18"/></svg><span>Premium</span></button>
  <button data-tab="gifts"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13M12 8S10 3 7.5 3 5 5.5 7.5 7 12 8 12 8s2-5 4.5-5S19 5.5 16.5 7 12 8 12 8"/></svg><span data-t="t_gifts"></span></button>
  <button data-tab="profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="t_profile"></span></button>
</nav>

<script>
(function () {
const tg = window.Telegram && Telegram.WebApp;
const DARK = tg ? tg.colorScheme !== "light" : matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = DARK ? "dark" : "light";   // тема — как у Telegram
if (tg) { tg.ready(); tg.expand(); try { const c = DARK ? "#0e1016" : "#f5f6fa"; tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
const INIT = tg ? tg.initData : "";
const START = tg && tg.initDataUnsafe ? (tg.initDataUnsafe.start_param || "") : "";
const LANG = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && (tg.initDataUnsafe.user.language_code || "").startsWith("ru")) ? "ru" : "tj";
const SUPPORT = {{ support | tojson }};

const L = {
  tj: { hi: "Салом,", t_home: "Асосӣ", t_gifts: "Тӯҳфа", t_profile: "Профил", balance: "Баланси шумо", som: "сомонӣ",
    topup: "Пур кардан", history: "Таърих", fast: "Фаврӣ", months: "3 · 6 · 12 моҳ", from_bot: "Аз номи бот",
    invite: "Дӯстонро даъват кунед", invite_sub: "Аз ҳар хариди дӯстатон {p}% ба шумо", recent: "Харидҳои охирин",
    stars_sub: "1 ⭐ = {r} сомонӣ · аз {min} то {max}", amount: "Миқдор", self: "Ба худам", friend: "Ба дӯстам",
    to_self: "Ба @{u} фиристода мешавад", to_self_noname: "Дар Telegram username гузоред", friend_ph: "@username-и дӯст",
    pay: "Ба пардохт", buy: "Харидан", ready: "Бастаҳои тайёр", prem_sub: "Ба худ ё ҳамчун тӯҳфа ба дӯстатон",
    month: "моҳ", per_month: "/ моҳ", choose_plan: "Тарифро интихоб кунед", save: "−{p}% арзонтар", instant: "Фаврӣ",
    gifts_title: "Тӯҳфаҳо", gifts_sub: "Аз номи бот · ба худ ё ба дӯст", no_gifts: "Тӯҳфаҳо ҳоло нестанд — баъдтар бинед.",
    left: "{n} монд", gift_msg: "Паём ба тӯҳфа (ихтиёрӣ)", orders: "Фармоишҳо", stars_got: "Stars гирифта шуд",
    spent: "Харҷ шуд", topped: "Пур карда шуд", hist: "Таърихи фармоишҳо", refs: "Барномаи рефералӣ",
    topup_bal: "Пур кардани баланс", support: "Дастгирӣ", copy: "Нусха", copied: "Нусха шуд ✓", share: "Фиристодан",
    need: "Маблағ кифоя нест: боз {s} сомонӣ лозим. Пур кунем?", yes: "Пур кардан", no: "Не",
    ref_text: "Пайванди шумо — дӯстон аз он ворид шаванд, аз ҳар хариди онҳо {p}% ба баланси шумо:", invited: "Даъватшудагон",

  const chips = cr ? [5, 10, 25, 50] : [20, 50, 100, 200];
  const min = cr ? (m.min_usd || D.pay.min_usd) : D.pay.min_tjs;
  return `<div class="ph"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${IC.card}</div><div><h1>${t("topup_bal")}</h1><p>${t("balance")}: ${microTjs(D.me.balance)} ${t("som")}</p></div></div>
    ${D.pay.crypto_only ? `<div class="friday" style="background:var(--accent-soft);color:var(--accent)">${t("crypto_only")}</div>` : ""}
    <h2 class="sec-title" style="margin-top:8px">${t("pay_method")}</h2><div class="pm">${methods || `<p class="mut">${t("empty")}</p>`}</div>
    ${m.code ? `<section class="card mt"><label class="label" for="tamt">${cr ? t("sum_usd") : t("sum_tjs")}</label>
      <div class="field"><input id="tamt" type="number" inputmode="decimal" placeholder="${esc(min)}" value="${esc(P.amount)}"></div>
      <div class="chips">${chips.map(n => `<button class="chip" data-act="tchip" data-v="${n}">${n}</button>`).join("")}</div>
      <p class="hint">${t("min", {v: (min || "") + (cr ? " USDT" : " " + t("som"))})}</p>
      ${!m.auto ? `<div class="copyrow"><div><small>${t("details")}</small><span class="v">${esc(m.details)}</span></div>
          <button class="copybtn" data-act="copy" data-v="${esc(m.details)}">${t("copy")}</button></div>
        <p class="note">${t("transfer")}</p>
        <label class="file"><input type="file" id="trc" accept="image/*,application/pdf">${IC.plus}<span id="trcn">${t("receipt")}</span></label>` : ""}
      ${m.auto === "dcbank" && D.pay.dc_video ? `<p class="note"><a href="#" data-act="video" style="color:var(--accent)">▶ ${t("watch")}</a></p>
        <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="tagree" ${P.agree ? "checked" : ""}> ${t("agree")}</label>` : ""}
      <button class="btn primary full mt" data-act="tgo">${m.auto ? t("next") : t("send_receipt")}</button></section>` : ""}`;
}
function payView() {
  const p = P.pay, m = curM();
  const done = p.status === "paid";
  let body = "";
  if (done) body = `<div class="status ok">${t("paid_ok")}</div><button class="btn primary full mt" data-tab="home">OK</button>`;
  else if (p.status !== "pending") body = `<div class="status" style="background:var(--bad-soft);color:var(--bad)">${t("expired")}</div><button class="btn soft full mt" data-act="tnew">${t("topup")}</button>`;
  else if (p.auto === "dcbank") body = `
    <div class="copyrow"><div><small>${t("to_pay_exact")}</small><span class="v num">${esc(p.pay_amount)} ${t("som")}</span></div>
      <button class="copybtn" data-act="copy" data-v="${esc(p.pay_amount)}">${t("copy")}</button></div>
    ${p.pay_url ? `<button class="btn primary full mt" data-act="open" data-v="${esc(p.pay_url)}">${t("go_pay")} →</button>` : ""}
    <button class="btn soft full mt" data-act="tpaid">✓ ${t("i_paid")}</button>
    <div class="status" id="tstat"><span class="spin"></span>${t("waiting")}</div>
    <div id="trcbox" class="${P.showReceipt ? "" : "hidden"}"><p class="note">${t("not_found")}</p>
      <label class="file"><input type="file" id="trc2" accept="image/*,application/pdf">${IC.plus}<span id="trcn2">${t("receipt")}</span></label>
      <button class="btn primary full mt" data-act="trc2">${t("send_receipt")}</button></div>`;
  else body = `
    <div class="copyrow"><div><small>${t("to_pay_exact")}</small><span class="v num">${esc(p.pay_amount)} ${esc(p.pay_currency)}</span></div>
      <button class="copybtn" data-act="copy" data-v="${esc(p.pay_amount)}">${t("copy")}</button></div>
    ${p.address ? `<div class="copyrow"><div><small>${t("address")}${p.network_short ? " · " + esc(p.network_short) : ""}</small><span class="v" style="font-size:14px">${esc(p.address)}</span></div>
      <button class="copybtn" data-act="copy" data-v="${esc(p.address)}">${t("copy")}</button></div>` : ""}
    ${p.memo ? `<div class="copyrow"><div><small>Memo</small><span class="v">${esc(p.memo)}</span></div><button class="copybtn" data-act="copy" data-v="${esc(p.memo)}">${t("copy")}</button></div>` : ""}
    ${p.pay_url ? `<button class="btn primary full mt" data-act="open" data-v="${esc(p.pay_url)}">${t("go_pay")} →</button>` : ""}
    <p class="note">${esc(p.auto_note)}${p.network_note ? " " + esc(p.network_note) : ""}</p>
    <div class="status" id="tstat"><span class="spin"></span><span>${t("waiting")}</span>${p.left ? ` <b id="tleft" class="num" style="margin-left:auto"></b>` : ""}</div>`;
  return `<div class="ph"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${IC.card}</div><div><h1>${esc(p.method_title || m.title || "")}</h1><p>#${p.id}</p></div></div>
    <section class="card">${body}</section>`;
}
function startPoll() {
  clearInterval(P.poll); if (!P.pay || P.pay.status !== "pending") return;
  const started = Date.now();
  P.poll = setInterval(async () => {
    if (TAB !== "topup" || !P.pay) { clearInterval(P.poll); return; }
    if (P.pay.left) { const l = Math.max(0, P.pay.left - Math.floor((Date.now() - started) / 1000));
      const el = document.getElementById("tleft"); if (el) el.textContent = Math.floor(l / 60) + ":" + String(l % 60).padStart(2, "0"); }
    const r = await api("topup/status", {id: P.pay.id});
    if (r.status && r.status !== "pending") { P.pay.status = r.status; if (r.balance != null) D.me.balance = r.balance;
      clearInterval(P.poll); haptic("medium"); render(); }
  }, 3000);
}
async function topupGo(btn) {
  const m = curM(), cr = isCrypto(m);
  const v = (document.getElementById("tamt") || {}).value || ""; P.amount = v;
  const fd = new FormData(); fd.append("method", m.code); fd.append(cr ? "amount" : "amount_tjs", v);
  const ag = document.getElementById("tagree"); if (ag && ag.checked) fd.append("agree", "1");
  const f = document.getElementById("trc"); if (f && f.files[0]) fd.append("receipt", f.files[0]);
  btn.disabled = true;
  const r = await fetch("/tg/api/topup", {method: "POST", headers: {"X-Tg-Init": INIT}, body: fd}).then(x => x.json()).catch(() => ({error: "Хато"}));
  btn.disabled = false;
  if (!r.ok) { toast(r.error || "Хато", "err"); return; }
  if (r.done) { toast(r.message, "ok"); go("home"); return; }
  P.pay = r.pay; P.showReceipt = false; render(); startPoll();
}
async function sendLateReceipt(btn) {
  const f = document.getElementById("trc2"); if (!f || !f.files[0]) { toast(t("receipt"), "err"); return; }
  const fd = new FormData(); fd.append("id", P.pay.id); fd.append("receipt", f.files[0]);
  btn.disabled = true;
  const r = await fetch("/tg/api/topup/receipt", {method: "POST", headers: {"X-Tg-Init": INIT}, body: fd}).then(x => x.json()).catch(() => ({}));
  btn.disabled = false;
  if (r.ok) { toast(r.message, "ok"); clearInterval(P.poll); P.pay = null; go("home"); } else toast(r.error || "Хато", "err");
}

async function history() {
  const sh = sheet(`<h3>${t("hist")}</h3><div id="hl"><div class="skel"></div></div>`);
  const r = await api("history");
  sh.querySelector("#hl").innerHTML = (r.items || []).length ? r.items.map(i => `<div class="hist-i"><div><b>${esc(i.title)}</b>
      <div class="mut">№ ${esc(i.ref)} · ${ago(i.at)} · ${esc(i.status_title || i.status)}</div>${i.link ? `<button class="chip" style="width:auto;padding:0 12px;margin-top:6px" data-act="share" data-v="${esc(i.link)}">${t("share")}</button>` : ""}</div>
      <b class="num">${microTjs(i.price)}</b></div>`).join("") : `<p class="mut">${t("empty")}</p>`;
}

function refs() {
  sheet(`<h3>${t("refs")}</h3><p class="mut">${t("ref_text", {p: D.ref.percent})}</p>${D.ref.link ? linkBox(D.ref.link) : ""}
    <p class="mut">${t("invited")}: <b>${D.ref.invited}</b></p>`);
}

function copy(text) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(t("copied"), "ok"), () => {});
  haptic();
}

// ── клики ──
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, v = a.dataset.v;
  if (act === "topup") topup(v);
  else if (act === "history") history();
  else if (act === "refs") refs();
  else if (act === "close") closeSheet();
  else if (act === "copy") copy(v);
  else if (act === "share") { const u = "https://t.me/share/url?url=" + encodeURIComponent(v); tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u); }
  else if (act === "support") { if (SUPPORT && SUPPORT.startsWith("@") && tg) tg.openTelegramLink("https://t.me/" + SUPPORT.slice(1)); }
  else if (act === "sadd") { S.starsQty = (S.starsQty || 0) + +v; haptic(); render(); }
  else if (act === "spack") { S.starsQty = +v; haptic(); render(); }
  else if (act === "s-to") { S.starsTo = v; render(); }
  else if (act === "p-to") { S.premTo = v; render(); }
  else if (act === "plan") { S.plan = v; haptic(); render(); }
  else if (act === "gift") giftSheet(v);
  else if (act === "pm") { P.method = v; P.amount = (document.getElementById("tamt") || {}).value || ""; haptic(); render(); }
  else if (act === "tchip") { const el = document.getElementById("tamt"); if (el) el.value = v; P.amount = v; haptic(); }
  else if (act === "tgo") topupGo(a);
  else if (act === "tnew") { P.pay = null; render(); }
  else if (act === "open") { tg && tg.openLink ? tg.openLink(v) : window.open(v); }
  else if (act === "video") { e.preventDefault(); tg && tg.openLink ? tg.openLink(location.origin + D.pay.dc_video) : window.open(D.pay.dc_video); }
  else if (act === "tpaid") { P.showReceipt = false; const st = document.getElementById("tstat"); if (st) st.lastChild.textContent = t("searching");
      setTimeout(() => { if (P.pay && P.pay.status === "pending") { P.showReceipt = true; const b = document.getElementById("trcbox"); if (b) b.classList.remove("hidden"); } }, 90000); }
  else if (act === "trc2") sendLateReceipt(a);
  else if (act === "buy-stars" || act === "buy-premium") {
    const stars_ = act === "buy-stars", pre = stars_ ? "s" : "p";
    const friendEl = document.getElementById(pre + "-friend");
    const to = stars_ ? S.starsTo : S.premTo;
    a.disabled = true;
    const r = await api("buy", stars_ ? {type: "stars", qty: S.starsQty, to, username: friendEl ? friendEl.value : "", idem: crypto.randomUUID()}
      : {type: "premium", product_id: S.plan, to, username: friendEl ? friendEl.value : "", idem: crypto.randomUUID()});
    a.disabled = false; done(r);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "trc" || e.target.id === "trc2") { const n = document.getElementById(e.target.id === "trc" ? "trcn" : "trcn2");
    if (n && e.target.files[0]) n.textContent = "📎 " + e.target.files[0].name; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "sq") {
    S.starsQty = Math.max(0, Math.min(parseInt(e.target.value || "0", 10) || 0, D.stars.max));
    const unit = parseFloat(D.stars.unit_usd);
    $("#ssum").textContent = S.starsQty ? fmt(S.starsQty * unit * rate()) : "0";
    const b = document.querySelector('[data-act="buy-stars"]'); if (b) b.disabled = S.starsQty < D.stars.min;
  }
  if (e.target.id === "s-friend") S.starsFriend = e.target.value;
  if (e.target.id === "p-friend") S.premFriend = e.target.value;
});
if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (document.querySelector(".sheet")) closeSheet(); else go("home"); });

async function refresh() {
  const r = await api("init", {start: START});
  if (r.error) { $("#view").innerHTML = `<div class="card mt"><p>${esc(r.error)}</p></div>`; return; }
  D = r;
  $("#hname").textContent = D.me.name || "Donatix";
  $("#hava").outerHTML = ava(D.me.name, D.me.photo).replace(/class="ava/, 'id="hava" class="ava');
  if (D.friday) { $("#friday").textContent = D.friday; $("#friday").classList.remove("hidden"); }
  render();
}
refresh();
})();

// ── Анимация подарков как в Telegram: Lottie (из .tgs) или видео-стикер. Пока не загрузилась — картинка.
// Играют только те, что видно на экране; ушли за край — пауза (батарея и плавность).
const LOTTIE = "{{ static_url('/static/vendor/lottie_light-5.12.2.min.js') }}";   // lottie-web 5.12.2, MIT
let lottieP = null;
const loadLottie = () => lottieP || (lottieP = new Promise((ok, no) => {
  const s = document.createElement("script"); s.src = LOTTIE; s.async = true;
  s.onload = () => ok(window.lottie); s.onerror = no; document.head.appendChild(s);
}));
const animCache = {};
const animSeen = new IntersectionObserver(es => es.forEach(e => {
  const p = e.target._player; if (!p) { if (e.isIntersecting) startAnim(e.target); return; }
  e.isIntersecting ? p.play() : p.pause();
}), {rootMargin: "80px"});
async function startAnim(el) {
  if (el._busy) return; el._busy = true;
  const url = el.dataset.anim;
  try {
    if (url.endsWith(".webm")) {
      const v = document.createElement("video");
      Object.assign(v, {src: url, autoplay: true, loop: true, muted: true, playsInline: true});
      v.className = "anim"; v.setAttribute("playsinline", "");
      v.oncanplay = () => el.classList.add("playing"); v.onerror = () => v.remove();
      el.appendChild(v); el._player = v; return;
    }
    const [lottie, data] = await Promise.all([loadLottie(),
      animCache[url] || (animCache[url] = fetch(url).then(r => { if (!r.ok) throw 0; return r.json(); }))]);
    if (!el.isConnected) return;
    const box = document.createElement("div"); box.className = "anim"; el.appendChild(box);
    el._player = lottie.loadAnimation({container: box, renderer: "svg", loop: true, autoplay: true,
      animationData: JSON.parse(JSON.stringify(data)), rendererSettings: {progressiveLoad: true}});
    el._player.addEventListener("DOMLoaded", () => el.classList.add("playing"));
  } catch (_) { el._busy = false; delete animCache[url]; }   // не вышло — остаётся картинка
}
const watchAnims = () => document.querySelectorAll(".pic[data-anim]:not([data-seen])").forEach(el => {
  el.setAttribute("data-seen", ""); animSeen.observe(el);
});
new MutationObserver(watchAnims).observe(document.body, {childList: true, subtree: true});
watchAnims();
</script>
