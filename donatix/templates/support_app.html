<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Тикеты поддержки</title>
<meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff); --bg2: var(--tg-theme-secondary-bg-color, #f1f2f7);
    --text: var(--tg-theme-text-color, #14161f); --muted: var(--tg-theme-hint-color, #8a8f9e);
    --accent: var(--tg-theme-button-color, #4f46e5); --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--muted) 25%, transparent); --bad: #e5484d; --ok: #30a46c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab { flex: 1; padding: 8px 6px; border: 0; border-radius: 10px; background: var(--bg2); color: var(--text); font: inherit; font-weight: 600; font-size: 13px; }
  .tab.on { background: var(--accent); color: var(--accent-text); }
  .list { padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: var(--bg); text-decoration: none; color: inherit; }
  .row .ico { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg2); }
  .row .grow { flex: 1; min-width: 0; }
  .row b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); align-self: center; flex: none; }
  .empty, .err { padding: 40px 16px; text-align: center; color: var(--muted); }
  .err { color: var(--bad); }
  .head { padding: 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .head b { display: block; font-size: 16px; }
  .head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  .chip { flex: none; padding: 4px 9px; border-radius: 999px; background: var(--bg2); font-size: 12px; white-space: nowrap; }
  .chat { padding: 12px 12px 140px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 84%; padding: 9px 12px; border-radius: 16px; background: var(--bg); }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 6px; }
  .msg.them { align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg .who { font-size: 11px; opacity: .7; margin-bottom: 3px; }
  .msg .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg img { display: block; max-width: 220px; max-height: 260px; border-radius: 10px; margin-top: 6px; }
  .compose { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .compose textarea { width: 100%; min-height: 44px; max-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); color: var(--text); font: inherit; resize: none; }
  .actions { display: flex; gap: 6px; margin-top: 6px; }
  .btn { flex: 1; padding: 10px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; background: var(--bg2); color: var(--text); }
  .btn.main { background: var(--accent); color: var(--accent-text); }
  .back { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; padding: 0 0 6px; }
  .seg { display: flex; gap: 6px; margin-top: 10px; }
  .seg button { flex: 1; padding: 8px; border: 0; border-radius: 10px; background: var(--bg2); color: var(--text); font: inherit; font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .msg audio { display: block; width: 230px; max-width: 100%; height: 38px; margin-top: 6px; }
  .tools { display: flex; gap: 6px; align-items: center; }
  .tools .ic { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--bg2); font-size: 20px; color: var(--text); }
  .tools .ic.rec { background: var(--bad); color: #fff; width: auto; padding: 0 12px; font-size: 15px; font-weight: 700; }
  .tools textarea { flex: 1; }
  .pending { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .hist { padding: 12px 12px 30px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; }
  .stat b { font-size: 17px; }
  .sect { margin: 16px 2px 8px; font-weight: 700; }
  .op { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 9px 12px; margin-bottom: 6px; }
  .op .grow { flex: 1; min-width: 0; }
  .op .grow div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op small { color: var(--muted); font-size: 12px; }
  .amt { font-weight: 700; white-space: nowrap; }
  .amt.plus { color: var(--ok); }
</style>
</head>
<body>
<div id="app"><div class="empty">Загрузка…</div></div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp, app = document.getElementById("app");
  if (tg) { tg.ready(); tg.expand(); }
  var init = tg ? tg.initData : "";
  var state = {status: "active", ticket: null, last: 0, timer: null};
  var start = new URLSearchParams(location.search).get("t") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function when(iso) { try { var d = new Date(iso.replace(/\.\d+Z$/, "Z")); return d.toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}); } catch (e) { return ""; } }
  function api(path, body) {
    return fetch("/support-app/api/" + path, {method: "POST", headers: {"Content-Type": "application/json", "X-Tg-Init": init},
      body: JSON.stringify(body || {})}).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Ошибка"); return d; }); });
  }
  function fail(e) { app.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  function haptic() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }

  function showList() {
    clearInterval(state.timer); state.ticket = null;
    if (tg) tg.BackButton.hide();
    api("list", {status: state.status}).then(function (d) {
      var tabs = [["active", "Открытые"], ["open", "Ждут · " + d.open], ["closed", "Закрытые"], ["all", "Все"]];
      var html = '<div class="bar">' + tabs.map(function (t) {
        return '<button class="tab ' + (t[0] === state.status ? "on" : "") + '" data-s="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join("") + '</div><div class="list">';
      if (!d.items.length) html += '<div class="empty">Тикетов нет 🎉</div>';
      d.items.forEach(function (t) {
        var ico = t.status === "closed" ? "✅" : (t.status === "answered" ? "💬" : "⏳");
        html += '<a class="row" href="#" data-id="' + t.id + '"><span class="ico">' + ico + '</span><div class="grow"><b>#' + t.id + ' · ' + esc(t.subject) +
          '</b><div class="sub">' + esc(t.client) + (t.order_ref ? " · " + esc(t.order_ref) : "") + " · " + when(t.at) + '</div><div class="sub">' +
          (t.last_author === "admin" ? "🛟 " : "👤 ") + esc(t.last) + '</div></div>' + (t.new ? '<span class="dot"></span>' : "") + '</a>';
      });
      app.innerHTML = html + '</div>';
      app.querySelectorAll(".tab").forEach(function (b) { b.onclick = function () { state.status = b.dataset.s; showList(); }; });
      app.querySelectorAll(".row").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); openTicket(+a.dataset.id); }; });
    }).catch(fail);
  }

  function bubble(m) {
    return '<div class="msg ' + (m.author === "admin" ? "me" : "them") + '"><div class="who">' + (m.author === "admin" ? "🛟 " + esc(m.who || "Поддержка") : "👤 Клиент") +
      ' · ' + when(m.at) + '</div>' + (m.text ? '<div class="txt">' + esc(m.text) + '</div>' : "") +
      (m.file ? (m.kind === "audio" ? '<audio controls preload="none" src="' + esc(m.file) + '"></audio>' :
        (m.kind === "pdf" ? '<a href="' + esc(m.file) + '" target="_blank">📎 PDF</a>' : '<a href="' + esc(m.file) + '" target="_blank"><img src="' + esc(m.file) + '" alt=""></a>')) : "") + '</div>';
  }

  function openTicket(id, view) {
    clearInterval(state.timer); view = view || "chat";
    api("ticket", {id: id}).then(function (t) {
      state.ticket = t.id; state.last = t.messages.length ? t.messages[t.messages.length - 1].id : 0;
      if (tg) { tg.BackButton.show(); }
      var closed = t.status === "closed";
      var head = '<div class="head"><button class="back" id="back">‹ Все тикеты</button><b>👤 ' + esc(t.name) + '</b><div class="sub">#' + t.id + ' · ' +
        esc(t.subject) + ' · ' + esc(t.topic) + (t.order_ref ? ' · ' + esc(t.order_ref) : '') + ' · <b>' + esc(t.status_title) + '</b></div>' +
        '<div class="seg"><button data-v="chat" class="' + (view === "chat" ? "on" : "") + '">💬 Чат</button><button data-v="hist" class="' +
        (view === "hist" ? "on" : "") + '">📜 История клиента</button></div></div>';
      if (view === "hist") { app.innerHTML = head + '<div class="hist" id="hist"><div class="empty">Загрузка…</div></div>'; wire(t); history(t.id); return; }
      app.innerHTML = head + '<div class="chat" id="chat">' + t.messages.map(bubble).join("") + '</div>' +
        '<div class="compose"><div class="tools"><button class="ic" id="clip" title="Чек, скриншот, файл">📎</button>' +
        '<input type="file" id="file" accept="image/*,application/pdf,audio/*" hidden>' +
        '<textarea id="txt" placeholder="Ответ клиенту…"></textarea><button class="ic" id="mic" title="Голосовое">🎤</button></div>' +
        '<div class="pending" id="pending" hidden></div><div class="actions">' +
        '<button class="btn main" id="send">Отправить</button><button class="btn" id="sendclose">Ответить и закрыть</button>' +
        '<button class="btn" id="toggle">' + (closed ? "↩️ Открыть" : "✅ Закрыть") + '</button></div></div>';
      window.scrollTo(0, document.body.scrollHeight);
      wire(t);
      var file = document.getElementById("file"), pending = document.getElementById("pending"), attached = null;
      function attach(f, label) { attached = f; pending.hidden = !f; pending.textContent = f ? label + " — нажмите «Отправить»" : ""; }
      document.getElementById("clip").onclick = function () { file.click(); };
      file.onchange = function () { var f = file.files[0]; if (f) attach(f, (f.type.indexOf("audio") === 0 ? "🎤 " : "📎 ") + f.name); };
      function send(close, voice) {
        var box = document.getElementById("txt"), text = box.value.trim(), f = voice || attached;
        if (!text && !f) { box.focus(); return; }
        var fd = new FormData(); fd.append("id", t.id); fd.append("text", text); if (close) fd.append("close", "1"); if (f) fd.append("file", f, f.name || "file");
        pending.hidden = false; pending.textContent = "Отправляем…";
        fetch("/support-app/api/reply", {method: "POST", headers: {"X-Tg-Init": init}, body: fd})
          .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Ошибка"); }); })
          .then(function () { haptic(); box.value = ""; attach(null); file.value = ""; close ? showList() : poll(); })
          .catch(function (e) { pending.textContent = "⚠️ " + e.message; });
      }
      document.getElementById("send").onclick = function () { send(false); };
      document.getElementById("sendclose").onclick = function () { send(true); };
      document.getElementById("toggle").onclick = function () { api("status", {id: t.id, closed: !closed}).then(function () { haptic(); openTicket(t.id); }); };
      voiceButton(document.getElementById("mic"), function (f) { send(false, f); });
      state.timer = setInterval(poll, 5000);
    }).catch(fail);
  }

  function wire(t) {
    document.getElementById("back").onclick = showList;
    app.querySelectorAll(".seg button").forEach(function (b) { b.onclick = function () { openTicket(t.id, b.dataset.v); }; });
  }

  var ORDER = {completed: "✅", processing: "⏳", attention: "⚠️", failed: "↩️"};
  var PAY = {paid: "✅", pending: "⏳", rejected: "❌", cancelled: "🚫", fake: "🚨"};
  function history(id) {
    api("history", {id: id}).then(function (h) {
      var html = '<div class="stats"><div class="stat"><small>Баланс</small><b>$' + esc(h.balance) + '</b></div>' +
        '<div class="stat"><small>Всего пополнил</small><b>$' + esc(h.topped) + '</b></div>' +
        '<div class="stat"><small>Потратил на покупки</small><b>$' + esc(h.spent) + '</b></div>' +
        '<div class="stat"><small>Выполнено заказов</small><b>' + h.orders_done + '</b></div></div>';
      html += '<div class="sect">🛒 Заказы</div>' + (h.orders.length ? h.orders.map(function (o) {
        return '<div class="op"><span>' + (ORDER[o.status] || "•") + '</span><div class="grow"><div><b>' + esc(o.id) + '</b> · ' + esc(o.name) + '</div><small>' +
          (o.to ? esc(o.to) + " · " : "") + when(o.at) + '</small></div><span class="amt">$' + esc(o.total) + '</span></div>'; }).join("") : '<div class="empty">Заказов нет</div>');
      html += '<div class="sect">📒 Куда уходили деньги</div>' + (h.ops.length ? h.ops.map(function (o) {
        return '<div class="op"><div class="grow"><div>' + esc(o.what) + '</div><small>' + when(o.at) + ' · остаток $' + esc(o.after) + '</small></div><span class="amt ' +
          (o.plus ? "plus" : "") + '">' + (o.plus ? "+" : "−") + '$' + esc(o.amount) + '</span></div>'; }).join("") : '<div class="empty">Операций нет</div>');
      html += '<div class="sect">💳 Заявки на пополнение</div>' + (h.pays.length ? h.pays.map(function (p) {
        return '<div class="op"><span>' + (PAY[p.status] || "•") + '</span><div class="grow"><div>#' + p.id + ' · ' + esc(p.amount) + '</div><small>' + when(p.at) + '</small></div></div>'; }).join("") : '<div class="empty">Заявок нет</div>');
      document.getElementById("hist").innerHTML = html;
    }).catch(function (e) { document.getElementById("hist").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }

  function voiceButton(btn, done) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { btn.hidden = true; return; }
    var rec = null, chunks = [], started = 0, tick = null;
    btn.onclick = function () {
      if (rec) { rec.stop(); return; }
      navigator.mediaDevices.getUserMedia({audio: true}).then(function (stream) {
        chunks = []; rec = new MediaRecorder(stream); started = Date.now();
        rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          stream.getTracks().forEach(function (x) { x.stop(); });
          clearInterval(tick); btn.classList.remove("rec"); btn.textContent = "🎤";
          var type = rec.mimeType || "audio/webm", blob = new Blob(chunks, {type: type}); rec = null;
          if (Date.now() - started < 800 || !blob.size) return;
          done(new File([blob], "voice." + (type.indexOf("mp4") >= 0 ? "m4a" : (type.indexOf("ogg") >= 0 ? "ogg" : "webm")), {type: type}));
        };
        rec.start(); btn.classList.add("rec"); haptic();
        tick = setInterval(function () { var s = Math.floor((Date.now() - started) / 1000); btn.textContent = "⏹ " + Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }, 300);
      }).catch(function () { alert("Нет доступа к микрофону. Можно ответить голосовым прямо в боте: reply на сообщение клиента."); });
    };
  }

  function poll() {
    if (!state.ticket || document.hidden) return;
    api("ticket", {id: state.ticket, after: state.last}).then(function (t) {
      if (!t.messages.length) return;
      var chat = document.getElementById("chat"); if (!chat) return;
      t.messages.forEach(function (m) { chat.insertAdjacentHTML("beforeend", bubble(m)); state.last = m.id; });
      window.scrollTo(0, document.body.scrollHeight);
    }).catch(function () {});
  }

  if (tg) tg.BackButton.onClick(showList);
  if (!init) { fail(new Error("Откройте это из бота поддержки в Telegram.")); return; }
  start ? openTicket(+start) : showList();
})();
</script>
</body>
</html>
