{% extends "base.html" %}
{% block title %}Регистрация — {{ site_name }}{% endblock %}
{% block body %}
<main class="auth">
  <div class="card">
    <h2>Стать партнёром</h2>
    <p class="muted">После регистрации мы проверим заявку и активируем доступ.</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" value="{{ form.email or '' }}">
      <label for="login">Имя пользователя</label>
      <input id="login" name="login" required minlength="3" maxlength="32" autocomplete="username"
             pattern="[A-Za-z0-9_.\-]{3,32}" value="{{ form.login or '' }}">
      <div class="hint">Латиница, цифры, _ . -</div>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <label for="password2">Повторите пароль</label>
      <input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password">
      <label for="project">Ваш проект <span class="muted">(необязательно)</span></label>
      <input id="project" name="project" placeholder="Ссылка на канал, бота или сайт" value="{{ form.project or '' }}">
      <div style="margin-top:20px"><button class="btn primary block">Создать аккаунт</button></div>
    </form>
    <p class="small muted" style="margin-top:16px">Уже есть аккаунт? <a href="/login">Войти</a></p>
  </div>
</main>
{% endblock %}
