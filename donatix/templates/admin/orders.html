{% extends "admin/_layout.html" %}
{% block title %}Заказы — админка{% endblock %}
{% block content %}
<section class="page-hero"><h1>Заказы</h1><p>Все заказы клиентов. Сначала — требующие внимания.</p></section>
<form class="card" method="get"><div class="filters">
  <div class="full"><input type="search" aria-label="Поиск" id="q" name="q" value="{{ q }}" placeholder="dx-…, ord-…, товар, клиент"></div>
  <div><label class="label-caps" for="status">Статус</label>
    <select id="status" name="status"><option value="">Все</option>
      {% for s in ['attention', 'processing', 'completed', 'failed'] %}<option value="{{ s }}" {{ 'selected' if s == status }}>{{ status_titles[s] }}</option>{% endfor %}
    </select></div>
  <div style="display:flex;align-items:end"><button class="btn block">Показать</button></div>
</div></form>
<div class="card table-wrap" style="margin-top:16px">{% include "admin/_orders_table.html" %}</div>
{% endblock %}
