<title>Кабинет продавца</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; content column max 1000px */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #13201d;
  --muted: #5d6e69;
  --line: #dde5e2;
  --accent: #0e6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --warn: #a8570a;
  --warn-soft: #fbecd9;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --info: #2c5fa8;
  --info-soft: #e1ebf8;
  --bar2: #9fd2c6;
  --shadow: 0 1px 2px rgba(19,32,29,.06), 0 6px 20px rgba(19,32,29,.06);
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --ink: #e6efec; --muted: #94a7a1; --line: #263431;
    --accent: #3fb59d; --accent-ink: #06201a; --accent-soft: #173a33;
    --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f2867e; --bad-soft: #3d1d1b;
    --info: #8ab4f0; --info-soft: #1c2a3d; --bar2: #2a5a50;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --ink: #e6efec; --muted: #94a7a1; --line: #263431;
  --accent: #3fb59d; --accent-ink: #06201a; --accent-soft: #173a33;
  --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f2867e; --bad-soft: #3d1d1b;
  --info: #8ab4f0; --info-soft: #1c2a3d; --bar2: #2a5a50;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

/* shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; padding: 20px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; background: var(--surface); overflow-y: auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 4px 10px 18px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.nav-btn { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 0; background: none; text-align: left; color: var(--muted); font-weight: 500; }
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-btn:hover { background: var(--bg); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.rail-foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
.status-dot.off { background: var(--bad); }

.main { min-width: 0; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 4vw, 28px); margin: 2px 0 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; font-weight: 600; }
h3 { font-size: 15px; margin: 0; font-weight: 600; }
.tabs { display: none; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); padding: 9px 15px; font-weight: 600; white-space: nowrap; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13.5px; border-radius: 9px; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-weight: 700; font-size: 17px; padding: 0; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.err { font-size: 12.5px; color: var(--bad); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-height: 42px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.invalid { border-color: var(--bad); }
textarea.input { min-height: 84px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.suffix { position: relative; }
.suffix .input { padding-right: 48px; }
.suffix span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel.tight { padding: 0; overflow: hidden; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi b { font-family: var(--f-display); font-size: clamp(17px, 2.4vw, 22px); font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.hero span { color: var(--accent-ink); opacity: .85; }
.kpi.warn b { color: var(--warn); }
.kpi.neg b { color: var(--bad); }

/* toolbar, chips */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 220px; position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.search .input { padding-left: 38px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip b { font-weight: 700; }

/* product list */
.plist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow-main { display: contents; }
.prow .open { border: 0; background: none; padding: 0; text-align: left; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; grid-column: 1 / 3; min-width: 0; }
.thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; font-size: 26px; flex: none; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.price { font-weight: 600; text-align: right; white-space: nowrap; }
.price s { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.price small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper b { min-width: 34px; text-align: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.off { background: var(--bg); color: var(--muted); }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty b { color: var(--ink); font-size: 16px; }

/* orders */
.orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--line); }
.order.s-new { border-left-color: var(--bad); }
.order.s-accepted { border-left-color: var(--warn); }
.order.s-ready { border-left-color: var(--info); }
.order.s-done { border-left-color: var(--accent); }
.order ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.order li { display: flex; justify-content: space-between; gap: 10px; }
.order .total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px dashed var(--line); padding-top: 8px; }
.order .who { font-size: 13px; color: var(--muted); }
.order .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* chart */
.chart { display: flex; flex-direction: column; gap: 8px; }
.bars { height: 180px; display: flex; align-items: flex-end; gap: 3px; border-bottom: 1px solid var(--line); position: relative; }
.bars .b { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; border: 0; background: none; padding: 0; border-radius: 5px 5px 0 0; position: relative; }
.bars .b i { display: block; width: 100%; background: var(--bar2); border-radius: 4px 4px 0 0; position: relative; }
.bars .b i em { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 4px 4px 0 0; }
.bars .b:hover i, .bars .b[aria-pressed="true"] i { filter: brightness(.92); outline: 2px solid var(--ink); outline-offset: 1px; }
.axis { display: flex; gap: 3px; font-size: 11px; color: var(--muted); }
.axis span { flex: 1 1 0; min-width: 0; text-align: center; overflow: hidden; white-space: nowrap; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { min-height: 22px; font-size: 13.5px; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--bg); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .neg { color: var(--bad); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,16,14,.45); z-index: 40; }
.sheet { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); gap: 10px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.photos .ph { width: 84px; height: 84px; border-radius: 12px; background: var(--accent-soft); overflow: hidden; position: relative; display: grid; place-items: center; font-size: 34px; }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; }
.photos .ph button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; }
.photos .ph .main { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 6px; }
.photos label.ph { border: 2px dashed var(--line); background: none; color: var(--muted); font-size: 13px; text-align: center; cursor: pointer; padding: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.switch input { width: 44px; height: 24px; accent-color: var(--accent); flex: none; }
.hintline { font-size: 13px; color: var(--muted); }
.hintline b { color: var(--accent); }
.hintline b.neg { color: var(--bad); }
.variants { display: flex; flex-direction: column; gap: 8px; }
.variant { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 8px; align-items: center; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: 14px; }
.sale-line { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sale-line .thumb { width: 44px; height: 44px; font-size: 20px; }

/* storefront */
.store-hero { display: flex; gap: 16px; align-items: center; }
.store-logo { width: 72px; height: 72px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 28px; overflow: hidden; flex: none; }
.store-logo img { width: 100%; height: 100%; object-fit: cover; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.card .pic { aspect-ratio: 1; background: var(--accent-soft); display: grid; place-items: center; font-size: 56px; max-width: 100%; position: relative; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; }
.card .tags { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.card .tags span { background: var(--surface); color: var(--ink); font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.card .tags span.sale { background: var(--bad); color: #fff; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card .t { font-weight: 600; font-size: 14px; }
.card .d { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .pr { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 6px; gap: 6px; }
.card .pr s { font-size: 12px; color: var(--muted); display: block; }
.card .add { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 20px; line-height: 1; flex: none; }

.checklist { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.dot.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.split { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
.alert { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-radius: var(--r); padding: 12px 16px; font-size: 14px; background: var(--warn-soft); }
.alert.bad { background: var(--bad-soft); }
.alert.info { background: var(--info-soft); }
.morelist { display: flex; flex-direction: column; }
.morelist button { display: flex; align-items: center; gap: 12px; padding: 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-weight: 600; }
.morelist button:first-child { border-top: 0; }
.morelist svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.morelist small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.sched { display: grid; grid-template-columns: 110px auto minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; align-items: center; }

/* welcome */
.welcome { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.welcome-card { max-width: 540px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
.welcome-card h1 { font-size: clamp(26px, 6vw, 36px); }
.welcome-card p { color: var(--muted); margin: 0; max-width: 60ch; }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: center; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 800px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-top: 16px; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabs .nav-btn { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 2px; justify-content: center; align-items: center; text-align: center; }
  .tabs .badge { position: absolute; top: 0; right: calc(50% - 22px); margin: 0; height: 17px; min-width: 17px; font-size: 10.5px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }

    for (const i of o.items) {
      d.rev += i.qty * i.price; d.cogs += i.qty * (i.cost || 0); d.qty += i.qty;
      const key = i.name + (i.variant ? ' · ' + i.variant : '');
      const p = prod[key] || (prod[key] = { name: key, qty: 0, rev: 0, profit: 0 });
      p.qty += i.qty; p.rev += i.qty * i.price; p.profit += i.qty * (i.price - (i.cost || 0));
    }
  }
  // закупка товара уже учтена через закупочную цену — её не вычитаем второй раз
  for (const e of S.expenses) { const d = D[e.date]; if (d && !e.stockPurchase) d.exp += e.amount; }
  const list = days.map(k => ({ ...D[k], profit: D[k].rev - D[k].cogs - D[k].exp }));
  const T = list.reduce((t, d) => { for (const f of ['rev', 'cogs', 'exp', 'orders', 'qty', 'cancelled', 'profit']) t[f] += d[f]; return t; }, { rev: 0, cogs: 0, exp: 0, orders: 0, qty: 0, cancelled: 0, profit: 0 });
  return { list, T, top: Object.values(prod).sort((x, y) => y.rev - x.rev) };
}

function cartTotal() {

function cartItem(key, qty) {

function syncDraft() {

function updateMargin() {

  const parts = [];
  if (pr != null && co != null && pr > 0) { const m = pr - co; parts.push(`Прибыль с одной продажи: <b class="num ${m < 0 ? 'neg' : ''}">${money(m)}</b> (${Math.round(m / pr * 100)}% от цены)`); }
  else parts.push('Укажите закупочную цену, и статистика покажет настоящую прибыль.');
  if (old != null && pr != null && old > pr) parts.push(`Скидка для покупателя: <b class="num">−${Math.round((1 - pr / old) * 100)}%</b>`);
  el.innerHTML = parts.join('<br>');

function saveProduct() {
  const f = $('#pForm'), fd = new FormData(f), errs = {};
  const price = num(fd.get('price')), costRaw = fd.get('cost').trim(), cost = costRaw === '' ? null : num(costRaw), oldRaw = fd.get('oldPrice').trim(), old = oldRaw === '' ? null : num(oldRaw), stock = num(fd.get('stock')), prepRaw = fd.get('prep').trim(), prep = prepRaw === '' ? null : num(prepRaw);
  if (!fd.get('name').trim()) errs.name = 'Введите название';
  if (price == null || price <= 0) errs.price = 'Цена больше нуля';
  if (costRaw && (cost == null || cost < 0)) errs.cost = 'Число от нуля';
  if (oldRaw && (old == null || price == null || old <= price)) errs.oldPrice = 'Должна быть больше цены';
  if (stock == null || stock < 0 || !Number.isInteger(stock)) errs.stock = 'Целое число от 0';
  if (prepRaw && (prep == null || prep <= 0 || prep > 600)) errs.prep = 'От 1 до 600 минут';
  let cat = fd.get('cat');
  if (cat === '__new') { cat = (fd.get('newcat') || '').trim(); if (!cat) errs.newcat = 'Введите категорию'; }
  const variants = readVariants();
  let vErr = '';
  variants.forEach((v, i) => { const el = document.querySelectorAll('#variants .variant')[i]; el.querySelectorAll('.input').forEach(x => x.classList.remove('invalid'));
    if (!v.name) { el.querySelector('.vn').classList.add('invalid'); vErr = 'У каждого варианта нужны название и цена'; }
    if (v.price == null || v.price <= 0) { el.querySelector('.vp').classList.add('invalid'); vErr = 'У каждого варианта нужны название и цена'; } });
  const ok = showErrors(f, errs);
  f.querySelector('#varErr')?.remove();
  if (vErr) { $('#variants').insertAdjacentHTML('afterend', `<span class="err" id="varErr">${vErr}</span>`); f.querySelector('details.more').open = true; }
  if (!ok || vErr) return;
  if (!S.cats.includes(cat)) S.cats.push(cat);
  const d = editing.draft;
  Object.assign(d, { name: fd.get('name').trim(), cat, price, cost, oldPrice: old, stock, unit: fd.get('unit'), desc: fd.get('desc').trim(), labels: fd.getAll('label'), prep, active: !!fd.get('active'), variants });
  // если есть варианты, цена товара = самая низкая цена варианта
  if (variants.length) { const min = variants.reduce((a, b) => a.price <= b.price ? a : b); d.price = min.price; if (min.cost != null) d.cost = min.cost; }
  const i = S.products.findIndex(p => p.id === d.id);
  if (i < 0) S.products.push(d); else S.products[i] = d;
  const wasNew = editing.isNew; save(); closeSheet(); render(); toast(wasNew ? 'Товар добавлен' : 'Изменения сохранены');
}

// фото: уменьшаем, чтобы не раздувать хранилище
function readImage(file, size) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Это не картинка'));
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, size / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8));
    }; img.onerror = () => rej(new Error('Не удалось открыть картинку')); img.src = r.result; };
    r.onerror = () => rej(new Error('Не удалось прочитать файл')); r.readAsDataURL(file);
  });
}

    <div class="tablewrap panel tight"><table><thead><tr><th>Название</th><th class="r">Цена</th><th class="r">Закупка</th><th class="r">Остаток</th><th>Категория</th></tr></thead>

    <span class="small muted">Обязательны только название и цена. Строку с заголовками можно не убирать.</span>
    <textarea class="input" id="impText" style="min-height:180px;font-variant-numeric:tabular-nums" placeholder="Вставьте строки сюда"></textarea>
    <div id="impPreview" class="small"></div>`,
    `<span></span><div class="row"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="doimport" disabled>Добавить</button></div>`);
}
function parseImport(text) {
  const ok = [], bad = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const c = line.includes('\t') ? line.split('\t') : line.split(/;|,(?=\s*\d)/);
    const name = (c[0] || '').trim(), price = num(c[1]);
    if (i === 0 && price == null && /назв|name|товар/i.test(name)) return;
    if (!name || price == null || price <= 0) { bad.push(i + 1); return; }
    const stock = num(c[3]);
    ok.push({ name, price, cost: num(c[2]), stock: stock != null && stock >= 0 ? Math.round(stock) : 0, cat: (c[4] || '').trim() || 'Основное' });
  });
  return { ok, bad };
}
function previewImport() {
  const { ok, bad } = parseImport($('#impText').value);
  $('#impPreview').innerHTML = (ok.length ? `<span style="color:var(--accent);font-weight:600">Готово к добавлению: ${ok.length}</span>` : '') + (bad.length ? `<br><span class="err">Не поняли строки: ${bad.slice(0, 12).join(', ')}${bad.length > 12 ? '…' : ''}. Проверьте, что во втором столбце цена.</span>` : '');
  document.querySelector('[data-act="doimport"]').disabled = !ok.length;
}
function doImport() {
  const { ok } = parseImport($('#impText').value);
  for (const r of ok) {
    if (!S.cats.includes(r.cat)) S.cats.push(r.cat);
    S.products.push({ id: uid(), name: r.name, cat: r.cat, price: r.price, oldPrice: null, cost: r.cost, stock: r.stock, unit: 'шт', emoji: '📦', desc: '', imgs: [], active: true, labels: [], prep: null, variants: [], created: Date.now() });
  }
  save(); closeSheet(); ui.stock = 'all'; ui.cat = 'Все'; render(); toast(`Добавлено товаров: ${ok.length}. Теперь добавьте к ним фото`);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { openSheet('Скопируйте текст', `<textarea class="input" id="copyBox" style="min-height:260px">${esc(text)}</textarea><span class="small muted">Выделите всё и скопируйте, затем вставьте в Excel.</span>`, ''); setTimeout(() => $('#copyBox')?.select(), 50); }
}

    <div class="alert info"><span>Закупку товара отмечайте галочкой «Закупка для продажи». Её стоимость уже входит в прибыль через закупочную цену товаров, поэтому мы не вычитаем её второй раз.</span></div>
    <div class="split">
      <section class="panel tight">${list.length ? `<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Статья</th><th class="r">Сумма</th><th></th></tr></thead><tbody>${list.map(e => `<tr><td>${ddmm(e.date)}</td><td style="white-space:normal">${esc(e.cat)}${e.stockPurchase ? ' <span class="pill off">закупка</span>' : ''}${e.note ? `<br><span class="small muted">${esc(e.note)}</span>` : ''}</td><td class="r">${money(e.amount)}</td><td class="r"><button class="btn ghost sm" data-delexp="${e.id}" aria-label="Удалить расход">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><b>Расходов за этот месяц нет</b><span>Добавляйте аренду, зарплату и другие траты, чтобы видеть настоящую прибыль.</span></div>'}</section>
      <section class="panel col"><h2>По статьям</h2>${cats.length ? cats.map(([c, v]) => `<div class="col" style="gap:4px"><div class="row between small"><span>${esc(c)}</span><b class="num">${money(v)}</b></div><div class="bar"><i style="width:${v / mx * 100}%"></i></div></div>`).join('') : '<span class="muted">Пока пусто</span>'}</section>
    </div>`;
}
function sheetExpense() {
  openSheet('Новый расход', `<form id="expForm" class="col" novalidate style="gap:16px">
    <div class="grid2"><div class="field"><label for="e_date">Дата</label><input class="input" type="date" id="e_date" name="date" value="${today()}" max="${today()}"></div>
    <div class="field"><label for="e_amount">Сумма *</label><div class="suffix"><input class="input num" id="e_amount" name="amount" inputmode="decimal" placeholder="0"><span>${CUR}</span></div></div></div>
    <div class="field"><label for="e_cat">Статья</label><select class="input" id="e_cat" name="cat">${EXP_CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
    <label class="check" id="stockPurchWrap" hidden><input type="checkbox" name="stockPurchase" id="e_sp" checked> Закупка для продажи (уже учтена в закупочной цене)</label>
    <div class="field"><label for="e_note">Комментарий</label><input class="input" id="e_note" name="note" maxlength="100" placeholder="Например, аренда за октябрь"></div>
    <button type="submit" hidden></button></form>`,
    `<span></span><div class="row"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="saveexp">Добавить</button></div>`);
  setTimeout(() => $('#e_amount')?.focus(), 50);
}
function saveExpense() {
  const f = $('#expForm'), fd = new FormData(f), amount = num(fd.get('amount'));
  if (!showErrors(f, amount == null || amount <= 0 ? { amount: 'Введите сумму' } : {})) return;
  const cat = fd.get('cat');
  S.expenses.push({ id: uid(), date: fd.get('date') || today(), cat, amount, note: fd.get('note').trim(), stockPurchase: cat === 'Закупка товара' && !!fd.get('stockPurchase') });
  ui.expMonth = (fd.get('date') || today()).slice(0, 7); save(); closeSheet(); render(); toast('Расход добавлен');
}

// ================= Витрина =================
function vPreview() {
  const vis = S.products.filter(p => p.active && p.stock > 0);
  const cats = S.cats.filter(c => vis.some(p => p.cat === c));
  const sh = S.shop;
  const dow = (new Date().getDay() + 6) % 7, sc = sh.schedule[dow];
  const logo = sh.logo ? `<img src="${sh.logo}" alt="">` : esc((sh.name || '?').trim().charAt(0).toUpperCase());
  const card = p => { const from = p.variants.length ? Math.min(...p.variants.map(v => v.price)) : p.price;
    return `<article class="card"><div class="pic">${pic(p)}<div class="tags">${p.oldPrice ? `<span class="sale">−${Math.round((1 - p.price / p.oldPrice) * 100)}%</span>` : ''}${p.labels.map(l => `<span>${esc(l)}</span>`).join('')}</div></div><div class="body"><div class="t">${esc(p.name)}</div>${p.desc ? `<div class="d">${esc(p.desc)}</div>` : ''}<div class="pr"><div><b class="num">${p.variants.length ? 'от ' : ''}${money(from)}</b>${p.oldPrice ? `<s class="num">${money(p.oldPrice)}</s>` : ''}</div><button class="add" tabindex="-1" aria-hidden="true">+</button></div></div></article>`; };
  return `
    <div class="head"><div><div class="eyebrow">Так покупатели увидят ваш магазин в приложении</div><h1>Витрина</h1></div></div>
    <section class="panel store-hero"><div class="store-logo">${logo}</div><div class="col" style="gap:4px">
      <h2 style="font-family:var(--f-display);font-weight:500;font-size:20px">${esc(sh.name)}</h2>
      <span class="small muted">${sh.paused ? '<b style="color:var(--bad)">Временно не принимает заказы</b>' : sc.open ? `Открыто сегодня ${sc.from}–${sc.to}` : '<b style="color:var(--bad)">Сегодня выходной</b>'} · сборка ~${sh.prep} мин${sh.minOrder ? ' · заказ от ' + money(sh.minOrder) : ''}</span>
      <span class="small muted">${[sh.delivery && 'Доставка', sh.pickup && 'Самовывоз'].filter(Boolean).join(' и ')} · ${esc(sh.address)}</span>
      ${sh.about ? `<span style="font-size:14px">${esc(sh.about)}</span>` : ''}</div></section>
    ${vis.length ? cats.map(c => `<section class="col" style="gap:10px"><h2>${esc(c)}</h2><div class="cards">${vis.filter(p => p.cat === c).map(card).join('')}</div></section>`).join('')
      : '<div class="empty panel"><b>Витрина пустая</b><span>Покупатели видят только товары, которые есть в наличии и не скрыты.</span></div>'}`;
}

// ================= Магазин =================
function vShop() {
  const sh = S.shop;
  const logo = sh.logo ? `<img src="${sh.logo}" alt="">` : esc((sh.name || '?').charAt(0).toUpperCase());
  return `
    <div class="head"><div><div class="eyebrow">Настройки</div><h1>Магазин</h1></div></div>
    <form class="panel col" id="shopEdit" novalidate style="gap:14px">
      <h2>Профиль</h2>
      <div class="store-hero"><div class="store-logo">${logo}</div><div class="col" style="gap:6px">
        <label class="btn" for="logoFile">Загрузить логотип</label><input type="file" id="logoFile" accept="image/*" hidden>
        <span class="small muted">Квадратная картинка, JPG или PNG</span></div></div>
      ${shopFields(sh)}
      <div><button class="btn primary" type="submit">Сохранить профиль</button></div>
    </form>
    <form class="panel col" id="opsForm" novalidate style="gap:14px">
      <h2>Работа с заказами</h2>
      <div class="grid3">
        <div class="field"><label for="o_min">Минимальный заказ</label><div class="suffix"><input class="input num" id="o_min" name="minOrder" inputmode="decimal" value="${sh.minOrder || ''}" placeholder="0"><span>${CUR}</span></div></div>
        <div class="field"><label for="o_prep">Обычное время сборки</label><div class="suffix"><input class="input num" id="o_prep" name="prep" inputmode="numeric" value="${sh.prep}"><span>мин</span></div></div>
      </div>
      <div class="row" style="gap:20px"><label class="check"><input type="checkbox" name="delivery" ${sh.delivery ? 'checked' : ''}> Доставка курьером</label><label class="check"><input type="checkbox" name="pickup" ${sh.pickup ? 'checked' : ''}> Самовывоз из магазина</label></div>
      <span class="lbl">График работы</span>
      <div class="sched">${sh.schedule.map((d, i) => `<span>${DAYS[i]}</span><label class="check"><input type="checkbox" name="open${i}" ${d.open ? 'checked' : ''}> Открыто</label><input class="input t" type="time" name="from${i}" value="${d.from}" aria-label="${DAYS[i]}, с"><input class="input t" type="time" name="to${i}" value="${d.to}" aria-label="${DAYS[i]}, до">`).join('')}</div>
      <div><button class="btn primary" type="submit">Сохранить</button></div>
    </form>
    <form class="panel col" id="payForm" novalidate style="gap:14px">
      <h2>Выплаты</h2>
      <span class="small muted">Куда переводить деньги за заказы, оплаченные онлайн. Выплаты раз в неделю, за вычетом комиссии сервиса.</span>
      <div class="grid2">
        <div class="field"><label for="pay_m">Способ</label><select class="input" id="pay_m" name="method">${PAYOUT.map(x => `<option ${x === sh.payout.method ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label for="pay_a">Номер карты, кошелька или счёта</label><input class="input num" id="pay_a" name="account" value="${esc(sh.payout.account)}" inputmode="numeric" autocomplete="off"></div>
        <div class="field"><label for="pay_h">Получатель (ФИО или ИП)</label><input class="input" id="pay_h" name="holder" value="${esc(sh.payout.holder)}"></div>
        <div class="field"><label for="pay_t">ИНН</label><input class="input num" id="pay_t" name="tin" value="${esc(sh.tin)}" inputmode="numeric"></div>
      </div>
      <div><button class="btn primary" type="submit">Сохранить</button></div>
    </form>
    <section class="panel col">
      <h2>Категории товаров</h2>
      <div class="chips wrap">${S.cats.map(c => `<span class="chip">${esc(c)} <button class="btn ghost" style="padding:0 0 0 6px;min-height:0" data-delcat="${esc(c)}" aria-label="Удалить ${esc(c)}">×</button></span>`).join('')}</div>
      <form id="catForm" class="row"><input class="input" id="newCat" placeholder="Новая категория" style="flex:1 1 200px;width:auto" maxlength="30"><button class="btn" type="submit">Добавить</button></form>
    </section>
    <section class="panel col">
      <h2>Данные</h2>
      <span class="small muted">Сейчас всё хранится в этом браузере. После подключения сервера товары и заказы будут в общей базе, и войти можно будет с любого телефона.</span>
      <div><button class="btn danger" data-act="wipe">Удалить магазин и все данные</button></div>
    </section>`;
}
function vMore() {
  const item = (k, t, s) => `<button data-nav="${k}">${ICON[k]}<span>${t}<small>${s}</small></span></button>`;
  return `<div class="head"><h1>Ещё</h1></div>
    <div class="panel tight morelist">${item('expenses', 'Расходы', 'Аренда, зарплата и другие траты')}${item('preview', 'Витрина', 'Как покупатели видят магазин')}${item('shop', 'Магазин', 'Профиль, график, выплаты, категории')}
    <button data-act="import">${ICON.import}<span>Загрузить товары из Excel<small>Сразу весь список</small></span></button></div>`;
}

// ================= боковая панель =================
function openSheet(title, body, foot, keepScroll) {
  const sheet = $('#sheet'), prev = keepScroll ? sheet.querySelector('.sheet-body')?.scrollTop : 0;
  sheet.innerHTML = `<div class="sheet-head"><h2 id="sheetTitle">${esc(title)}</h2><button class="btn ghost" data-act="close" aria-label="Закрыть">✕</button></div><div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
  sheet.hidden = false; $('#sheetBg').hidden = false;
  if (prev) sheet.querySelector('.sheet-body').scrollTop = prev;
}
function closeSheet() { $('#sheet').hidden = true; $('#sheetBg').hidden = true; editing = null; cart = null; }

// ================= события =================
let armed = null;
function confirmTwice(t, label) {
  if (armed === t) { armed = null; return true; }
  if (armed) { armed.classList.remove('armed'); armed.textContent = armed.dataset.label; }
  armed = t; t.dataset.label = t.textContent; t.textContent = label; t.classList.add('armed');
  setTimeout(() => { if (armed === t) { t.classList.remove('armed'); t.textContent = t.dataset.label; armed = null; } }, 3500);
  return false;
}
document.addEventListener('click', async e => {
  if (e.target.id === 'sheetBg') return closeSheet();
  const t = e.target.closest('button,[data-nav]'); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.nav) return go(ds.nav);
  if (ds.edit) return openProduct(ds.edit);
  if (ds.cat) { ui.cat = ds.cat; return render(); }
  if (ds.otab) { ui.ordTab = ds.otab; return render(); }
  if (ds.period) { ui.period = ds.period; ui.pickDay = null; return render(); }
  if (ds.day) { ui.pickDay = ui.pickDay === ds.day ? null : ds.day; return render(); }
  if (ds.oact) return orderAction(ds.oact, ds.id);
  if (ds.accmin) { const o = S.orders.find(x => x.id === ds.id); o.status = 'accepted'; o.readyIn = +ds.accmin; o.acceptedAt = Date.now(); save(); closeSheet(); ui.ordTab = 'work'; render(); return toast(`Заказ № ${o.no} принят, будет готов через ${ds.accmin} мин`); }
  if (ds.stock) { const p = S.products.find(x => x.id === ds.stock); p.stock = Math.max(0, p.stock + +ds.d); save(); return render(); }
  if (ds.cart) { cart.items[ds.cart] = Math.max(0, (cart.items[ds.cart] || 0) + +ds.d); return drawSale(); }
  if (ds.delexp) { if (confirmTwice(t, 'Точно?')) { S.expenses = S.expenses.filter(x => x.id !== ds.delexp); save(); render(); } return; }
  if (ds.delcat) { const n = S.products.filter(p => p.cat === ds.delcat).length; if (n) return toast(`Нельзя удалить: в категории ${n} тов.`); S.cats = S.cats.filter(x => x !== ds.delcat); save(); return render(); }
  if (ds.rmph) { syncDraft(); editing.draft.imgs.splice(+ds.rmph, 1); return drawProduct(); }
  if (ds.mainph) { syncDraft(); const im = editing.draft.imgs; im.unshift(im.splice(+ds.mainph, 1)[0]); return drawProduct(); }
  if (ds.rmvar) { t.closest('.variant').remove(); return; }
  switch (ds.act) {
    case 'demo': S = demo(); save(); return go('home');
    case 'reset': if (confirmTwice(t, 'Нажмите ещё раз — пример удалится')) { store.fresh(); S = null; render(); } return;
    case 'wipe': if (confirmTwice(t, 'Точно удалить всё? Нажмите ещё раз')) { store.fresh(); S = null; render(); } return;
    case 'add': return openProduct(null);
    case 'dup': { syncDraft(); const src = editing.draft; closeSheet(); openProduct(null, src); return toast('Это копия. Измените и сохраните'); }
    case 'close': return closeSheet();
    case 'saveP': return saveProduct();
    case 'addvar': { const box = $('#variants'); box.insertAdjacentHTML('beforeend', variantRow({ id: uid(), name: '', price: null, cost: null })); box.lastElementChild.querySelector('.vn').focus(); return; }
    case 'delete': if (confirmTwice(t, 'Нажмите ещё раз для удаления')) { S.products = S.products.filter(p => p.id !== editing.draft.id); save(); closeSheet(); render(); toast('Товар удалён'); } return;
    case 'sale': return sheetSale();
    case 'savesale': return saveSale();
    case 'testorder': return testOrder();
    case 'docancel': { const o = S.orders.find(x => x.id === ds.id); o.status = 'cancelled'; o.cancelReason = document.querySelector('input[name="reason"]:checked')?.value || ''; changeStockForOrder(o, 1); save(); closeSheet(); render(); return toast(`Заказ № ${o.no} отменён`); }
    case 'pause': S.shop.paused = false; save(); render(); return toast('Снова принимаем заказы');
    case 'import': return sheetImport();
    case 'doimport': return doImport();
    case 'export': return copyText([['Название', 'Цена', 'Закупка', 'Остаток', 'Категория'].join('\t'), ...S.products.map(p => [p.name, p.price, p.cost ?? '', p.stock, p.cat].join('\t'))].join('\n'), 'Список товаров скопирован. Вставьте его в Excel');
    case 'exportstats': return exportStats();
    case 'addexp': return sheetExpense();
    case 'saveexp': return saveExpense();
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; render(); }
  if (id === 'p_price' || id === 'p_cost' || id === 'p_old') updateMargin();
  if (id === 'impText') previewImport();
});
document.addEventListener('change', async e => {
  const t = e.target, id = t.id;
  if (id === 'stockFilter') { ui.stock = t.value; render(); }
  if (id === 'p_cat') { const n = $('#p_newcat'); n.hidden = t.value !== '__new'; if (!n.hidden) n.focus(); }
  if (id === 'pFile' && t.files.length) {
    syncDraft();
    const room = 4 - editing.draft.imgs.length, files = [...t.files].slice(0, room);
    try { for (const f of files) editing.draft.imgs.push(await readImage(f, 900)); } catch (err) { toast(err.message); }
    if (t.files.length > room) toast('Можно не больше 4 фото');
    drawProduct();
  }
  if (id === 'logoFile' && t.files[0]) { try { S.shop.logo = await readImage(t.files[0], 400); save(); render(); toast('Логотип обновлён'); } catch (err) { toast(err.message); } }
  if (id === 'pauseSw') { S.shop.paused = !t.checked; save(); render(); toast(S.shop.paused ? 'Приём заказов на паузе' : 'Снова принимаем заказы'); }
  if (id === 'fromD') { ui.from = t.value; render(); }
  if (id === 'toD') { ui.to = t.value; render(); }
  if (id === 'saleDate') cart.date = t.value || today();
  if (id === 'salePay') cart.pay = t.value;
  if (id === 'expMonth') { ui.expMonth = t.value; render(); }
  if (id === 'e_cat') $('#stockPurchWrap').hidden = t.value !== 'Закупка товара';
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, id = f.id;
  if (id === 'shopForm') { const d = validateShop(f); if (!d) return; S = { v: 2, demo: false, shop: blankShop(d), cats: ['Основное'], products: [], orders: [], expenses: [], nextNo: 1001 }; save(); go('catalog'); toast('Магазин создан. Добавьте первый товар'); }
  if (id === 'shopEdit') { const d = validateShop(f); if (!d) return; Object.assign(S.shop, d); save(); render(); toast('Профиль сохранён'); }
  if (id === 'opsForm') {
    const fd = new FormData(f), prep = num(fd.get('prep')), min = fd.get('minOrder').trim() === '' ? 0 : num(fd.get('minOrder'));
    if (!showErrors(f, { ...(prep == null || prep <= 0 ? { prep: 'Больше нуля' } : {}), ...(min == null || min < 0 ? { minOrder: 'Число от нуля' } : {}) })) return;
    if (!fd.get('delivery') && !fd.get('pickup')) return toast('Оставьте хотя бы доставку или самовывоз');
    Object.assign(S.shop, { prep: Math.round(prep), minOrder: min, delivery: !!fd.get('delivery'), pickup: !!fd.get('pickup'), schedule: DAYS.map((_, i) => ({ open: !!fd.get('open' + i), from: fd.get('from' + i) || '09:00', to: fd.get('to' + i) || '21:00' })) });
    save(); render(); toast('Настройки сохранены');
  }
  if (id === 'payForm') { const fd = new FormData(f); S.shop.payout = { method: fd.get('method'), account: fd.get('account').trim(), holder: fd.get('holder').trim() }; S.shop.tin = fd.get('tin').trim(); save(); render(); toast('Реквизиты сохранены'); }
  if (id === 'catForm') { const v = $('#newCat').value.trim(); if (!v) return; if (S.cats.includes(v)) return toast('Такая категория уже есть'); S.cats.push(v); save(); render(); }
  if (id === 'pForm') saveProduct();
  if (id === 'expForm') saveExpense();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
// обновляем «ждёт N мин» у новых заказов
setInterval(() => { if (S && (view === 'orders' || view === 'home') && $('#sheet').hidden && newCount()) render(); }, 60000);

render();
})();
</script>
