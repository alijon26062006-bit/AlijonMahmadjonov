<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; content column max 960px */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #13201d;
  --muted: #5d6e69;
  --line: #dde5e2;
  --accent: #0e6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --warn: #b25e09;
  --warn-soft: #fbecd9;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(19,32,29,.06), 0 6px 20px rgba(19,32,29,.06);
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --ink: #e6efec; --muted: #94a7a1; --line: #263431;
    --accent: #3fb59d; --accent-ink: #06201a; --accent-soft: #173a33;
    --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f2867e; --bad-soft: #3d1d1b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --ink: #e6efec; --muted: #94a7a1; --line: #263431;
  --accent: #3fb59d; --accent-ink: #06201a; --accent-soft: #173a33;
  --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f2867e; --bad-soft: #3d1d1b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; padding: 20px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 4px 10px 18px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 0; background: none; text-align: left; color: var(--muted); font-weight: 500; }
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-btn:hover { background: var(--bg); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail-foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 10px; }

.main { min-width: 0; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 4vw, 28px); margin: 2px 0 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; font-weight: 600; }

.tabs { display: none; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--bad); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.invalid { border-color: var(--bad); }
textarea.input { min-height: 84px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.suffix { position: relative; }
.suffix .input { padding-right: 52px; }
.suffix span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi b { font-family: var(--f-display); font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi.warn b { color: var(--warn); }

/* toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 220px; position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; }
.search .input { padding-left: 38px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* product list */
.plist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.prow:first-child { border-top: 0; }
.prow:hover { background: var(--bg); }
.thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; font-size: 26px; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.price { font-weight: 600; text-align: right; }
.price small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.off { background: var(--bg); color: var(--muted); }
.stockcol { min-width: 92px; text-align: right; }

.empty { text-align: center; padding: 44px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty b { color: var(--ink); font-size: 16px; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,16,14,.45); z-index: 40; }
.sheet { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sheet-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.photo { display: flex; gap: 14px; align-items: center; }
.photo .thumb { width: 96px; height: 96px; border-radius: 14px; font-size: 40px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.switch input { width: 44px; height: 26px; accent-color: var(--accent); }
.margin { font-size: 13px; color: var(--muted); }
.margin b { color: var(--accent); }
.margin b.neg { color: var(--bad); }

/* storefront preview */
.store-hero { display: flex; gap: 16px; align-items: center; }
.store-logo { width: 72px; height: 72px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 28px; overflow: hidden; flex: none; }
.store-logo img { width: 100%; height: 100%; object-fit: cover; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.card .pic { aspect-ratio: 1; background: var(--accent-soft); display: grid; place-items: center; font-size: 56px; max-width: 100%; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card .t { font-weight: 600; font-size: 14px; }
.card .d { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; }
.card .add { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 20px; line-height: 1; }

.checklist { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.dot.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.split { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px 16px; font-size: 14px; }

/* welcome */
.welcome { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.welcome-card { max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
.welcome-card h1 { font-size: clamp(26px, 6vw, 36px); }
.welcome-card p { color: var(--muted); margin: 0; max-width: 60ch; }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: center; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-top: 16px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabs .nav-btn { flex-direction: column; gap: 3px; font-size: 11.5px; padding: 6px 2px; justify-content: center; align-items: center; text-align: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .prow { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; padding: 12px; }
  .thumb { width: 48px; height: 48px; font-size: 22px; }
  .stockcol { display: none; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 420px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(30px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div id="app"></div>

<script>
(() => {
'use strict';

// ---------- storage (сейчас — в браузере; позже заменим на сервер) ----------
const KEY = 'seller-panel-v1';
const store = {
  load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch { return false; } },
  clear() { try { localStorage.setItem(KEY, '"fresh"'); } catch {} },
};

const SHOP_TYPES = ['Цветы', 'Ресторан, кафе', 'Продукты', 'Одежда и обувь', 'Электроника', 'Аптека', 'Другое'];
const UNITS = ['шт', 'букет', 'кг', 'г', 'л', 'порция', 'упак'];
const CUR = 'смн';
const LOW = 5;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ' + CUR;
const numOrNull = v => { const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return Number.isFinite(n) ? n : null; };

function demo() {
  const p = (name, cat, price, cost, stock, unit, emoji, desc) => ({ id: uid(), name, cat, price, cost, stock, unit, emoji, desc, img: '', active: true, created: Date.now() });
  return {
    demo: true,
    shop: { name: 'Гулистон', type: 'Цветы', phone: '+992 90 123 45 67', address: 'Душанбе, пр. Рудаки 45', hours: '08:00–21:00', about: 'Свежие цветы каждый день, сборка букета за 30 минут.', logo: '' },
    cats: ['Розы', 'Букеты', 'Тюльпаны', 'В горшках', 'Подарки'],
    products: [
      p('Роза красная, 60 см', 'Розы', 15, 8, 120, 'шт', '🌹', 'Эквадорская роза, стойкость до 10 дней.'),
      p('Букет «Нежность», 15 роз', 'Букеты', 290, 160, 6, 'букет', '💐', 'Розовые розы и эвкалипт в крафтовой упаковке.'),
      p('Букет «Весна»', 'Букеты', 220, 115, 4, 'букет', '💐', 'Тюльпаны, хризантемы и зелень.'),
      p('Тюльпаны микс, 25 шт', 'Тюльпаны', 250, 140, 9, 'букет', '🌷', 'Голландские тюльпаны пяти цветов.'),
      p('Тюльпан белый', 'Тюльпаны', 9, 5, 0, 'шт', '🌷', 'Поштучно, можно собрать свой букет.'),
      p('Орхидея фаленопсис', 'В горшках', 180, 105, 3, 'шт', '🪴', 'Две ветки, в керамическом кашпо.'),
      p('Корзина «Праздник», 51 роза', 'Букеты', 790, 470, 2, 'шт', '🧺', 'Большая корзина из красных и белых роз.'),
      p('Открытка с вашим текстом', 'Подарки', 10, 3, 200, 'шт', '💌', 'Подпишем от руки.'),
      p('Мягкий мишка, 30 см', 'Подарки', 85, 50, 11, 'шт', '🧸', ''),
    ],
  };
}

let S = store.load();
if (S === 'fresh') S = null; else if (!S) S = demo(); // первый запуск — пример магазина
const save = () => { if (S && !store.save(S)) toast('Не удалось сохранить: хранилище браузера недоступно'); };

let view = 'catalog';
let filter = { q: '', cat: 'Все', stock: 'all' };

// ---------- helpers ----------
const $ = sel => document.querySelector(sel);
const app = $('#app');
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}
const thumb = (p, cls = 'thumb') => `<div class="${cls}">${p.img ? `<img src="${p.img}" alt="">` : esc(p.emoji || '📦')}</div>`;
function stockPill(p) {
  if (!p.active) return '<span class="pill off">Скрыт</span>';
  if (p.stock <= 0) return '<span class="pill bad">Нет в наличии</span>';
  if (p.stock <= LOW) return `<span class="pill warn">Осталось ${p.stock}</span>`;
  return `<span class="pill">В наличии ${p.stock}</span>`;
}

const ICONS = {
  catalog: '<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>',
  summary: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>',
  preview: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  shop: '<svg viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10h18M9 20v-6h6v6"/></svg>',
};
const NAV = [['catalog', 'Товары'], ['summary', 'Сводка'], ['preview', 'Витрина'], ['shop', 'Магазин']];

// ---------- render ----------
function render() {
  if (!S) return renderWelcome();
  const navBtns = NAV.map(([k, label]) => `<button class="nav-btn" data-nav="${k}" ${view === k ? 'aria-current="page"' : ''}>${ICONS[k]}<span>${label}</span></button>`).join('');
  app.innerHTML = `
  <div class="shell">
    <nav class="rail" aria-label="Разделы">
      <div class="brand">Кабинет<span>.</span>продавца</div>
      ${navBtns}
      <div class="rail-foot">${esc(S.shop.name)} · ${esc(S.shop.type)}</div>
    </nav>
    <main class="main"><div class="wrap" id="page"></div></main>
    <nav class="tabs" aria-label="Разделы">${navBtns}</nav>
  </div>`;
  const page = $('#page');
  const banner = S.demo ? `<div class="banner"><span>Это <b>пример магазина</b>, чтобы посмотреть, как всё работает. Удалите его и заведите свой.</span><button class="btn" data-act="reset">Начать со своего магазина</button></div>` : '';
  page.innerHTML = banner + ({ catalog: viewCatalog, summary: viewSummary, preview: viewPreview, shop: viewShop }[view])();
  if (view === 'catalog') { const q = $('#q'); if (q && filter.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

function renderWelcome() {
  app.innerHTML = `

function validateShop(form) {
  const data = Object.fromEntries(new FormData(form));
  form.querySelectorAll('.err').forEach(e => e.remove());
  form.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
  const errs = {};
  if (!data.name.trim()) errs.name = 'Введите название';
  if (!data.type) errs.type = 'Выберите, что продаёте';
  if (data.phone.replace(/\D/g, '').length < 9) errs.phone = 'Введите номер полностью';
  if (!data.address.trim()) errs.address = 'Нужен адрес для курьера';
  for (const [k, m] of Object.entries(errs)) {
    const el = form.querySelector(`[name="${k}"]`); el.classList.add('invalid');
    el.insertAdjacentHTML('afterend', `<span class="err">${m}</span>`);
  }
  if (Object.keys(errs).length) { form.querySelector('.invalid').focus(); return null; }
  for (const k in data) data[k] = data[k].trim();
  return data;
}

function viewSummary() {

  const low = act.filter(p => p.stock > 0 && p.stock <= LOW), out = act.filter(p => p.stock <= 0);
  const withPhoto = ps.filter(p => p.img).length, withCost = ps.filter(p => p.cost != null).length;
  const checks = [
    [!!(S.shop.name && S.shop.phone && S.shop.address), 'Магазин заполнен: название, телефон, адрес'],
    [!!S.shop.logo, 'Загружен логотип'],

  ];

  const byCat = S.cats.map(c => [c, ps.filter(p => p.cat === c).length]).filter(x => x[1]);

function updateMargin() {
  const el = $('#marginLine'); if (!el) return;
  const pr = numOrNull($('#p_price').value), co = numOrNull($('#p_cost').value);
  if (pr == null || co == null || pr <= 0) { el.innerHTML = 'Укажите закупочную цену, и мы посчитаем прибыль с каждой продажи.'; return; }
  const m = pr - co, pct = Math.round(m / pr * 100);
  el.innerHTML = `Прибыль с одной продажи: <b class="num ${m < 0 ? 'neg' : ''}">${money(m)}</b> (${pct}% от цены)`;
}
function saveProduct() {
  const f = $('#pForm');
  f.querySelectorAll('.err').forEach(e => e.remove()); f.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
  const fd = Object.fromEntries(new FormData(f));
  const errs = [];
  const bad = (name, msg) => { const el = f.querySelector(`[name="${name}"]`); el.classList.add('invalid'); (el.closest('.suffix') || el).insertAdjacentHTML('afterend', `<span class="err">${msg}</span>`); errs.push(el); };
  const price = numOrNull(fd.price), cost = fd.cost.trim() === '' ? null : numOrNull(fd.cost), stock = numOrNull(fd.stock);
  if (!fd.name.trim()) bad('name', 'Введите название');
  if (price == null || price <= 0) bad('price', 'Укажите цену больше нуля');
  if (fd.cost.trim() !== '' && (cost == null || cost < 0)) bad('cost', 'Число от нуля');
  if (stock == null || stock < 0 || !Number.isInteger(stock)) bad('stock', 'Целое число от 0');
  let cat = fd.cat;
  if (cat === '__new') { cat = (fd.newcat || '').trim(); if (!cat) bad('newcat', 'Введите категорию'); }
  if (errs.length) { errs[0].focus(); return; }
  if (!S.cats.includes(cat)) S.cats.push(cat);
  Object.assign(editing.draft, { name: fd.name.trim(), cat, price, cost, stock, unit: fd.unit, desc: fd.desc.trim(), active: !!fd.active });
  if (editing.isNew) S.products.push(editing.draft); else S.products[S.products.findIndex(p => p.id === editing.draft.id)] = editing.draft;
  const wasNew = editing.isNew;
  save(); closeSheet(); render();
  toast(wasNew ? 'Товар добавлен' : 'Изменения сохранены');
}

// фото: уменьшаем до 800px, чтобы не раздувать хранилище
function readImage(file, size) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Это не картинка'));
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, size / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82));
    }; img.onerror = () => rej(new Error('Не удалось открыть картинку')); img.src = r.result; };
    r.onerror = () => rej(new Error('Не удалось прочитать файл')); r.readAsDataURL(file);
  });
}

// ---------- events ----------
let armed = null;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-act],[data-edit],[data-cat],[data-delcat]');
  if (!t) { if (e.target.id === 'sheetBg') closeSheet(); return; }
  if (t.dataset.nav) { view = t.dataset.nav; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.edit) return openProduct(t.dataset.edit);
  if (t.dataset.cat) { filter.cat = t.dataset.cat; render(); return; }
  if (t.dataset.delcat) {
    const c = t.dataset.delcat, n = S.products.filter(p => p.cat === c).length;
    if (n) return toast(`Нельзя удалить: в категории ${n} тов.`);
    S.cats = S.cats.filter(x => x !== c); save(); render(); return;
  }
  const act = t.dataset.act;
  // двойное нажатие вместо confirm()
  const confirmTwice = (label) => {
    if (armed === t) return true;
    if (armed) { armed.classList.remove('armed'); armed.textContent = armed.dataset.label; }
    armed = t; t.dataset.label = t.textContent; t.textContent = label; t.classList.add('armed');
    setTimeout(() => { if (armed === t) { t.classList.remove('armed'); t.textContent = t.dataset.label; armed = null; } }, 3500);
    return false;
  };
  if (act === 'demo') { S = demo(); save(); view = 'catalog'; render(); }
  else if (act === 'reset') { if (confirmTwice('Нажмите ещё раз, пример удалится')) { store.clear(); S = null; armed = null; render(); } }
  else if (act === 'wipe') { if (confirmTwice('Точно удалить всё? Нажмите ещё раз')) { store.clear(); S = null; armed = null; render(); } }
  else if (act === 'add') openProduct(null);
  else if (act === 'close') closeSheet();
  else if (act === 'saveP') saveProduct();
  else if (act === 'rmphoto') { editing.draft.img = ''; refreshPhoto(); }
  else if (act === 'delete') {
    if (confirmTwice('Нажмите ещё раз для удаления')) { S.products = S.products.filter(p => p.id !== editing.draft.id); armed = null; save(); closeSheet(); render(); toast('Товар удалён'); }
  }
});
function refreshPhoto() {
  const d = editing.draft, box = document.querySelector('#pForm .photo');
  box.innerHTML = `${thumb(d)}<div style="display:flex;flex-direction:column;gap:6px"><label class="btn" for="pFile">${d.img ? 'Заменить фото' : 'Добавить фото'}</label><input type="file" id="pFile" accept="image/*" hidden>${d.img ? '<button type="button" class="btn ghost" data-act="rmphoto">Убрать фото</button>' : ''}</div>`;
}
document.addEventListener('input', e => {
  if (e.target.id === 'q') { filter.q = e.target.value; render(); }
  if (e.target.id === 'p_price' || e.target.id === 'p_cost') updateMargin();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'stockFilter') { filter.stock = t.value; render(); }
  if (t.id === 'p_cat') { const n = $('#p_newcat'); n.hidden = t.value !== '__new'; if (!n.hidden) n.focus(); }
  if (t.id === 'pFile' && t.files[0]) { try { editing.draft.img = await readImage(t.files[0], 800); refreshPhoto(); } catch (err) { toast(err.message); } }
  if (t.id === 'logoFile' && t.files[0]) { try { S.shop.logo = await readImage(t.files[0], 400); save(); render(); toast('Логотип обновлён'); } catch (err) { toast(err.message); } }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'shopForm') { const d = validateShop(f); if (!d) return; S = { demo: false, shop: { ...d, logo: '' }, cats: ['Основное'], products: [] }; save(); view = 'catalog'; render(); toast('Магазин создан. Добавьте первый товар'); }
  if (f.id === 'shopEdit') { const d = validateShop(f); if (!d) return; Object.assign(S.shop, d); save(); render(); toast('Сохранено'); }
  if (f.id === 'catForm') { const v = $('#newCat').value.trim(); if (!v) return; if (S.cats.includes(v)) return toast('Такая категория уже есть'); S.cats.push(v); save(); render(); }
  if (f.id === 'pForm') saveProduct();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

render();
})();
</script>
