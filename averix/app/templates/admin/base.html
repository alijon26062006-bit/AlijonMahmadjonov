<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Админка{% endblock %} · AVERIX</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --void:#0A090F; --panel:#12111C; --panel-hi:#181724;
  --line:rgba(255,255,255,.09); --line-hi:rgba(255,255,255,.18);
  --violet:#B98CF2; --emerald:#3FD98A; --danger:#FF9A93;
  --text:#EDEBF5; --muted:#B4AECA; --faint:#948DA8;
  --body:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --t:160ms cubic-bezier(.22,.7,.28,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--violet)}
h1,h2{margin:0;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--emerald);outline-offset:3px;border-radius:6px}

.mark{width:22px;height:22px;flex:none}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);min-height:44px}
.brand b{font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
.brand b span{color:var(--violet)}

/* вход */
.center{min-height:100dvh;display:grid;place-items:center;padding:1.5rem}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:2rem 1.5rem}
@media(min-width:480px){.card{padding:2.25rem}}
.card h1{font-size:1.35rem;margin:1.25rem 0 .35rem}
.card .sub{color:var(--faint);font-size:.9rem;margin:0 0 1.5rem}

/* панель */
.top{position:sticky;top:0;z-index:10;background:rgba(10,9,15,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:0 1.25rem;display:flex;
  align-items:center;gap:1rem;min-height:64px}
/* Разделов девять — на планшете они уже не помещались и растягивали
   страницу до 1246px. Полоса прокручивается сама, страница остаётся
   по ширине окна; min-width:0 нужен, иначе flex её не сожмёт. */
.top nav{display:flex;gap:.25rem;margin-left:auto;min-width:0;
  overflow-x:auto;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{display:inline-flex;flex:0 0 auto;align-items:center;min-height:44px;padding:0 .9rem;
  border-radius:9px;font-size:.9rem;color:var(--muted);text-decoration:none;transition:all var(--t)}
.top nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.top nav a[aria-current]{color:var(--text);background:rgba(255,255,255,.07)}
.wrap{max-width:1100px;margin:0 auto;padding:2.5rem 1.25rem 4rem}

/* На узком экране шапка переносится в две строки: сверху логотип
   и выход, снизу навигация. Иначе она не помещается и тянет
   горизонтальную прокрутку на всю страницу. */
@media(max-width:700px){
  .top-in{flex-wrap:wrap;padding:.4rem 1rem;gap:.5rem;min-height:0}
  .brand{margin-right:auto}
  .top nav{order:3;width:100%;margin-left:0;gap:.15rem;
    border-top:1px solid var(--line);padding-top:.15rem}
  /* Разделов много: полоса прокручивается сама, а страница — нет.
     Раньше ссылки растягивали её до 827px на любом телефоне. */
  .top nav{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .top nav::-webkit-scrollbar{display:none}
  .top nav a{flex:0 0 auto;padding:0 .7rem;font-size:.85rem}
  .wrap{padding:1.75rem 1rem 3rem}
}

/* формы */
label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:.4rem}
/* Перечень типов, а не просто input: голый селектор задел бы и чекбоксы
   с радиокнопками. Каждый новый тип нужно добавлять сюда — забытый
   type=search отрисовался высотой 21 пиксель вместо 48. */
input[type=text],input[type=password],input[type=email],input[type=url],
input[type=date],input[type=number],input[type=tel],input[type=search]{
  width:100%;min-height:48px;padding:.7rem .9rem;
  background:var(--void);color:var(--text);border:1px solid var(--line-hi);
  border-radius:10px;font-family:var(--body);font-size:16px;transition:border-color var(--t)}
input:focus{border-color:var(--violet);outline-offset:1px}
.field{margin-bottom:1.1rem}
button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:48px;padding:.7rem 1.4rem;border:0;border-radius:999px;cursor:pointer;
  background:var(--violet);color:#0A0713;font-family:var(--body);font-size:.95rem;
  font-weight:600;transition:transform 140ms cubic-bezier(.34,1.4,.5,1),background var(--t)}
button:hover{background:#C9A5F5}
button:active{transform:scale(.96)}
button.block{width:100%}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line-hi)}
button.ghost:hover{background:rgba(255,255,255,.05)}

.alert{padding:.8rem 1rem;border-radius:10px;font-size:.9rem;margin-bottom:1.25rem;
  border-left:3px solid var(--danger);background:rgba(255,154,147,.1);color:var(--text)}

/* карточки со счётчиками */
.stats{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats div{background:var(--panel);padding:1.15rem 1.25rem}
.stats b{display:block;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:.45rem;font-size:.82rem;color:var(--faint)}

.empty{margin-top:2rem;padding:2.5rem 1.5rem;text-align:center;border:1px dashed var(--line-hi);
  border-radius:var(--r);color:var(--muted)}
.empty p{margin:0;max-width:44ch;margin-inline:auto;font-size:.94rem}
h2{font-size:1.1rem;margin:2.5rem 0 1rem}
.mono{font-family:var(--mono);font-size:.85rem;color:var(--faint)}

/* список проектов */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-bottom:1.5rem}
.bar h1{font-size:1.5rem;margin-right:auto}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{background:var(--panel);padding:1rem 1.15rem;display:grid;gap:.75rem;align-items:center}
@media(min-width:760px){.row{grid-template-columns:64px 1fr auto}}
.row:hover{background:var(--panel-hi)}
.thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;
  background:var(--void);border:1px solid var(--line)}
.thumb.none{display:grid;place-items:center;font-size:.65rem;color:var(--faint);
  font-family:var(--mono)}
.row .name a{display:inline-flex;align-items:center;min-height:44px;
  font-weight:600;font-size:.98rem;color:inherit;text-decoration:none}
.row .name a:hover{color:var(--violet)}
.row .meta{margin-top:.3rem;font-family:var(--mono);font-size:.76rem;color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.acts form{display:inline}
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;
  border-radius:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em}
.badge.pub{background:rgba(63,217,138,.14);color:var(--emerald)}
.badge.draft{background:rgba(255,255,255,.07);color:var(--faint)}
.badge.star{background:rgba(185,140,242,.16);color:var(--violet)}
.mini{min-height:44px;padding:.3rem .85rem;font-size:.8rem;border-radius:8px;
  background:transparent;color:var(--muted);border:1px solid var(--line-hi)}
.mini:hover{background:rgba(255,255,255,.06);color:var(--text)}
.mini.danger{color:var(--danger);border-color:rgba(255,154,147,.35)}
.mini.danger:hover{background:rgba(255,154,147,.12)}

/* форма проекта */
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;
  margin:0 0 1.25rem;background:var(--panel)}
legend{padding:0 .5rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--violet)}
.grid2{display:grid;gap:1rem}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
textarea{width:100%;min-height:100px;padding:.7rem .9rem;background:var(--void);
  color:var(--text);border:1px solid var(--line-hi);border-radius:10px;
  font-family:var(--body);font-size:16px;line-height:1.55;resize:vertical}
textarea:focus{border-color:var(--violet)}
select{width:100%;min-height:48px;padding:.6rem .9rem;background:var(--void);
  color:var(--text);border:1px solid var(--line-hi);border-radius:10px;
  font-family:var(--body);font-size:16px}
.hint{margin-top:.35rem;font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.check{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer}
/* Галочка системного размера, но нажимается весь label высотой 44px —
   это и есть область попадания, увеличивать саму галочку не нужно */
.check input{width:20px;height:20px;accent-color:var(--violet);cursor:pointer;flex:none}
.check span{font-size:.94rem;color:var(--text)}
.sticky{position:sticky;bottom:0;background:rgba(10,9,15,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:1rem 0;margin-top:2rem;display:flex;
  gap:.75rem;flex-wrap:wrap;align-items:center}

/* картинки */
.shots{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--void)}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.shot.is-cover{border-color:var(--violet)}
.shot-b{padding:.5rem;display:flex;gap:.4rem;align-items:center;justify-content:space-between}
.shot-b .tag{font-family:var(--mono);font-size:.66rem;color:var(--violet)}
.drop{border:1px dashed var(--line-hi);border-radius:10px;padding:1.25rem;
  display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
/* сам выбор файла системный и мелкий — растягиваем область нажатия */
.drop input[type=file]{flex:1;min-width:200px;min-height:44px;padding:.6rem 0;
  color:var(--muted);font-size:.9rem;cursor:pointer}
.drop input[type=file]::file-selector-button{min-height:36px;padding:.4rem .9rem;
  margin-right:.75rem;background:rgba(255,255,255,.07);color:var(--text);
  border:1px solid var(--line-hi);border-radius:8px;cursor:pointer;
  font-family:var(--body);font-size:.85rem}

/* страницы ошибок */
.err-code{font-family:var(--mono);font-size:.8rem;letter-spacing:.16em;
  color:var(--violet);margin-bottom:.75rem}
.err-card h1{font-size:1.5rem;margin-bottom:.6rem}
.err-card p{color:var(--muted);font-size:.95rem;margin-bottom:1.5rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* заявки и отклики */
.alert.ok{border-left-color:var(--emerald);background:rgba(63,217,138,.1)}
.lead{max-width:none;display:flex;flex-direction:column;gap:.9rem;padding:1.15rem;
  border-radius:0;border:0}
@media(min-width:560px){.lead{padding:1.4rem}}
.lead-head{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-start}
.lead-head > div:first-child{margin-right:auto}
.lead .name{font-weight:600;font-size:1rem}
.lead .meta{margin-top:.3rem;font-family:var(--mono);font-size:.76rem;color:var(--faint)}
.group{margin:2rem 0 .75rem;font-size:.78rem;font-family:var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--violet)}
.group:first-of-type{margin-top:0}
.lead-contacts{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;list-style:none;padding:0;margin:0}
.lead-contacts a{display:inline-flex;align-items:center;min-height:44px;
  font-size:.88rem;color:var(--violet);text-decoration:none}
.lead-contacts a:hover{text-decoration:underline}
.lead-msg{white-space:pre-wrap;font-size:.93rem;color:var(--muted);
  padding:.85rem 1rem;border-radius:10px;background:rgba(255,255,255,.03)}
.lead-form{display:grid;gap:.75rem;align-items:end;padding-top:.9rem;
  border-top:1px solid var(--line)}
@media(min-width:760px){.lead-form{grid-template-columns:200px 1fr auto}}
.lead-form .field{margin:0}

/* фильтры по статусу */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 .9rem;
  border:1px solid var(--line-hi);border-radius:999px;font-size:.85rem;
  color:var(--muted);text-decoration:none}
.chip:hover{color:var(--text);border-color:var(--line-hi);background:rgba(255,255,255,.04)}
.chip.on{background:var(--violet);color:var(--on-accent);border-color:transparent}

/* широкие таблицы прокручиваются внутри себя, страница — нет */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);background:var(--panel-hi)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Подпись только для скринридера: рядом с полем уже стоит placeholder,
   но программе чтения нужна настоящая метка. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script src="/panel.js" defer></script>
</body>
</html>
