# PostgreSQL tuned for a single modest server (4 GB RAM, SSD).
#
# Adjust shared_buffers and effective_cache_size first if the machine is
# larger: they are the two settings that matter most.

listen_addresses = '*'
max_connections = 100

# A quarter of RAM for shared buffers, three quarters assumed cached overall.
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB

# SSD: random reads cost about what sequential ones do, and the queue is deep.
random_page_cost = 1.1
effective_io_concurrency = 200

wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = on

# Keep enough WAL for a backup tool to pick up, without unbounded growth.
archive_mode = off

# Log what a person would want when something is slow, and nothing else.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# A statement that has run for a minute is not going to finish usefully.
statement_timeout = 60s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Query statistics, for finding the slow ones later.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
