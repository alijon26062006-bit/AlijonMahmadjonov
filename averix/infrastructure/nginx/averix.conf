# Nginx, for a deployment that already terminates TLS this way.
#
# The compose stack uses Caddy instead, because it gets and renews its own
# certificate. This file is here for an environment where Nginx is already the
# standard — the proxying rules are the same.
#
# Certificates: certbot --nginx -d averix.dev

upstream averix_api {
    server api:8080;
    keepalive 32;
}

upstream averix_web {
    server web:3000;
    keepalive 32;
}

# Rate limiting at the edge, in front of the application's own limiter.
limit_req_zone $binary_remote_addr zone=averix_api:10m rate=20r/s;

server {
    listen 80;
    server_name averix.dev;
    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name averix.dev;

    ssl_certificate     /etc/letsencrypt/live/averix.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/averix.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # An upload limit at the edge, matching MAX_FILE_BYTES.
    client_max_body_size 55m;
    client_body_timeout 120s;

    location /api/ {
        limit_req zone=averix_api burst=40 nodelay;
        proxy_pass http://averix_api;
        proxy_http_version 1.1;

        # The WebSocket upgrade. Without these two headers the realtime
        # connection silently falls back to reconnect loops.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://averix_api/health; access_log off; }
    location = /ready  { proxy_pass http://averix_api/ready;  access_log off; }

    location / {
        proxy_pass http://averix_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

