<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — AVERIX</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A090F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/styles.css">
<style>
  .nf{min-height:100dvh;display:grid;place-items:center;padding:var(--s3);position:relative}
  .nf-in{max-width:52ch;text-align:left}
  .nf-code{font-family:var(--mono);font-size:.78rem;letter-spacing:.16em;color:var(--violet)}
  .nf h1{margin-top:var(--s3);font-size:clamp(1.8rem,5.5vw,2.8rem);line-height:1.14}
  .nf p{margin-top:var(--s3);color:var(--muted);font-size:1.02rem}
  .nf-cta{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<main class="nf">
  <div class="shell nf-in">
    <a class="brand" href="/" aria-label="AVERIX — на главную">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <polygon points="55,6 69,6 59,27 45,27" fill="#A472E8"/>
        <polygon points="42,35 75,35 79,55 38,55" fill="#A472E8"/>
        <polygon points="34,63 82,63 86,83 30,83" fill="#34C97D"/>
      </svg>
      <span class="brand-text">AVERI<span>X</span></span>
    </a>

    <p class="nf-code" style="margin-top:var(--s4)">ОШИБКА 404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, её удалили или в адресе опечатка. Проверьте ссылку — или вернитесь на главную.</p>

    <div class="nf-cta">
      <a class="btn btn-solid" href="/">На главную</a>
      <a class="btn btn-line" href="/#final">Написать нам</a>
    </div>
  </div>
</main>

</body>
</html>
