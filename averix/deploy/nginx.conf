# ============================================================
# AVERIX — конфиг Nginx
# __DOMAIN__, __ROOT__ и __DATA_DIR__ подставляет setup.sh
# ============================================================

# Статику отдаёт nginx прямо с диска, страницы собирает приложение.
# Так css, шрифты и картинки не проходят через Python, а тексты
# и проекты берутся из базы и меняются через админку без правки кода.

upstream averix_app {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __ROOT__;

    # ---------- сжатие ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    # text/html сюда не пишем: nginx жмёт его всегда, а повтор даёт
    # предупреждение «duplicate MIME type» при проверке конфига
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml;
    # woff2 и webp уже сжаты — повторно жать бессмысленно

    # ---------- безопасность ----------
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Единственный встроенный скрипт на сайте разрешён по хешу, а не
    # через 'unsafe-inline': так посторонний скрипт браузер не выполнит.
    # style-src приходится оставить с 'unsafe-inline' — в разметке есть
    # атрибуты style, хеши на них не распространяются.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'sha256-tHd4qJ0R/vQfI0CbRTiL3XGSi+Tun7VhOcDbx08aLKA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    server_tokens off;

    client_max_body_size 10m;

    # ---------- кеш статики ----------
    # Имена файлов не содержат хеша, поэтому css и js кешировать надолго
    # нельзя: после git pull вернувшийся посетитель увидел бы старый сайт.
    # no-cache не отключает кеш, а требует проверки — при неизменном файле
    # сервер отвечает 304 в несколько байт.
    # Только файлы сайта: css и js из корня, а не из любой папки репозитория
    location ~* ^/(styles|fonts|app|panel)\.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        # add_header в location ОТМЕНЯЕТ все заголовки, унаследованные
        # от server. Поэтому там, где мы задаём свой Cache-Control,
        # защитные заголовки приходится повторять — иначе статика
        # и загруженные файлы уедут без nosniff.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Шрифты не меняются никогда — их можно закешировать на год.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Картинки меняются редко.
    location ~* ^/(img/[^/]+|og\.png|favicon\.svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Загруженные картинки лежат вне репозитория, вместе с базой
    location ^~ /uploads/ {
        alias __DATA_DIR__/uploads/;
        add_header Cache-Control "public, max-age=2592000" always;
        # Здесь лежат чужие файлы: без nosniff браузер мог бы решить,
        # что картинка — это HTML, и выполнить её содержимое
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'; sandbox" always;
        # Здесь не должно исполняться ничего: файл photo.php.jpg
        # обязан отдаться как файл, а не выполниться
        location ~ \.(php|py|pl|cgi|sh)$ { deny all; return 404; }
        try_files $uri =404;
    }

    # Служебные файлы наружу не отдаём
    location ~ /\.(git|env) {
        deny all;
        return 404;
    }
    location = /README.md  { return 404; }
    location = /k.txt      { return 404; }
    location ^~ /deploy/   { return 404; }
    location ^~ /app/      { return 404; }

    # ---------- страницы ----------
    # Всё, кроме статики выше, уходит в приложение — и ничего больше
    # с диска не отдаётся.
    #
    # Раньше здесь стояло try_files $uri @app, то есть nginx сначала
    # искал файл на диске. Из-за этого наружу отдавалось всё, что лежит
    # в репозитории: tests/, requirements.txt, pytest.ini. В файлах
    # тестов есть пароль тестового администратора — его мог прочитать
    # кто угодно. Список того, что «не отдавать», всегда оказывается
    # неполным, поэтому правило перевёрнуто: отдаём только известную
    # статику, остальное собирает приложение.
    location / {
        proxy_pass http://averix_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @app {
        proxy_pass http://averix_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /admin {
        proxy_pass http://averix_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Если приложение не отвечает — показываем свою страницу, а не
    # стандартную заглушку nginx с версией сервера
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
