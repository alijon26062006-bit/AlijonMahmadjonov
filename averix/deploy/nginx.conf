# ============================================================
# AVERIX — конфиг Nginx
# __DOMAIN__ и __ROOT__ подставляет setup.sh
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __ROOT__;
    index index.html;

    # ---------- сжатие ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    # woff2 и webp уже сжаты — повторно жать бессмысленно

    # ---------- безопасность ----------
    add_header X-Content-Type-Options   "nosniff"                always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "SAMEORIGIN"             always;
    server_tokens off;

    # ---------- кеш ----------
    # Имена файлов не содержат хеша, поэтому css и js кешировать надолго
    # нельзя: после git pull вернувшийся посетитель увидел бы старый сайт.
    # no-cache не отключает кеш, а требует проверки — при неизменном файле
    # сервер отвечает 304 в несколько байт.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Шрифты не меняются никогда — их можно закешировать на год.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Картинки меняются редко.
    location ~* \.(webp|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # ---------- приложение ----------
    # Публичный сайт по-прежнему отдаёт nginx как статику.
    # В приложение уходит только админка.
    location /admin {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
    }

    # Загруженные картинки лежат вне репозитория, вместе с базой
    location /uploads/ {
        alias __DATA_DIR__/uploads/;
        expires 30d;
        add_header Cache-Control "public" always;
        # Здесь не должно исполняться ничего: файл photo.php.jpg
        # обязан отдаться как файл, а не выполниться
        location ~ \\.(php|py|pl|cgi|sh)$ { deny all; return 404; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Служебные файлы наружу не отдаём
    location ~ /\.(git|env) {
        deny all;
        return 404;
    }
    location = /README.md { return 404; }
    location ^~ /deploy/  { return 404; }
}
