# nginx перед сервером дуэли: держит HTTPS и пропускает WebSocket.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/duel
#   sudo ln -s /etc/nginx/sites-available/duel /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d duel.example.com     # бесплатный сертификат
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замени duel.example.com на свой домен. Telegram открывает Mini App
# только по https, поэтому сертификат обязателен.

upstream duel_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name duel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name duel.example.com;

    ssl_certificate     /etc/letsencrypt/live/duel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duel.example.com/privkey.pem;

    # Игра открывается внутри Telegram — запретить встраивание нельзя.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Матч живёт на одном соединении, поэтому его нельзя обрывать по таймауту.
    location /ws {
        proxy_pass http://duel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://duel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Картинка и скрипты меняются только при обновлении — можно кешировать.
    location /static/ {
        proxy_pass http://duel_backend;
        proxy_set_header Host $host;
        expires 1h;
    }
}
