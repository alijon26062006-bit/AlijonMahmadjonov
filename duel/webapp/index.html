<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Перетягивание каната: математика</title>
<link rel="stylesheet" href="/static/style.css">
<!-- Библиотеку Telegram берём со своего домена: у части операторов
     telegram.org с телефона не открывается, и тогда игра не узнала бы,
     кто зашёл. Если свой файл не отдался — идём к первоисточнику. -->
<script src="/tg-webapp.js"></script>
<script>
  if (!(window.Telegram && window.Telegram.WebApp)) {
    document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  }
</script>
</head>
<body>

<!-- Пока идёт вход и проверка подписи Telegram -->
<section class="screen" id="s-loading">
  <div class="spinner"></div>
</section>

<!-- Главное меню -->
<section class="screen hidden" id="s-menu">
  <header class="menu-head">
    <h1 id="m-title">Перетягивание каната</h1>
    <div class="me" id="m-me"></div>
    <div class="online" id="m-online"></div>
  </header>

  <div class="field">
    <div class="field-label" data-i18n="duration">Сколько играем</div>
    <div class="chips" id="m-durations"></div>
  </div>

  <div class="field">
    <div class="field-label" data-i18n="level">Сложность</div>
    <div class="chips levels" id="m-levels"></div>
  </div>

  <button class="btn primary big" id="m-play" data-i18n="play">Найти соперника</button>
  <div class="row">
    <button class="btn" id="m-friend" data-i18n="friend">Позвать друга</button>
    <button class="btn" id="m-join" data-i18n="join">Войти по коду</button>
  </div>
  <div class="row">
    <button class="btn" id="m-players" data-i18n="players">Игроки</button>
    <button class="btn ghost" id="m-top" data-i18n="top">Таблица лидеров</button>
  </div>
  <div class="row toggles">
    <button class="btn ghost narrow" id="m-lang" title="Язык">🌐</button>
    <button class="btn ghost narrow" id="m-sound" title="Звук">🔊</button>
    <button class="btn ghost narrow" id="m-music" title="Музыка">🎵</button>
  </div>
</section>

<!-- Поиск соперника -->
<section class="screen hidden" id="s-search">
  <div class="spinner"></div>
  <h2 data-i18n="searching">Ищем соперника</h2>
  <p class="muted" id="q-hint" data-i18n="searching.hint"></p>
  <p class="muted" id="q-count"></p>

  <!-- Никого не нашлось за полминуты — предлагаем робота -->
  <div class="offer hidden" id="q-offer">
    <div class="offer-title" data-i18n="robot.offer">Сейчас никого рядом нет</div>
    <p class="muted" data-i18n="robot.offer.hint"></p>
    <button class="btn primary" id="q-robot" data-i18n="robot.play">🤖 Сыграть с роботом</button>
  </div>

  <button class="btn ghost" id="q-cancel" data-i18n="cancel">Отмена</button>
</section>

<!-- Комната для друга -->
<section class="screen hidden" id="s-room">
  <h2 data-i18n="room.title">Комната для друга</h2>
  <p class="muted" data-i18n="room.hint"></p>
  <div class="code" id="r-code">------</div>
  <button class="btn primary" id="r-share" data-i18n="room.share">Отправить другу</button>
  <p class="muted" id="r-waiting" data-i18n="room.waiting"></p>
  <button class="btn ghost" id="r-cancel" data-i18n="cancel">Отмена</button>
</section>

<!-- Пришёл по ссылке-приглашению -->
<section class="screen hidden" id="s-invite">
  <div class="caller">
    <div class="face big" id="i-face">?</div>
    <div class="caller-name" id="i-name">—</div>
    <div class="muted" id="i-rank"></div>
  </div>
  <p class="invite-title" data-i18n="invite.title">Тебя зовут на дуэль</p>
  <div class="invite-terms" id="i-terms"></div>
  <button class="btn primary big" id="i-go" data-i18n="invite.go">⚔️ В бой!</button>
  <button class="btn ghost" id="i-cancel" data-i18n="cancel">Отмена</button>
</section>

<!-- Игровое поле -->
<section class="screen game hidden" id="s-game">
  <div class="hud">
    <div class="hud-side me">
      <span class="hud-name" id="g-me-name">—</span>
      <span class="hud-score" id="g-me-score">0</span>
    </div>
    <div class="hud-clock" id="g-clock">—</div>
    <div class="hud-side opp">
      <span class="hud-score" id="g-opp-score">0</span>
      <span class="hud-name" id="g-opp-name">—</span>
    </div>
  </div>

  <div class="scene">
    <svg id="g-scene" viewBox="32 24 296 84" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <line class="ground" x1="36" y1="100" x2="324" y2="100"/>
      <line class="middle" x1="180" y1="28" x2="180" y2="100"/>

      <!-- Канат рисуется первым: кисти рук ложатся поверх него, будто держат. -->
      <g id="rope-group">
        <g class="tug">
          <line class="rope" x1="85" y1="-37" x2="275" y2="-37" transform="translate(0,100)"/>
        </g>
      </g>

      <!-- Флажок на середине каната: он и показывает, кто перетягивает. -->
      <g id="g-knot">
        <g transform="translate(180,63)">
          <g class="knot">
            <path class="knot-line" d="M0,-11 L0,11"/>
            <path class="knot-flag" d="M0,-11 L14,-4 L0,3 z"/>
          </g>
        </g>
      </g>

      <!-- Дальний человечек рисуется первым, ближний его перекрывает. -->
      <g id="g-team-me" class="team me">
        <g class="tug">
        <g class="fig" transform="translate(78,100)">
          <g class="sway">
            <ellipse class="f-shadow" cx="-1" cy="-1.5" rx="20" ry="2.8"/>

            <!-- дальняя нога: пятка вкопана в землю -->
            <path class="f-pants" d="M-2,-30 L-12,-17 L-16,-8"/>
            <rect class="f-shoe" x="-24" y="-8.5" width="15" height="7" rx="3.2"/>
            <!-- ближняя нога: шаг вперёд, колено согнуто -->
            <path class="f-pants" d="M3,-30 L12,-21 L14,-9"/>
            <rect class="f-shoe" x="7" y="-9.5" width="18" height="7" rx="3.2"/>

            <!-- корпус отклонён назад: весь вес против каната -->
            <g transform="translate(-4.5,-39) rotate(-24)">
              <rect class="f-body" x="-8" y="-12" width="16" height="24" rx="7"/>
              <path class="f-print" d="M-4.5,-6 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-5,1 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-4,7.5 q4,2.5 8,0"/>
            </g>

            <path class="f-neck" d="M-9,-49 L-11,-53"/>

            <!-- обе руки вцепились в канат -->
            <path class="f-arm" d="M-7,-45 L3,-40.5 L14,-38.5"/>
            <path class="f-arm" d="M-6,-42 L5,-38 L15,-35.5"/>
            <circle class="f-hand" cx="15" cy="-38.5" r="3"/>
            <circle class="f-hand" cx="16" cy="-35.5" r="3"/>

            <!-- голова -->
            <circle class="f-head" cx="-13.5" cy="-57" r="8.5"/>
            <circle class="f-eye" cx="-8.4" cy="-58" r="1.3"/>
            <path class="f-mouth" d="M-8.6,-53.6 q-2,1.4 -4,.4"/>
            <path class="f-cap" d="M-21.9,-58.6 A 8.5,8.5 0 0 1 -5.1,-58.6 z"/>
            <path class="f-cap" d="M-6.5,-59.8 L5.5,-60.6 L-5,-56.4 z"/>
          </g>
        </g>
        <g class="fig" transform="translate(116,100)">
          <g class="sway">
            <ellipse class="f-shadow" cx="-1" cy="-1.5" rx="20" ry="2.8"/>

            <!-- дальняя нога: пятка вкопана в землю -->
            <path class="f-pants" d="M-2,-30 L-12,-17 L-16,-8"/>
            <rect class="f-shoe" x="-24" y="-8.5" width="15" height="7" rx="3.2"/>
            <!-- ближняя нога: шаг вперёд, колено согнуто -->
            <path class="f-pants" d="M3,-30 L12,-21 L14,-9"/>
            <rect class="f-shoe" x="7" y="-9.5" width="18" height="7" rx="3.2"/>

            <!-- корпус отклонён назад: весь вес против каната -->
            <g transform="translate(-4.5,-39) rotate(-24)">
              <rect class="f-body" x="-8" y="-12" width="16" height="24" rx="7"/>
              <path class="f-print" d="M-4.5,-6 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-5,1 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-4,7.5 q4,2.5 8,0"/>
            </g>

            <path class="f-neck" d="M-9,-49 L-11,-53"/>

            <!-- обе руки вцепились в канат -->
            <path class="f-arm" d="M-7,-45 L3,-40.5 L14,-38.5"/>
            <path class="f-arm" d="M-6,-42 L5,-38 L15,-35.5"/>
            <circle class="f-hand" cx="15" cy="-38.5" r="3"/>
            <circle class="f-hand" cx="16" cy="-35.5" r="3"/>

            <!-- голова -->
            <circle class="f-head" cx="-13.5" cy="-57" r="8.5"/>
            <circle class="f-eye" cx="-8.4" cy="-58" r="1.3"/>
            <path class="f-mouth" d="M-8.6,-53.6 q-2,1.4 -4,.4"/>
            <path class="f-cap" d="M-21.9,-58.6 A 8.5,8.5 0 0 1 -5.1,-58.6 z"/>
            <path class="f-cap" d="M-6.5,-59.8 L5.5,-60.6 L-5,-56.4 z"/>
          </g>
        </g>
        </g>
      </g>

      <g id="g-team-opp" class="team opp">
        <g class="tug">
        <g class="fig" transform="scale(-1,1) translate(-282,100)">
          <g class="sway">
            <ellipse class="f-shadow" cx="-1" cy="-1.5" rx="20" ry="2.8"/>

            <!-- дальняя нога: пятка вкопана в землю -->
            <path class="f-pants" d="M-2,-30 L-12,-17 L-16,-8"/>
            <rect class="f-shoe" x="-24" y="-8.5" width="15" height="7" rx="3.2"/>
            <!-- ближняя нога: шаг вперёд, колено согнуто -->
            <path class="f-pants" d="M3,-30 L12,-21 L14,-9"/>
            <rect class="f-shoe" x="7" y="-9.5" width="18" height="7" rx="3.2"/>

            <!-- корпус отклонён назад: весь вес против каната -->
            <g transform="translate(-4.5,-39) rotate(-24)">
              <rect class="f-body" x="-8" y="-12" width="16" height="24" rx="7"/>
              <path class="f-print" d="M-4.5,-6 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-5,1 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-4,7.5 q4,2.5 8,0"/>
            </g>

            <path class="f-neck" d="M-9,-49 L-11,-53"/>

            <!-- обе руки вцепились в канат -->
            <path class="f-arm" d="M-7,-45 L3,-40.5 L14,-38.5"/>
            <path class="f-arm" d="M-6,-42 L5,-38 L15,-35.5"/>
            <circle class="f-hand" cx="15" cy="-38.5" r="3"/>
            <circle class="f-hand" cx="16" cy="-35.5" r="3"/>

            <!-- голова -->
            <circle class="f-head" cx="-13.5" cy="-57" r="8.5"/>
            <circle class="f-eye" cx="-8.4" cy="-58" r="1.3"/>
            <path class="f-mouth" d="M-8.6,-53.6 q-2,1.4 -4,.4"/>
            <path class="f-cap" d="M-21.9,-58.6 A 8.5,8.5 0 0 1 -5.1,-58.6 z"/>
            <path class="f-cap" d="M-6.5,-59.8 L5.5,-60.6 L-5,-56.4 z"/>
          </g>
        </g>
        <g class="fig" transform="scale(-1,1) translate(-244,100)">
          <g class="sway">
            <ellipse class="f-shadow" cx="-1" cy="-1.5" rx="20" ry="2.8"/>

            <!-- дальняя нога: пятка вкопана в землю -->
            <path class="f-pants" d="M-2,-30 L-12,-17 L-16,-8"/>
            <rect class="f-shoe" x="-24" y="-8.5" width="15" height="7" rx="3.2"/>
            <!-- ближняя нога: шаг вперёд, колено согнуто -->
            <path class="f-pants" d="M3,-30 L12,-21 L14,-9"/>
            <rect class="f-shoe" x="7" y="-9.5" width="18" height="7" rx="3.2"/>

            <!-- корпус отклонён назад: весь вес против каната -->
            <g transform="translate(-4.5,-39) rotate(-24)">
              <rect class="f-body" x="-8" y="-12" width="16" height="24" rx="7"/>
              <path class="f-print" d="M-4.5,-6 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-5,1 q4,2.5 8.5,0"/>
              <path class="f-print" d="M-4,7.5 q4,2.5 8,0"/>
            </g>

            <path class="f-neck" d="M-9,-49 L-11,-53"/>

            <!-- обе руки вцепились в канат -->
            <path class="f-arm" d="M-7,-45 L3,-40.5 L14,-38.5"/>
            <path class="f-arm" d="M-6,-42 L5,-38 L15,-35.5"/>
            <circle class="f-hand" cx="15" cy="-38.5" r="3"/>
            <circle class="f-hand" cx="16" cy="-35.5" r="3"/>

            <!-- голова -->
            <circle class="f-head" cx="-13.5" cy="-57" r="8.5"/>
            <circle class="f-eye" cx="-8.4" cy="-58" r="1.3"/>
            <path class="f-mouth" d="M-8.6,-53.6 q-2,1.4 -4,.4"/>
            <path class="f-cap" d="M-21.9,-58.6 A 8.5,8.5 0 0 1 -5.1,-58.6 z"/>
            <path class="f-cap" d="M-6.5,-59.8 L5.5,-60.6 L-5,-56.4 z"/>
          </g>
        </g>
        </g>
      </g>
    </svg>
    <div class="flash" id="g-flash"></div>
  </div>

  <div class="task">
    <div class="question" id="g-question">…</div>
    <div class="answer" id="g-answer"></div>
    <div class="streak hidden" id="g-streak"></div>
  </div>

  <div class="pad" id="g-pad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key del" data-key="del">←</button>
    <button class="key" data-key="0">0</button>
    <button class="key ok" data-key="ok">✓</button>
  </div>

  <div class="countdown hidden" id="g-countdown"><span>3</span></div>
  <div class="freeze hidden" id="g-freeze"></div>
</section>

<!-- Итог матча -->
<section class="screen hidden" id="s-result">
  <div class="verdict" id="e-verdict">—</div>
  <p class="muted" id="e-reason"></p>
  <div class="final-score"><span id="e-score">0</span><i>:</i><span id="e-opp-score">0</span></div>
  <div class="rating-line" id="e-rating"></div>
  <ul class="stats" id="e-stats"></ul>
  <button class="btn primary big" id="e-again" data-i18n="again">Ещё раз</button>
  <button class="btn ghost" id="e-home" data-i18n="home">В меню</button>
</section>

<!-- Все игроки: сверху те, кто заходил недавно -->
<section class="screen hidden" id="s-players">
  <h2 data-i18n="players">Игроки</h2>
  <p class="muted" data-i18n="players.hint"></p>
  <ul class="people" id="p-list"></ul>
  <button class="btn ghost hidden" id="p-more" data-i18n="players.more">Показать ещё</button>
  <button class="btn ghost" id="p-back" data-i18n="back">Назад</button>
</section>

<!-- Таблица лидеров -->
<section class="screen hidden" id="s-top">
  <h2 data-i18n="top">Таблица лидеров</h2>
  <div class="podium" id="t-podium"></div>
  <ol class="board" id="t-list"></ol>
  <div class="you-row hidden" id="t-you"></div>
  <button class="btn ghost" id="t-back" data-i18n="back">Назад</button>
</section>

<div class="toast hidden" id="toast"></div>

<script src="/static/sound.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
