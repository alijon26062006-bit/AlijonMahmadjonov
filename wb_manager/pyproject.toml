[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wbm"
version = "0.1.0"
description = "AI-менеджер для продавцов Wildberries: анализ магазина (v1 — только чтение)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14",
    "aiomysql>=0.2",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "anthropic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["mysql: тесты на настоящем MySQL (нужна переменная WBM_TEST_MYSQL_URL)"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4"]
ignore = [
    "E501",    # длину строк держит ruff format; длинные русские тексты сообщений не режем
    "RUF001",  # кириллица в строках — это нормально для русского интерфейса
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx", "respx.*", "aiomysql", "aiomysql.*"]
ignore_missing_imports = true
