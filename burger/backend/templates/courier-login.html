<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курьер · The Burger</title>
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="/static/icon-courier.svg">
<link rel="stylesheet" href="/static/courier.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="wrap gate">
  <h1 class="gate__title">Панель курьера</h1>
  <p class="gate__text" id="say">Проверяю, кто вы…</p>
</main>

<script>
/* Панель открыта внутри Telegram — представляемся подписанной строкой,
   её проверит сервер. Открыта в обычном браузере — просим зайти из бота. */
(async () => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const say = document.querySelector('#say');

  if (!tg || !tg.initData) {
    say.textContent = 'Откройте панель из бота: нажмите там кнопку «Открыть панель».';
    return;
  }
  tg.ready(); tg.expand();

  try {
    const r = await fetch('/courier/tg-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify({ initData: tg.initData }),
    });
    if (r.ok) { location.replace('/courier'); return; }
    const body = await r.json().catch(() => ({}));
    say.textContent = body.error || 'Не получилось войти. Напишите боту /start.';
  } catch (e) {
    say.textContent = 'Нет связи с сервером. Попробуйте ещё раз через минуту.';
  }
})();
</script>
</body>
</html>
