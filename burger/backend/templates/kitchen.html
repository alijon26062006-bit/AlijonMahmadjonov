<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кухня · The Burger</title>
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="/static/icon-kitchen.svg">
<link rel="manifest" href="/static/kitchen.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/kitchen.css">
</head>
<body>

<header class="bar">
  <b>Кухня</b>
  <span class="count" id="count">0 заказов</span>
  <span class="clock" id="clock">--:--</span>
  <button class="mute" id="mute" type="button" aria-pressed="false">Звук вкл</button>
  <a class="back" href="/admin">Заказы</a>
</header>

<p class="lost" id="lost" hidden>
  Нет связи с сервером. На экране заказы по состоянию на <b id="lost-time">--:--</b> —
  новые могли не дойти. Проверьте интернет.
</p>

<button class="unlock" id="unlock" hidden>
  Нажмите, чтобы включить звук — браузер держит его выключенным до первого касания
</button>

<main class="board" id="board"></main>

<p class="empty" id="empty" hidden>Новых заказов нет</p>

<script src="/static/kitchen.js"></script>
</body>
</html>
