server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 12m;   # запас под загрузку фото с сайта

    # API проксируется на бэкенд — сайт и API живут на одном адресе,
    # поэтому наружу нужен ровно один домен и нет забот с CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # SPA-роутинг
    location / {
        try_files $uri /index.html;
    }

    # index.html — всегда свежий (Telegram агрессивно кэширует Mini App)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Хешированные ассеты — навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
