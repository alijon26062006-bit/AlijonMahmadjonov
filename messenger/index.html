<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloqa — концепт мессенджера</title>
<meta name="description" content="UI-концепт мобильного мессенджера Aloqa: вход, чаты, переписка, профиль, звонок и тёмная тема.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Page chrome ---------- */
:root{
  --page-bg:#E9EBF2; --page-text:#11131A; --page-muted:#6B7187; --page-card:#FFFFFF; --page-line:#DADDE8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#0A0B10; --page-text:#EEF0F6; --page-muted:#8B91A7; --page-card:#14161E; --page-line:#262A37; }
}
:root[data-theme="dark"]{ --page-bg:#0A0B10; --page-text:#EEF0F6; --page-muted:#8B91A7; --page-card:#14161E; --page-line:#262A37; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--page-bg);color:var(--page-text);-webkit-font-smoothing:antialiased}
.page-head{max-width:1400px;margin:0 auto;padding:56px 16px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.page-head h1 span{color:#5B4BFF}
.page-head p{color:var(--page-muted);font-size:17px;max-width:560px;margin-top:12px;line-height:1.5}
.page-head a{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:15px;color:var(--page-text);text-decoration:none;background:var(--page-card);border:1px solid var(--page-line);padding:12px 18px;border-radius:14px}
.gallery{max-width:1400px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-wrap:wrap;justify-content:center;gap:56px 40px}
.shot{display:flex;flex-direction:column;align-items:center;gap:16px}
.shot-label{font-size:14px;font-weight:700;color:var(--page-muted);letter-spacing:.08em;text-transform:uppercase}
.shot-label b{color:var(--page-text)}
.device{width:410px;height:864px;border-radius:58px;padding:10px;background:#0B0C10;box-shadow:0 40px 80px -30px rgba(20,22,40,.45),0 0 0 1px rgba(255,255,255,.06) inset}
@media (max-width:440px){ .device{zoom:.82} }
@media (max-width:370px){ .device{zoom:.72} }

/* ---------- App tokens (mirror Figma collections Aloqa / Light & Aloqa / Dark) ---------- */
.screen{
  --bg-app:#F4F5FA; --bg-surface:#FFFFFF; --bg-subtle:#EEF0F7; --bg-chat:#E8EBF5;
  --text:#11131A; --text-2:#727890; --brand:#5B4BFF; --brand-soft:#ECEAFF; --on-brand:#FFFFFF;
  --bubble-in:#FFFFFF; --bubble-out:#5B4BFF; --border:#E4E7F0; --online:#22C55E; --danger:#EF4444;
  --pattern:rgba(91,75,255,.10);
  width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;
  background:var(--bg-app);color:var(--text);display:flex;flex-direction:column;font-size:15px
}
.screen.dark{
  --bg-app:#0E1016; --bg-surface:#171A23; --bg-subtle:#232735; --bg-chat:#0B0D12;
  --text:#F3F4F8; --text-2:#8B91A7; --brand:#7B6DFF; --brand-soft:#262347;
  --bubble-in:#212533; --bubble-out:#6A5CFF; --border:#2A2F3E; --danger:#F87171; --pattern:rgba(123,109,255,.09);
}
.screen svg.ic{flex:none;display:block}
.sb{height:47px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0 32px;font-weight:700;font-size:16px}
.sb.light{color:#fff}
.ib{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:transparent;color:var(--text);flex:none}
.ib.soft{background:var(--bg-subtle)}
.ib.brand{background:var(--brand);color:var(--on-brand)}
.av{--s:52px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s)*.35);position:relative;letter-spacing:.01em}
.av .dot{position:absolute;right:0;bottom:0;width:calc(var(--s)*.27);height:calc(var(--s)*.27);border-radius:50%;background:var(--online);box-shadow:0 0 0 2.5px var(--bg-surface)}
.g1{background:linear-gradient(135deg,#8B7BFF,#5B4BFF)} .g2{background:linear-gradient(135deg,#FF9A9A,#FF4F7B)}
.g3{background:linear-gradient(135deg,#5EEAD4,#0EA5A4)} .g4{background:linear-gradient(135deg,#FDBA74,#F97316)}
.g5{background:linear-gradient(135deg,#7DD3FC,#2563EB)} .g6{background:linear-gradient(135deg,#F0ABFC,#C026D3)}
.g7{background:linear-gradient(135deg,#86EFAC,#16A34A)}

/* ---------- Chats ---------- */
.lh{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px}
.lh h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.lh .btns{display:flex;gap:8px}
.search{margin:0 16px;height:44px;border-radius:14px;background:var(--bg-subtle);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text-2);font-weight:500}
.stories{display:flex;gap:14px;padding:16px 16px 4px;overflow:hidden}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;font-size:12px;font-weight:600;color:var(--text-2);flex:none}
.story .ring{padding:2.5px;border-radius:50%;background:conic-gradient(from 200deg,#5B4BFF,#C026D3,#FF4F7B,#F97316,#5B4BFF)}
.story .ring.seen{background:var(--border)}
.story .ring>.av{box-shadow:0 0 0 2.5px var(--bg-app)}
.story .add{width:60px;height:60px;border-radius:50%;border:2px dashed var(--border);display:grid;place-items:center;color:var(--brand);background:var(--bg-surface)}
.chips{display:flex;gap:8px;padding:12px 16px 6px}
.chip{height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--bg-surface);color:var(--text-2);border:1px solid var(--border)}
.chip b{font-size:12px;font-weight:700;color:var(--brand)}
.chip.on{background:var(--text);color:var(--bg-app);border-color:var(--text)}
.chip.on b{color:var(--bg-app);opacity:.7}
.list{flex:1;overflow:hidden;padding-top:4px}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px}
.row.pinned{background:var(--bg-surface)}
.rc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.r1,.r2{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.tm{font-size:13px;font-weight:500;color:var(--text-2)}
.tm.new{color:var(--brand);font-weight:700}
.msg{flex:1;min-width:0;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg em{font-style:normal;color:var(--text);font-weight:600}
.msg .vc{color:var(--brand);font-weight:600}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--brand);color:var(--on-brand);font-size:12px;font-weight:700;display:grid;place-items:center}
.badge.muted{background:var(--text-2)}
.verified{color:var(--brand)}
.tabbar{flex:none;display:flex;justify-content:space-between;padding:10px 28px 30px;background:var(--bg-surface);border-top:1px solid var(--border)}
.tab{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-2);position:relative}
.tab.on{color:var(--brand);font-weight:700}
.tab .badge{position:absolute;top:-6px;left:36px;height:18px;min-width:18px;font-size:11px;padding:0 5px;box-shadow:0 0 0 2px var(--bg-surface)}

/* ---------- Conversation ---------- */
.ch{display:flex;align-items:center;gap:10px;padding:4px 10px 10px 6px;background:var(--bg-surface);border-bottom:1px solid var(--border)}
.ch .who{flex:1;min-width:0}
.ch .who b{display:block;font-size:16px;font-weight:700}
.ch .who span{font-size:13px;color:var(--online);font-weight:600}
.ch .ib{color:var(--brand)}
.thread{flex:1;overflow:hidden;background-color:var(--bg-chat);background-image:radial-gradient(var(--pattern) 1.2px,transparent 1.6px);background-size:22px 22px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.date{align-self:center;font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;background:rgba(17,19,26,.35);color:#fff;margin:4px 0 8px;backdrop-filter:blur(6px)}
.b{max-width:282px;padding:8px 12px 7px;border-radius:18px;font-size:15px;line-height:21px;font-weight:500;position:relative;word-wrap:break-word}
.b.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(18,20,50,.06)}
.b.out{align-self:flex-end;background:var(--bubble-out);color:var(--on-brand);border-bottom-right-radius:6px}
.b.cont.in{border-bottom-left-radius:18px;border-top-left-radius:6px}
.b.cont.out{border-top-right-radius:6px}
.b .mt{float:right;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin:7px -2px -5px 10px;color:var(--text-2)}
.b.out .mt{color:rgba(255,255,255,.8)}
.b .q{border-left:3px solid currentColor;padding:3px 8px;margin:0 -4px 6px;border-radius:6px;font-size:13px;line-height:18px;background:rgba(255,255,255,.16)}
.b .q b{display:block}
.b.media{padding:4px 4px 7px}
.b.media .pic{width:240px;height:168px;border-radius:15px 15px 6px 6px;overflow:hidden;background:linear-gradient(160deg,#5B4BFF 0%,#8B7BFF 45%,#FFB199 100%);position:relative}
.b.media .cap{padding:6px 8px 0}
.voice{display:flex;align-items:center;gap:10px;min-width:232px}
.voice .play{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.wave i{width:3px;border-radius:2px;background:var(--brand);opacity:.35}
.wave i.on{opacity:1}
.voice small{display:block;font-size:12px;color:var(--text-2);font-weight:600;margin-top:2px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--bubble-in);border-radius:18px;border-bottom-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text-2);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 30px;background:var(--bg-surface);border-top:1px solid var(--border)}
.composer .ib{color:var(--text-2)}
.field{flex:1;min-height:40px;border-radius:20px;background:var(--bg-subtle);display:flex;align-items:center;padding:0 8px 0 16px;color:var(--text-2);font-weight:500;gap:8px}
.field span{flex:1}

/* ---------- Profile ---------- */
.ph{display:flex;justify-content:space-between;padding:4px 10px}
.ph .ib{color:var(--brand)}
.hero{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 16px 18px}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.hero p{color:var(--online);font-weight:600;font-size:14px;margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.act{background:var(--bg-surface);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--brand);font-size:12px;font-weight:700}
.card{flex:none;margin:12px 16px 0;background:var(--bg-surface);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.li+.li::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--border)}
.li .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15px}
.li .t small{font-size:13px;color:var(--text-2);font-weight:500}
.li .v{color:var(--text-2);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--online);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.danger{color:var(--danger);font-weight:700;justify-content:center}

/* ---------- Call ---------- */
.call .sb{align-self:stretch}
.call{background:radial-gradient(120% 70% at 50% 25%,#8B7BFF 0%,#5B4BFF 40%,#1E1652 100%);color:#fff;align-items:center}
.call .enc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;opacity:.8;margin-top:24px}
.pulse{position:relative;margin-top:56px;display:grid;place-items:center}
.pulse::before,.pulse::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.25)}
.pulse::before{inset:-26px}.pulse::after{inset:-56px;border-color:rgba(255,255,255,.12)}
.call h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:72px}
.call .sub{font-size:16px;opacity:.8;font-weight:500;margin-top:6px}
.call .quick{display:flex;gap:48px;margin-top:auto;font-size:13px;font-weight:600}
.call .quick div{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.9}
.call .quick span.c{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.call .main{display:flex;gap:96px;margin:36px 0 64px}
.call .main div{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;font-weight:600}
.call .main span.c{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.red{background:#EF4444}.green{background:#22C55E}

/* ---------- Welcome ---------- */
.welcome .art{height:440px;position:relative;background:radial-gradient(90% 80% at 50% 10%,#ECEAFF 0%,transparent 70%);overflow:hidden}
.welcome.dark .art{background:radial-gradient(90% 80% at 50% 10%,#262347 0%,transparent 70%)}
.logo{width:96px;height:96px;border-radius:30px;background:linear-gradient(140deg,#8B7BFF,#5B4BFF 60%,#3B2FD0);display:grid;place-items:center;position:absolute;left:50%;top:170px;transform:translateX(-50%) rotate(-8deg);box-shadow:0 24px 48px -16px rgba(91,75,255,.6)}
.fb{position:absolute;padding:9px 13px;border-radius:16px;font-size:13px;font-weight:600;box-shadow:0 12px 30px -12px rgba(30,30,80,.25);white-space:nowrap}
.fb.w{background:var(--bg-surface);color:var(--text)}
.fb.p{background:var(--brand);color:#fff}
.fa{position:absolute;box-shadow:0 0 0 4px var(--bg-app)}
.welcome .body{padding:0 24px;display:flex;flex-direction:column;flex:1}
.welcome h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.welcome h1 span{color:var(--brand)}
.welcome .lead{color:var(--text-2);font-size:16px;line-height:1.5;margin-top:10px;font-weight:500}
.phone-in{display:flex;gap:8px;margin-top:24px}
.phone-in div{height:56px;border-radius:16px;background:var(--bg-surface);border:1.5px solid var(--border);display:flex;align-items:center;padding:0 14px;font-size:17px;font-weight:600;gap:6px}
.phone-in div.focus{flex:1;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.phone-in .caret{width:2px;height:22px;background:var(--brand);margin-left:-3px}
.cta{height:56px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;margin-top:14px;box-shadow:0 12px 24px -12px rgba(91,75,255,.7)}
.terms{font-size:12px;color:var(--text-2);text-align:center;margin-top:auto;padding-bottom:36px;line-height:1.5}
.terms a{color:var(--brand);text-decoration:none;font-weight:600}

/* ---------- Tokens ---------- */
.tokens{max-width:1400px;margin:0 auto;padding:0 16px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.tk{background:var(--page-card);border:1px solid var(--page-line);border-radius:24px;padding:24px}
.tk h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted);margin-bottom:16px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sw div{font-size:12px;font-weight:600;color:var(--page-muted)}
.sw i{display:block;height:44px;border-radius:12px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);background:linear-gradient(90deg,var(--l) 50%,var(--d) 50%)}
.ts{display:flex;flex-direction:column;gap:10px}
.ts div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--page-line);padding-bottom:10px}
.ts small{color:var(--page-muted);font-size:12px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<header class="page-head">
  <div>
    <h1>Aloqa — <span>мессенджер</span></h1>
    <p>UI-концепт мобильного приложения: вход по номеру, список чатов с историями и папками, переписка с голосовыми и медиа, профиль контакта, входящий звонок и тёмная тема.</p>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a href="app/" style="background:#5B4BFF;color:#fff;border-color:#5B4BFF">Открыть приложение →</a><a href="https://www.figma.com/design/ZdgIly4lGNlZbk6hiRQbwu" target="_blank" rel="noopener">Открыть UI-кит в Figma ↗</a></div>
</header>

<main class="gallery" id="gallery"></main>

<section class="tokens" id="tokens"></section>

const P={
