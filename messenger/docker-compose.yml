services:
  aloqa:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      MEDIA_TTL_HOURS: "${MEDIA_TTL_HOURS:-72}"   # сколько часов хранить фото/видео/голосовые
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"       # максимальный размер файла
      # Звонки: собственный STUN/TURN (сервис turn ниже)
      STUN_URLS: "stun:${DOMAIN}:3478"
      TURN_URLS: "turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp"
      TURN_SECRET: "${TURN_SECRET:?Укажите TURN_SECRET в файле .env}"
    volumes:
      - aloqa-data:/data

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [aloqa]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Укажите DOMAIN в файле .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # TURN-сервер: соединяет звонки, когда телефоны за NAT мобильного оператора
  turn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --log-file=stdout --fingerprint --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${DOMAIN} --listening-port=3478
      --min-port=49160 --max-port=49200
      --no-cli --no-multicast-peers --no-tlsv1 --no-tlsv1_1
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  aloqa-data:
  caddy-data:
  caddy-config:
