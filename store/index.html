      <p class="drawer__hint" id="delivery-hint"></p>

       data-tj="Маблағро ба яке аз кортҳои зерин гузаронед, сипас акси чекро ба боти мо фиристед — ӯ фармоишро ба администратор мерасонад."></p>

      </div>

      <span data-ru="К оплате" data-tj="Барои пардохт"></span>

    <a class="btn btn--primary btn--wide" id="send-order" href="#" target="_blank" rel="noopener"

       data-tj="Дар бот ном, рақам ва суроғаи расонданро нависед, акси чекро замима кунед. Администратор фармоишро тасдиқ мекунад."></p>
