name: Витрина — сборка APK

on:
  push:
    paths:
      - 'shop_app/**'
      - '.github/workflows/vitrina-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitrina-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [buyer, courier, admin]
    defaults:
      run:
        working-directory: shop_app
    env:
      APK_NAME: vitrina-${{ matrix.app }}-1.0.${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze

      - name: Тесты
        if: matrix.app == 'buyer'
        run: flutter test

      # Необязательно: постоянный ключ подписи, чтобы новые версии ставились поверх старых.
      # Нужны секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секретов нет — APK будет подписан отладочным ключом."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Сборка APK
        run: flutter build apk --release --flavor ${{ matrix.app }} -t lib/main_${{ matrix.app }}.dart --build-number=${{ github.run_number }}

      - name: Переименование
        run: cp "build/app/outputs/flutter-apk/app-${{ matrix.app }}-release.apk" "build/$APK_NAME"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: vitrina-${{ matrix.app }}-${{ github.run_number }}
          path: shop_app/build/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Релиз (ссылка для скачивания на телефон)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vitrina-v1.0.${{ github.run_number }}
          name: Витрина 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            📱 Android-приложения маркетплейса «Витрина»: покупатель, курьер, админ.
            Скачайте нужный файл ниже на телефон и откройте его.
            Если Android спросит — разрешите установку из этого источника.
            Ветка: `${{ github.ref_name }}`, коммит: `${{ github.sha }}`.
          files: shop_app/build/${{ env.APK_NAME }}
