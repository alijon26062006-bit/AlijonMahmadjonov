# Сборка Android-приложения MyCourse Beta (папка mycourse_app/).
# Каждая сборка: анализ кода, тесты, APK → артефакт и пре-релиз «apk-beta-N» на GitHub.
name: MyCourse Beta APK

on:
  push:
    paths:
      - "mycourse_app/**"
      - ".github/workflows/mycourse-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # чтобы создать пре-релиз с APK

concurrency:
  group: mycourse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mycourse_app
    env:
      # Ключ подписи (необязательно). Без него APK подписан отладочным ключом,
      # и новую сборку можно поставить только после удаления старой.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Тесты
        run: flutter test

      - name: Ключ подписи из секретов
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Сборка APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mycourse-beta-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mycourse-beta-apk-${{ github.run_number }}
          path: mycourse_app/dist/*.apk

      - name: Пре-релиз с APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-beta-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MyCourse Beta — сборка ${{ github.run_number }}
          prerelease: true
          files: mycourse_app/dist/mycourse-beta-${{ github.run_number }}.apk
          body: |
            Android-приложение **MyCourse Beta** — открывает beta.mycourse.tj.

            Установка: скачайте `mycourse-beta-${{ github.run_number }}.apk` на телефон,
            откройте файл и разрешите установку из этого источника.

            ${{ env.ANDROID_KEYSTORE_BASE64 == '' && '⚠️ Подписано отладочным ключом: перед установкой новой сборки удалите старую.' || 'Подписано ключом релиза: новая сборка ставится поверх старой.' }}

            Коммит: ${{ github.sha }}
