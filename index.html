<!doctype html>
<html lang="tg" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alijon Mahmadjonov — Python ва Telegram-ботҳо</title>
<meta name="description" content="Alijon Mahmadjonov — барномасози ҷавон аз Ғарм, Рашт. Python, Telegram-ботҳо, сайтҳо.">
<meta name="theme-color" content="#06060C">

<meta property="og:type" content="website">
<meta property="og:title" content="Alijon Mahmadjonov">
<meta property="og:description" content="Барномасози ҷавон аз Тоҷикистон. Python, Telegram-ботҳо, сайтҳо.">
<meta property="og:image" content="assets/cosmos-poster.jpg">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FFC46B'/><stop offset='.5' stop-color='%23FF6A4D'/><stop offset='1' stop-color='%23C05CFF'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='%2306060C'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='800' fill='url(%23g)' text-anchor='middle'>A</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/cosmos.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.classList.remove('no-js');</script>
</head>

<body>
<a class="skip-link" href="#main" data-bind="a11y.skip">К содержанию</a>

<!-- КОСМОС: держится за всей страницей -->
<div class="cosmos" aria-hidden="true"><canvas id="stars"></canvas></div>

<header class="nav" id="nav">
  <a href="#top" class="brand">Alijon<em>.</em></a>

  <nav class="nav-links" id="menu" aria-label="Навигация">
    <a href="#about"    data-nav="about">Обо мне</a>
    <a href="#path"     data-nav="path">Мой путь</a>
    <a href="#projects" data-nav="projects">Проекты</a>
    <a href="#diary"    data-nav="diary">Дневник</a>
    <a href="#contacts" data-nav="contacts">Контакты</a>
  </nav>

  <div class="lang" role="group" aria-label="Забон / Язык">
    <button type="button" data-lang="tj" aria-pressed="true">ТҶ</button>
    <button type="button" data-lang="ru" aria-pressed="false">РУ</button>
  </div>

  <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Меню">
    <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
  </button>
</header>

<main id="main">

  <!-- ПЕРВЫЙ ЭКРАН -->
  <section class="hero" id="top">
    <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
    <div class="wrap">
      <p class="badge reveal" data-bind="hero.badge"></p>
      <h1 class="hero-title reveal" id="heroTitle"></h1>
      <p class="hero-sub reveal" data-bind="hero.tagline"></p>
      <div class="hero-actions reveal">
        <a class="btn btn-grad" id="heroCta1" href="#" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#i-telegram"></use></svg>
          <span data-bind="hero.ctaPrimary"></span>
        </a>
        <a class="btn btn-glass" href="#projects">
          <svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>
          <span data-bind="hero.ctaSecondary"></span>
        </a>
      </div>
      <ul class="stats reveal" id="stats"></ul>
    </div>
  </section>

  <!-- БЕГУЩАЯ СТРОКА -->
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <!-- КТО Я -->
  <section class="section" id="about">
    <div class="wrap about-grid">
      <div class="reveal">
        <figure class="portrait" id="portrait"></figure>
      </div>
      <div class="reveal">
        <p class="badge" data-bind="about.badge"></p>
        <h2 class="greeting" id="greeting"></h2>
        <p class="about-role" data-bind="about.role"></p>
        <div class="about-body" id="aboutBody"></div>
        <p class="stack-title" data-bind="about.stackTitle"></p>
        <ul class="stack" id="stack"></ul>
      </div>
    </div>
  </section>

  <!-- КАК Я РАБОТАЮ -->
  <section class="section" id="work">
    <div class="wrap">
      <p class="badge reveal" data-bind="work.title"></p>
      <div class="about-body reveal" id="workBody" style="margin-top:var(--sp-8)"></div>
    </div>
  </section>

  <!-- МОЙ ПУТЬ -->
  <section class="section" id="path">
    <div class="wrap">
      <p class="badge reveal" data-bind="sections.timelineBadge"></p>
      <h2 class="title reveal" data-bind="sections.timeline"></h2>
      <ul class="timeline" id="timeline"></ul>
    </div>
  </section>

  <!-- ЦЕЛИ -->
  <section class="section" id="goals">
    <div class="wrap">
      <p class="badge reveal" data-bind="goals.badge"></p>
      <h2 class="title reveal" data-bind="goals.title"></h2>
      <div class="cards" id="goalsGrid"></div>
    </div>
  </section>

  <!-- ПОЧЕМУ Я -->
  <section class="section" id="why">
    <div class="wrap">
      <p class="badge reveal" data-bind="advantages.badge"></p>
      <h2 class="title reveal" id="advTitle"></h2>
      <div class="cards" id="advantages"></div>
    </div>
  </section>

  <!-- ЧТО УМЕЮ -->
  <section class="section" id="skills">
    <div class="wrap">
      <p class="badge reveal" data-bind="skills.title"></p>
      <h2 class="title reveal" data-bind="skills.note"></h2>
      <ul class="skills reveal" id="skillsList"></ul>
      <ul class="langs reveal" id="langs"></ul>
    </div>
  </section>

  <!-- ПРОЕКТЫ -->
  <section class="section" id="projects">
    <div class="wrap">
      <p class="badge reveal" data-bind="sections.projectsBadge"></p>
      <h2 class="title reveal" data-bind="sections.projects"></h2>
      <div id="projectsWrap"></div>
    </div>
  </section>

  <!-- ДНЕВНИК -->
  <section class="section" id="diary">
    <div class="wrap">
      <p class="badge reveal" data-bind="sections.diaryBadge"></p>
      <h2 class="title reveal" data-bind="sections.diaryLead"></h2>
      <ul class="diary" id="diaryList"></ul>
    </div>
  </section>

  <!-- ЗАКАЗАТЬ -->
  <section class="section" id="services">
    <div class="wrap">
      <p class="badge reveal" data-bind="services.badge"></p>
      <h2 class="title reveal" data-bind="services.lead"></h2>
      <div class="cards" id="servicesGrid"></div>
    </div>
  </section>

  <!-- КОНТАКТЫ -->
  <section class="section" id="contacts">
    <div class="wrap">
      <p class="badge reveal" data-bind="contacts.badge"></p>
      <h2 class="title reveal" id="formTitle"></h2>
      <p class="lead reveal" data-bind="contacts.lead"></p>
      <ul class="contact-pills reveal" id="contactsList"></ul>

      <form class="order-form glass glass-lit reveal" id="orderForm">
        <div>
          <label for="orderName" data-bind="contacts.form.name"></label>
          <input id="orderName" name="name" type="text" autocomplete="name" required>
        </div>
        <div>
          <label for="orderTask" data-bind="contacts.form.task"></label>
          <textarea id="orderTask" name="task" required></textarea>
        </div>
        <button class="btn btn-grad" type="submit">
          <svg class="icon" aria-hidden="true"><use href="#i-telegram"></use></svg>
          <span data-bind="contacts.form.send"></span>
        </button>
        <p class="hint" data-bind="contacts.form.note"></p>
      </form>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap">
    <span data-bind="footer.note"></span>
    <span>© <span id="year"></span> Alijon Mahmadjonov</span>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="Наверх">
  <svg class="icon" aria-hidden="true"><use href="#i-arrow-down"></use></svg>
</button>

<script src="js/i18n.js"></script>
<script src="js/render.js"></script>
<script src="js/starfield.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
