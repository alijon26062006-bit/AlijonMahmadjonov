<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Libos — бонусная программа</title>
<style>
@font-face { font-family: 'Unbounded'; src: url(fonts/Unbounded-600.ttf); font-weight: 600; }
@font-face { font-family: 'Unbounded'; src: url(fonts/Unbounded-700.ttf); font-weight: 700; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-500.ttf); font-weight: 500; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-700.ttf); font-weight: 700; }
@font-face { font-family: 'Manrope'; src: url(fonts/Manrope-800.ttf); font-weight: 800; }

:root {
  --ink: #0B0B0B;
  --paper: #FFFFFF;
  --mist: #F3F3F2;
  --line: #E4E4E2;
  --grey: #8C8C88;
  --soft: #5C5C58;
  --display: 'Unbounded', sans-serif;
  --text: 'Manrope', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--text); background: #DCDCD8; color: var(--ink); -webkit-font-smoothing: antialiased; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.board { width: 1420px; padding: 54px 60px 60px; background: #DCDCD8; }
.board-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
.board-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: -0.5px; text-transform: uppercase; }
.board-head p { font-size: 17px; color: var(--soft); margin-top: 8px; max-width: 760px; line-height: 1.4; }
.board-head .tag { font-family: var(--display); font-size: 13px; letter-spacing: 2px; border: 1.5px solid var(--ink); padding: 8px 14px; border-radius: 99px; }
.phones { display: flex; gap: 44px; justify-content: center; }
.wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.label { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--soft); }
.phone { width: 390px; height: 844px; border-radius: 50px; overflow: hidden; position: relative; background: var(--paper);
  box-shadow: 0 0 0 10px #0B0B0B, 0 0 0 11px #3A3A38, 0 40px 80px -24px rgba(0,0,0,.45); display: flex; flex-direction: column; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font-weight: 700; font-size: 15px; z-index: 5; }
.status .r { display: flex; gap: 6px; align-items: center; }
.bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; }
.bat i { display: block; height: 100%; width: 72%; background: currentColor; border-radius: 1px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 6; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 7; }
.scroll { flex: 1; overflow: hidden; padding: 58px 20px 0; position: relative; }
.dark .status { color: #fff; } .dark .home-ind { background: #fff; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.word { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 3px; }
.ibtn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; position: relative; }
.ibtn .dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; background: var(--ink); border-radius: 50%; }
.hello { margin-top: 18px; font-size: 15px; color: var(--soft); }
.hello b { display: block; font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--ink); margin-top: 2px; letter-spacing: -0.3px; }

/* loyalty card */
.card { margin-top: 18px; background: var(--ink); color: #fff; border-radius: 26px; padding: 20px 20px 18px; position: relative; overflow: hidden; }
.card::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border: 1.5px solid rgba(255,255,255,.12); border-radius: 50%; }
.card::before { content: ''; position: absolute; right: -10px; top: -10px; width: 120px; height: 120px; border: 1.5px solid rgba(255,255,255,.12); border-radius: 50%; }
.card .row { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.card small { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255,255,255,.6); font-weight: 700; }
.lvl { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border: 1.5px solid rgba(255,255,255,.5); padding: 5px 10px; border-radius: 99px; }
.bal { font-family: var(--display); font-weight: 700; font-size: 50px; letter-spacing: -1px; margin-top: 12px; line-height: 1; position: relative; z-index: 1; }
.bal span { font-size: 16px; letter-spacing: 0; font-weight: 600; color: rgba(255,255,255,.7); margin-left: 6px; }
.card .sub { font-size: 13px; color: rgba(255,255,255,.6); margin-top: 8px; position: relative; z-index: 1; }
.card .foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.14); }
.num { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 3px; }
.qrbtn { display: flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); font-weight: 800; font-size: 14px; padding: 10px 14px; border-radius: 99px; }
.qrbtn svg.i { width: 18px; height: 18px; }

/* progress */
.box { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; }
.box h5 { font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; }
.box h5 span { color: var(--grey); font-weight: 700; }
.bar { height: 8px; background: var(--mist); border-radius: 4px; margin: 12px 0 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.steps { display: flex; justify-content: space-between; font-size: 12px; color: var(--grey); font-weight: 700; }
.steps .on { color: var(--ink); }

.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 6px; }
.sec h4 { font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .5px; }
.sec a { font-size: 13px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* operations */
.op { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.op:last-child { border-bottom: none; }
.op .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--mist); flex: none; }
.op .ic.neg { background: #fff; border: 1.5px solid var(--ink); }
.op .t { flex: 1; min-width: 0; }
.op .t b { font-size: 14.5px; font-weight: 800; display: block; }
.op .t span { font-size: 12.5px; color: var(--grey); font-weight: 500; }
.op .a { font-family: var(--display); font-weight: 600; font-size: 16px; white-space: nowrap; }
.op .a.neg { color: var(--soft); }

/* promo */
.promo { margin-top: 14px; border-radius: 22px; background: var(--mist); padding: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.promo b { font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: -1px; }
.promo p { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
.promo p span { display: block; color: var(--grey); font-weight: 500; margin-top: 2px; }

/* nav */
.nav { height: 84px; flex: none; display: flex; justify-content: space-around; padding: 10px 6px 0; border-top: 1px solid var(--line); background: #fff; position: relative; z-index: 4; }
.nav .it { width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--grey); }
.nav .it.on { color: var(--ink); }
.dark .nav { background: var(--ink); border-top-color: rgba(255,255,255,.1); }
.dark .nav .it { color: rgba(255,255,255,.45); } .dark .nav .it.on { color: #fff; } .dark .nav .it.on::before { background: #fff; }
.nav .it.on::before { content: ''; position: absolute; top: 0; width: 34px; height: 2.5px; background: var(--ink); border-radius: 2px; margin-top: -10px; }
.nav .it { position: relative; }

/* QR screen */
.qrwrap { text-align: center; margin-top: 30px; }
.qrwrap h2 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; }
.qrwrap p { color: var(--soft); font-size: 15px; margin-top: 8px; }
.qrframe { margin: 26px auto 0; width: 270px; height: 270px; border-radius: 28px; border: 1.5px solid var(--line); display: grid; place-items: center; position: relative; }
.qrframe svg { width: 210px; height: 210px; shape-rendering: crispEdges; }
.qrframe .logo { position: absolute; width: 56px; height: 56px; background: #fff; border-radius: 14px; display: grid; place-items: center; }
.qrframe .logo b { width: 44px; height: 44px; background: var(--ink); color: #fff; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-size: 18px; }
.code { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: 5px; margin-top: 22px; }
.mini { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
.mini div { border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 16px; text-align: left; min-width: 150px; }
.mini small { display: block; font-size: 12px; color: var(--grey); font-weight: 700; }
.mini b { font-family: var(--display); font-weight: 600; font-size: 18px; }
.hint { margin: 22px auto 0; display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 13px; color: var(--grey); font-weight: 700; }
.close { position: absolute; top: 58px; right: 20px; }

/* history */
.h1 { font-family: var(--display); font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: -0.3px; margin-top: 6px; }
.tabs { display: flex; gap: 8px; margin-top: 16px; }
.tabs span { padding: 9px 16px; border-radius: 99px; border: 1.5px solid var(--line); font-weight: 800; font-size: 13.5px; }
.tabs span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.totals div { background: var(--mist); border-radius: 18px; padding: 14px; }
.totals small { font-size: 12px; color: var(--grey); font-weight: 700; display: block; }
.totals b { font-family: var(--display); font-weight: 600; font-size: 20px; }
.day { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--grey); margin: 18px 0 2px; }
.warn { margin-top: 14px; border: 1.5px dashed var(--ink); border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 700; }

/* cashier */
.dark .phone, .phone.dark { background: var(--ink); color: #fff; }
.ctop { display: flex; justify-content: space-between; align-items: center; height: 44px; }
.ctop .w { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 2px; }
.ctop .store { font-size: 13px; font-weight: 700; border: 1.5px solid rgba(255,255,255,.3); padding: 7px 12px; border-radius: 99px; display: flex; gap: 6px; align-items: center; }
.ctop .store svg.i { width: 16px; height: 16px; }
.cam { margin-top: 18px; height: 360px; border-radius: 28px; background: radial-gradient(120% 90% at 50% 40%, #2a2a28, #121211); position: relative; display: grid; place-items: center; overflow: hidden; }
.cam .frame { width: 220px; height: 220px; position: relative; }
.cam .frame i { position: absolute; width: 44px; height: 44px; border: 4px solid #fff; }
.cam .frame i:nth-child(1) { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
.cam .frame i:nth-child(2) { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 16px 0 0; }
.cam .frame i:nth-child(3) { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 16px; }
.cam .frame i:nth-child(4) { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 16px 0; }
.cam .scanline { position: absolute; left: 18px; right: 18px; top: 46%; height: 2px; background: #fff; box-shadow: 0 0 16px 2px rgba(255,255,255,.6); }
.cam .ghost { position: absolute; inset: 70px; opacity: .09; }
.cam .ghost { color: #fff; }
.cam .ghost svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
.cam p { position: absolute; bottom: 18px; font-size: 14px; font-weight: 700; color: rgba(255,255,255,.75); }
.or { text-align: center; color: rgba(255,255,255,.45); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin: 16px 0 12px; }
.field { border: 1.5px solid rgba(255,255,255,.22); border-radius: 18px; height: 58px; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 18px; font-weight: 700; }
.field .pre { color: rgba(255,255,255,.55); }
.field .ph { color: rgba(255,255,255,.35); }
.field .go { margin-left: auto; width: 42px; height: 42px; border-radius: 13px; background: #fff; color: var(--ink); display: grid; place-items: center; }
.recent { margin-top: 18px; }
.recent small { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: rgba(255,255,255,.45); }
.rc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.av { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 15px; flex: none; }
.rc .t { flex: 1; } .rc b { font-size: 14.5px; display: block; } .rc span { font-size: 12.5px; color: rgba(255,255,255,.5); }
.rc .a { font-family: var(--display); font-size: 14px; }

.client { margin-top: 12px; border: 1.5px solid var(--line); border-radius: 22px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.client .av { background: var(--ink); color: #fff; width: 48px; height: 48px; font-size: 18px; }
.client .t { flex: 1; } .client b { font-size: 16px; font-weight: 800; display: block; } .client span { font-size: 13px; color: var(--grey); font-weight: 600; }
.client .bl { text-align: right; } .client .bl b { font-family: var(--display); font-weight: 600; font-size: 18px; } .client .bl span { font-size: 12px; }
.amount { margin-top: 16px; }
.amount small { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--grey); }
.amount .v { font-family: var(--display); font-weight: 700; font-size: 46px; letter-spacing: -1.5px; margin-top: 6px; display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.amount .v span { font-size: 18px; letter-spacing: 0; color: var(--grey); }
.amount .v i { width: 3px; height: 40px; background: var(--ink); align-self: center; animation: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--mist); border-radius: 16px; padding: 4px; margin-top: 16px; }
.seg span { text-align: center; padding: 11px 0; font-weight: 800; font-size: 14px; border-radius: 12px; color: var(--soft); }
.seg span.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.spend { margin-top: 12px; border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; }
.spend .r { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; }
.spend .r b { font-family: var(--display); font-size: 18px; }
.slider { height: 6px; background: var(--mist); border-radius: 3px; margin: 14px 0 10px; position: relative; }
.slider i { position: absolute; left: 0; top: 0; bottom: 0; width: 43%; background: var(--ink); border-radius: 3px; }
.slider b { position: absolute; left: 43%; top: 50%; width: 24px; height: 24px; background: #fff; border: 2.5px solid var(--ink); border-radius: 50%; transform: translate(-50%, -50%); }
.spend .lim { display: flex; justify-content: space-between; font-size: 12px; color: var(--grey); font-weight: 700; }
.sum { margin-top: 14px; font-size: 14.5px; }
.sum .r { display: flex; justify-content: space-between; padding: 5px 0; font-weight: 600; color: var(--soft); }
.sum .r b { color: var(--ink); font-weight: 800; }
.sum .tot { border-top: 1.5px solid var(--ink); margin-top: 6px; padding-top: 10px; color: var(--ink); font-size: 18px; font-weight: 800; }
.sum .tot b { font-family: var(--display); font-size: 22px; }
.earn { margin-top: 10px; background: var(--mist); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.earn b { font-family: var(--display); }
.bb { flex: none; padding: 12px 20px 30px; background: #fff; border-top: 1px solid var(--line); position: relative; z-index: 4; }
.cta { height: 58px; border-radius: 18px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 16.5px; }
.cta.inv { background: #fff; color: var(--ink); }
.cta.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.back { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; }

.done { text-align: center; margin-top: 46px; }
.done .ok { width: 96px; height: 96px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; margin: 0 auto; }
.done .ok svg.i { width: 46px; height: 46px; stroke-width: 2.4; }
.done h2 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; margin-top: 22px; }
.done p { color: var(--soft); margin-top: 6px; font-size: 15px; }
.receipt { margin: 24px 0 0; border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; text-align: left; position: relative; }
.receipt .r { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14.5px; font-weight: 600; color: var(--soft); }
.receipt .r b { color: var(--ink); font-weight: 800; }
.receipt hr { border: none; border-top: 1.5px dashed var(--line); margin: 8px 0; }
.receipt .big { color: var(--ink); font-weight: 800; font-size: 16px; }
.receipt .big b { font-family: var(--display); font-size: 22px; }
.newbal { margin-top: 12px; background: var(--ink); color: #fff; border-radius: 20px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
.newbal small { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: rgba(255,255,255,.6); }
.newbal b { font-family: var(--display); font-size: 26px; }

/* admin */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stats div { border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; }
.stats div.k { background: var(--ink); color: #fff; border-color: var(--ink); }
.stats small { font-size: 12px; font-weight: 700; color: var(--grey); display: block; }
.stats .k small { color: rgba(255,255,255,.6); }
.stats b { font-family: var(--display); font-weight: 600; font-size: 22px; display: block; margin-top: 6px; letter-spacing: -0.5px; }
.stats em { font-style: normal; font-size: 12px; font-weight: 800; }
.chart { margin-top: 12px; border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; }
.chart h5 { font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; }
.chart h5 span { color: var(--grey); font-weight: 700; }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; margin-top: 14px; }
.bars > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; height: 100%; }
.bars .p { background: var(--ink); border-radius: 6px 6px 2px 2px; flex: none; }
.bars .m { background: #BDBDB8; border-radius: 2px 2px 6px 6px; flex: none; }
.days { display: flex; gap: 10px; margin-top: 8px; } .days span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 800; color: var(--grey); }
.legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.rule { border: 1.5px solid var(--line); border-radius: 20px; padding: 6px 16px; margin-top: 12px; }
.rule .r { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rule .r:last-child { border-bottom: none; }
.rule .r .t { flex: 1; min-width: 0; padding-right: 12px; }
.rule .r .t b { font-size: 14.5px; font-weight: 800; display: block; } .rule .r .t span { font-size: 12.5px; color: var(--grey); font-weight: 600; }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; height: 38px; }
.stepper i { width: 32px; text-align: center; font-style: normal; font-size: 18px; color: var(--soft); }
.stepper b { min-width: 52px; text-align: center; font-family: var(--display); font-size: 14px; font-weight: 600; }
.lvls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.lvls div { border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; }
.lvls div:nth-child(3) { background: var(--ink); color: #fff; border-color: var(--ink); }
.lvls small { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; color: var(--grey); }
.lvls div:nth-child(3) small { color: rgba(255,255,255,.6); }
.lvls b { display: block; font-family: var(--display); font-weight: 700; font-size: 26px; margin-top: 6px; }
.lvls span { font-size: 12px; font-weight: 700; color: var(--grey); }
.lvls div:nth-child(3) span { color: rgba(255,255,255,.6); }
