<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ISTANBUL — бонусная программа</title>
<link rel="stylesheet" href="base.css">
<style>
.board { width: 1900px; }
.board.w5 { width: 2400px; }
.board.w3 { width: 1440px; }
.stw .status { color: #fff; }
.phones { flex-wrap: wrap; row-gap: 56px; justify-content: flex-start; padding-left: 10px; }
.board-head h1 { letter-spacing: 1px; }
.group { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin: 12px 0 26px; display: flex; align-items: center; gap: 14px; }
.group::after { content: ''; flex: 1; height: 1.5px; background: #BDBDB8; }

/* splash / auth */
.splash { position: absolute; inset: 0; background: var(--ink); color: #fff; display: flex; flex-direction: column; padding: 90px 28px 46px; }
.splash .wm { font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: 6px; }
.splash .sub { font-size: 16px; color: rgba(255,255,255,.65); margin-top: 12px; line-height: 1.45; }
.splash .art { flex: 1; position: relative; margin: 26px 0; }
.splash .art img { position: absolute; width: 210px; filter: invert(1) brightness(1.1); opacity: .95; }
.splash .ring { position: absolute; border: 1.5px solid rgba(255,255,255,.16); border-radius: 50%; }
.splash .perk { display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 700; margin-top: 12px; }
.splash .perk b { min-width: 46px; height: 30px; padding: 0 8px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.4); display: grid; place-items: center; font-family: var(--display); font-size: 12px; }
.splash .cta { margin-top: 26px; }
.legal { font-size: 12px; color: var(--grey); text-align: center; margin-top: 12px; line-height: 1.4; }
.splash .legal { color: rgba(255,255,255,.45); }
.big-t { font-family: var(--display); font-weight: 700; font-size: 28px; text-transform: uppercase; line-height: 1.12; margin-top: 18px; }
.lead { font-size: 15px; color: var(--soft); margin-top: 10px; line-height: 1.45; }
.inp { margin-top: 22px; border: 1.5px solid var(--ink); border-radius: 18px; height: 62px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
.inp .pre { color: var(--grey); }
.inp .caret { width: 2px; height: 28px; background: var(--ink); }
.inp.light { border-color: var(--line); font-size: 16px; font-weight: 700; height: 56px; letter-spacing: 0; }
.inp.light .ph { color: var(--grey); font-weight: 600; }
.flabel { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--grey); margin: 18px 0 -12px 2px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 20px 0; }
.keypad span { height: 54px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 22px; border-radius: 16px; }
.keypad span.k { background: var(--mist); }
.dark .keypad span.k { background: #1D1D1B; color: #fff; }
.keypad svg.i { width: 26px; height: 26px; }
.otp { display: flex; gap: 12px; margin-top: 26px; }
.otp span { width: 62px; height: 70px; border: 1.5px solid var(--line); border-radius: 18px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 28px; }
.otp span.f { border-color: var(--ink); }
.otp span.cur { border-color: var(--ink); border-width: 2.5px; }
.resend { margin-top: 18px; font-size: 14px; color: var(--grey); font-weight: 700; }
.chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chips span { padding: 10px 16px; border: 1.5px solid var(--line); border-radius: 99px; font-weight: 800; font-size: 14px; }
.chips span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.gift { margin-top: 22px; background: var(--ink); color: #fff; border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.gift img { width: 52px; filter: invert(1); }
.gift b { font-family: var(--display); font-size: 22px; display: block; }
.gift span { font-size: 13px; color: rgba(255,255,255,.65); font-weight: 600; }
.check { display: flex; gap: 10px; margin-top: 16px; font-size: 13.5px; color: var(--soft); font-weight: 600; line-height: 1.4; }
.check i { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); flex: none; display: grid; place-items: center; color: #fff; }
.check i svg.i { width: 15px; height: 15px; stroke-width: 2.6; }

/* sheet */
.dim { position: absolute; inset: 0; background: rgba(11,11,11,.42); z-index: 8; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 30px 30px 0 0; padding: 12px 20px 34px; z-index: 9; }
.grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 0 auto 14px; }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; }
.sheet .amt { font-family: var(--display); font-weight: 700; font-size: 44px; letter-spacing: -1px; margin-top: 14px; }
.sheet .when { color: var(--grey); font-weight: 700; font-size: 14px; }
.kv { margin-top: 14px; border-top: 1.5px solid var(--line); }
.kv div { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--soft); font-weight: 600; }
.kv div b { color: var(--ink); font-weight: 800; }
.items { margin-top: 12px; display: grid; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; background: var(--mist); border-radius: 16px; padding: 10px; }
.item img { width: 42px; height: 42px; object-fit: contain; }
.item .t { flex: 1; font-size: 14px; font-weight: 800; } .item .t span { display: block; font-size: 12.5px; color: var(--grey); font-weight: 600; }
.item b { font-family: var(--display); font-size: 14px; }

/* levels */
.lvlcards { display: grid; gap: 10px; margin-top: 16px; }
.lc { border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
.lc.cur { border-color: var(--ink); border-width: 2px; }
.lc.gold { background: var(--ink); color: #fff; border-color: var(--ink); }
.lc small { font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--grey); }
.lc.gold small { color: rgba(255,255,255,.6); }
.lc .n { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; margin-top: 4px; }
.lc .d { font-size: 13px; color: var(--grey); font-weight: 600; margin-top: 4px; }
.lc.gold .d { color: rgba(255,255,255,.6); }
.lc .p { font-family: var(--display); font-weight: 700; font-size: 34px; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; background: var(--ink); color: #fff; padding: 4px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; }
.faq { margin-top: 18px; }
.faq div { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; font-weight: 800; font-size: 14.5px; }

/* promos */
.pcard { margin-top: 14px; border-radius: 24px; overflow: hidden; position: relative; }
.pcard .pic { height: 170px; background: var(--mist); position: relative; }
.pcard .pic img { position: absolute; right: 10px; bottom: -6px; height: 150px; }
.pcard .pic .x { position: absolute; left: 18px; top: 16px; font-family: var(--display); font-weight: 700; font-size: 46px; letter-spacing: -1.5px; }
.pcard.dk .pic { background: var(--ink); color: #fff; } .pcard.dk .pic img { filter: invert(1); }
.pcard .txt { padding: 14px 16px 16px; border: 1.5px solid var(--line); border-top: none; border-radius: 0 0 24px 24px; }
.pcard .txt b { font-size: 16px; font-weight: 800; display: block; }
.pcard .txt span { font-size: 13px; color: var(--grey); font-weight: 600; }
.hero { height: 300px; margin: -58px -20px 0; background: var(--ink); color: #fff; position: relative; overflow: hidden; }
.hero img { position: absolute; right: -10px; bottom: -20px; height: 260px; filter: invert(1); }
.hero .x { position: absolute; left: 20px; bottom: 26px; font-family: var(--display); font-weight: 700; font-size: 80px; letter-spacing: -3px; line-height: .9; }
.hero .x small { display: block; font-size: 14px; letter-spacing: 2px; font-weight: 600; color: rgba(255,255,255,.6); margin-bottom: 8px; }
.hero .bk { position: absolute; top: 56px; left: 20px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }
.rules { margin-top: 10px; }
.rules div { display: flex; gap: 12px; padding: 10px 0; font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.rules div b { font-family: var(--display); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; flex: none; }

/* stores */
.map { margin-top: 14px; height: 210px; border-radius: 24px; background: var(--mist); position: relative; overflow: hidden; }
.map .road { position: absolute; background: #fff; }
.map .pin { position: absolute; width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--ink); display: grid; place-items: center; }
.map .pin i { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.store { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.store .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--mist); display: grid; place-items: center; flex: none; }
.store .t { flex: 1; } .store b { font-size: 15px; font-weight: 800; display: block; } .store span { font-size: 13px; color: var(--grey); font-weight: 600; }
.open { font-size: 12px; font-weight: 800; border: 1.5px solid var(--ink); padding: 4px 9px; border-radius: 99px; align-self: flex-start; }
.open.off { border-color: var(--line); color: var(--grey); }

/* profile */
.prof { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.prof .av { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 22px; }
.prof b { font-family: var(--display); font-weight: 600; font-size: 20px; display: block; } .prof span { color: var(--grey); font-weight: 700; font-size: 14px; }
.list { margin-top: 16px; border: 1.5px solid var(--line); border-radius: 22px; padding: 0 16px; }
.list div { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 14.5px; }
.list div:last-child { border-bottom: none; }
.list div .v { margin-left: auto; color: var(--grey); font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.list div svg.i { width: 20px; height: 20px; }
.list div .toggle { margin-left: auto; }
.cap { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--grey); margin: 20px 0 -6px 4px; }

/* notifications */
.nt { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.nt .ic { width: 42px; height: 42px; border-radius: 14px; background: var(--mist); display: grid; place-items: center; flex: none; }
.nt.new .ic { background: var(--ink); color: #fff; }
.nt b { font-size: 14.5px; font-weight: 800; display: block; } .nt p { font-size: 13.5px; color: var(--soft); margin-top: 2px; line-height: 1.4; } .nt span { font-size: 12px; color: var(--grey); font-weight: 700; display: block; margin-top: 4px; }

/* empty */
.empty { text-align: center; margin-top: 110px; }
.empty .c { width: 120px; height: 120px; border-radius: 50%; background: var(--mist); margin: 0 auto; display: grid; place-items: center; }
.empty .c img { width: 70px; }
.empty h3 { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; margin-top: 22px; }
.empty p { color: var(--soft); margin-top: 8px; font-size: 15px; line-height: 1.45; }

/* cashier */
.pinwrap { text-align: center; padding-top: 30px; }
.pinwrap .wm { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 4px; }
.pinwrap p { color: rgba(255,255,255,.6); margin-top: 10px; font-size: 15px; }
.dots { display: flex; justify-content: center; gap: 16px; margin: 30px 0 10px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); }
.dots i.f { background: #fff; border-color: #fff; }
.who { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 18px; }
.who .av { width: 44px; height: 44px; }
.who b { font-size: 15px; display: block; text-align: left; } .who span { font-size: 12.5px; color: rgba(255,255,255,.5); font-weight: 600; }
.cprof { margin-top: 16px; background: var(--ink); color: #fff; border-radius: 26px; padding: 18px; }
.cprof .row { display: flex; align-items: center; gap: 12px; }
.cprof .av { background: #fff; color: var(--ink); width: 52px; height: 52px; font-size: 18px; }
.cprof b { font-size: 17px; display: block; } .cprof span { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 600; }
.cprof .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.cprof .nums div { background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px; }
.cprof .nums small { font-size: 11.5px; color: rgba(255,255,255,.55); font-weight: 700; display: block; }
.cprof .nums b { font-family: var(--display); font-size: 17px; margin-top: 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.tile { border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-weight: 800; font-size: 14.5px; }
.tile.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tile span { font-size: 12.5px; font-weight: 600; color: var(--grey); }
.tile.on span { color: rgba(255,255,255,.6); }
.shift { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.shift div { background: var(--mist); border-radius: 16px; padding: 12px; }
.shift small { font-size: 11.5px; color: var(--grey); font-weight: 700; display: block; }
.shift b { font-family: var(--display); font-size: 17px; margin-top: 4px; display: block; }
.refund { margin-top: 14px; border: 2px solid var(--ink); border-radius: 22px; padding: 16px; }
.refund .h { display: flex; justify-content: space-between; font-weight: 800; }
.note { margin-top: 12px; background: var(--mist); border-radius: 16px; padding: 12px 14px; font-size: 13.5px; font-weight: 600; color: var(--soft); line-height: 1.45; display: flex; gap: 10px; }
.note svg.i { width: 20px; height: 20px; color: var(--ink); }
.cta.red { background: #fff; color: var(--ink); border: 2px solid var(--ink); }
.search { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 16px; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--grey); font-weight: 600; }
.row2 { display: flex; justify-content: space-between; align-items: center; }
.pill { font-size: 12px; font-weight: 800; border: 1.5px solid var(--line); padding: 4px 9px; border-radius: 99px; }
.pill.dk { background: var(--ink); color: #fff; border-color: var(--ink); }
.cl { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cl .av { background: var(--mist); color: var(--ink); width: 42px; height: 42px; font-size: 14px; }
.cl .t { flex: 1; } .cl b { font-size: 14.5px; font-weight: 800; display: block; } .cl span { font-size: 12.5px; color: var(--grey); font-weight: 600; }
.cl .r { text-align: right; } .cl .r b { font-family: var(--display); font-size: 15px; }
.adj { margin-top: 14px; border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; }
.adj .seg { margin-top: 0; }
.adj .inp { margin-top: 12px; height: 56px; font-size: 20px; }
.form .inp.light { margin-top: 10px; }
.period { display: flex; gap: 8px; margin-top: 10px; }
.period .inp.light { flex: 1; margin-top: 0; }

/* rating */
.rhead { display: flex; justify-content: space-between; align-items: flex-end; }
.timer { text-align: right; font-size: 12px; font-weight: 800; color: var(--grey); letter-spacing: .5px; }
.timer b { display: block; font-family: var(--display); font-size: 15px; color: var(--ink); letter-spacing: 0; margin-top: 2px; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin-top: 18px; }
.pd { text-align: center; }
.pd .av { width: 54px; height: 54px; margin: 0 auto; background: var(--mist); color: var(--ink); font-size: 17px; border: 2px solid var(--ink); }
.pd.first .av { width: 66px; height: 66px; background: var(--ink); color: #fff; font-size: 20px; }
.pd .crown { width: 22px; height: 22px; margin: 0 auto 4px; display: block; }
.pd .nm { font-size: 13px; font-weight: 800; margin-top: 8px; }
.pd .pts { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--soft); margin-top: 2px; }
.pd .step { margin-top: 10px; background: var(--mist); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; }
.pd.first .step { background: var(--ink); color: #fff; }
.pd .prize { font-family: var(--text); font-size: 11.5px; font-weight: 800; color: var(--soft); }
.pd.first .prize { color: rgba(255,255,255,.7); }
.me { margin-top: 0; background: var(--ink); color: #fff; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.me .pl { font-family: var(--display); font-weight: 700; font-size: 22px; min-width: 40px; }
.me .av { background: #fff; color: var(--ink); width: 40px; height: 40px; font-size: 14px; }
.me .t { flex: 1; } .me b { font-size: 14.5px; display: block; } .me span { font-size: 12.5px; color: rgba(255,255,255,.65); font-weight: 600; }
.me .s { text-align: right; font-family: var(--display); font-size: 15px; }
.me .s small { display: block; font-family: var(--text); font-size: 11.5px; font-weight: 800; color: rgba(255,255,255,.6); }
.rk { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.rk .pl { font-family: var(--display); font-weight: 600; font-size: 15px; width: 28px; color: var(--soft); }
.rk .av { width: 38px; height: 38px; background: var(--mist); color: var(--ink); font-size: 13px; }
.rk .t { flex: 1; } .rk b { font-size: 14.5px; font-weight: 800; display: block; } .rk span { font-size: 12px; color: var(--grey); font-weight: 700; }
.rk .s { font-family: var(--display); font-size: 14.5px; font-weight: 600; }
.mv { font-size: 12px; font-weight: 800; margin-left: 4px; }
.rk.mine { background: var(--mist); border-radius: 16px; padding: 11px 10px; border-bottom: none; margin: 4px -10px; }
.gap { text-align: center; color: var(--grey); font-weight: 800; letter-spacing: 3px; padding: 4px 0; }
.stickme { flex: none; padding: 10px 20px 10px; background: #fff; border-top: 1px solid var(--line); position: relative; z-index: 4; }
.bigplace { text-align: center; margin-top: 10px; }
.bigplace small { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: var(--grey); }
.bigplace b { display: block; font-family: var(--display); font-weight: 700; font-size: 96px; letter-spacing: -4px; line-height: 1; margin-top: 6px; }
.bigplace span { font-size: 14px; font-weight: 700; color: var(--soft); }
.bigplace .up { display: inline-block; margin-top: 10px; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 99px; }
.ladder { margin-top: 18px; border: 1.5px solid var(--line); border-radius: 22px; padding: 6px 16px; }
.ld { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ld:last-child { border-bottom: none; }
.ld .n { font-size: 14px;  min-width: 46px; padding: 0 6px; height: 46px; border-radius: 14px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; flex: none; }
.ld.dk .n { background: var(--ink); color: #fff; }
.ld .t { flex: 1; } .ld b { font-size: 14.5px; font-weight: 800; display: block; } .ld span { font-size: 12.5px; color: var(--grey); font-weight: 600; }
.ld .bar { height: 5px; margin: 8px 0 0; }
.prizes { display: grid; gap: 8px; margin-top: 12px; }
.pz { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.pz .n { font-family: var(--display); font-weight: 700; font-size: 15px; min-width: 52px; }
.pz .t { flex: 1; font-size: 14px; font-weight: 800; } .pz .t span { display: block; font-size: 12.5px; color: var(--grey); font-weight: 600; }
.pz.dk { background: var(--ink); color: #fff; border-color: var(--ink); } .pz.dk .t span { color: rgba(255,255,255,.6); }
.result { position: absolute; inset: 0; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 96px 26px 40px; text-align: center; }
.result small { font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 800; color: rgba(255,255,255,.55); }
.result .medal { width: 168px; height: 168px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; margin: 30px 0 4px; position: relative; }
