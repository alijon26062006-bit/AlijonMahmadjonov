# Включает SFTP для клиентов хостинга БЕЗ полноценного shell-доступа.
# install.sh кладёт это в /etc/ssh/sshd_config.d/hosting.conf (Include-каталог,
# поддерживается OpenSSH ≥7.3; на более старых версиях дописать вручную в конец
# основного sshd_config).
#
# Требования: группа hosting-sftp существует (создаётся install.sh), каждый
# клиентский unix-пользователь состоит в этой группе (см. UnixProvisioner::createUser).
#
# ВАЖНО: сам по себе этот блок — не полноценная песочница. Основная защита —
# в том, что у клиента: (а) нет валидного login shell (/usr/sbin/nologin),
# (б) ChrootDirectory запирает его в собственном домашнем каталоге,
# (в) запрещены port forwarding / X11 / agent forwarding / tunnel — то есть
# SSH-туннель через клиентский аккаунт использовать нельзя.

Match Group hosting-sftp
    ChrootDirectory %h
    ForceCommand internal-sftp
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
