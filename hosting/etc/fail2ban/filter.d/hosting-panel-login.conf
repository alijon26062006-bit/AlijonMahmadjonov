# Матчит строки вида: [hosting-auth] failed login ip=1.2.3.4 identifier=...
# которые пишет Hosting\Controller\AuthController::login() при неверном пароле
# или срабатывании внутреннего rate limit. См. панельный error_log конкретного
# php-fpm пула панели (не пул клиента!).
[Definition]
failregex = \[hosting-auth\] failed login ip=<HOST>
ignoreregex =
