# Минимальный набор jail'ов для shared-хостинга. install.sh кладёт это в
# /etc/fail2ban/jail.d/hosting.conf. Application-level rate limit (login_attempts
# в БД панели, см. Hosting\Service\Auth::isLoginRateLimited) работает НЕЗАВИСИМО
# от Fail2ban — это вторая линия защиты, а не замена первой.

[sshd]
enabled  = true
port     = ssh
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 1h

[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/hosting/*-error.log
maxretry = 5
findtime = 10m
bantime  = 1h

[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/hosting/*-access.log
maxretry = 10
findtime = 10m
bantime  = 1h

# Логин панели: AuthController пишет отдельную строку в error_log панели при
# каждой неудачной попытке (см. фильтр hosting-panel-login.conf) — так jail
# не зависит от того, как nginx форматирует access log.
[hosting-panel-login]
enabled  = true
port     = http,https
filter   = hosting-panel-login
logpath  = /var/log/hosting/panel-php-error.log
maxretry = 5
findtime = 10m
bantime  = 1h
