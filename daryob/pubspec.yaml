name: daryob
description: "DARYOB — classifieds marketplace for Tajikistan."
publish_to: 'none'

# versionName+versionCode. Bump versionCode on every store/APK release.
version: 0.3.0+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.0.0
  intl: ^0.20.2

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  crypto: ^3.0.6

  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

  cached_network_image: ^4.0.7
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  geolocator: ^14.1.2
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
    - assets/catalog/
    - assets/categories/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
